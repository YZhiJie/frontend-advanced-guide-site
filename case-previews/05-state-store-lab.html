<style>
:root{--bg:#0f1115;--panel:#171a21;--line:#2a2f3a;--tx:#dde1e8;--dim:#8b93a3;--brand:#5eead4;--err:#f87171;--ok:#86efac;--info:#93c5fd}
*{box-sizing:border-box;margin:0}
html,body{background:var(--bg);color:var(--tx);font:14px/1.6 ui-sans-serif,system-ui,"PingFang SC","Microsoft YaHei",sans-serif;padding:16px 18px 28px}
h1{font-size:16px;margin-bottom:2px}
header p{color:var(--dim);font-size:12px;margin-bottom:12px}
.sec{margin-top:16px;padding:12px 14px;background:var(--panel);border:1px solid var(--line);border-radius:10px}
.sec h2{font-size:13px;margin-bottom:8px;color:var(--brand)}
.hint{font-size:12px;color:var(--dim);margin:-4px 0 8px}
.btn-row{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:8px}
button{font:12px/1 inherit;padding:7px 12px;border-radius:8px;border:1px solid var(--line);background:#1f2430;color:var(--tx);cursor:pointer}
button:hover{border-color:var(--brand);color:var(--brand)}
button.primary{background:var(--brand);border-color:var(--brand);color:#06281f;font-weight:600}
button.danger{border-color:#7f1d1d;color:var(--err)}
button:disabled{opacity:.45;cursor:not-allowed}
.in,.ta{width:100%;font:12px/1.6 ui-monospace,SFMono-Regular,Menlo,monospace;background:#0c0e13;color:var(--tx);border:1px solid var(--line);border-radius:8px;padding:8px 10px;margin-bottom:8px}
.ta{resize:vertical;white-space:pre}
.out{background:#0c0e13;border:1px solid var(--line);border-radius:8px;padding:8px 10px;max-height:300px;overflow:auto;font:12px/1.7 ui-monospace,SFMono-Regular,Menlo,monospace}
.ln{white-space:pre-wrap;word-break:break-all}
.ln.ok{color:var(--ok)}.ln.err{color:var(--err)}.ln.dim{color:var(--dim)}.ln.info{color:var(--info)}
.blk{white-space:pre-wrap;word-break:break-all;color:var(--tx)}
.blk.ok{color:var(--ok)}.blk.err{color:var(--err)}.blk.dim{color:var(--dim)}
.tbl .tr{display:flex;gap:10px;padding:1px 0}
.tbl code{color:var(--info);min-width:140px;flex-shrink:0}
footer{margin-top:14px;color:var(--dim);font-size:11px}
footer a{color:var(--brand)}
</style>
