.ta{resize:vertical;white-space:pre}
.out{background:#0c0e13;border:1px solid var(--line);border-radius:8px;padding:8px 10px;max-height:300px;overflow:auto;font:12px/1.7 ui-monospace,SFMono-Regular,Menlo,monospace}
.ln{white-space:pre-wrap;word-break:break-all}
.ln.ok{color:var(--ok)}.ln.err{color:var(--err)}.ln.dim{color:var(--dim)}.ln.info{color:var(--info)}
.blk{white-space:pre-wrap;word-break:break-all;color:var(--tx)}
.blk.ok{color:var(--ok)}.blk.err{color:var(--err)}.blk.dim{color:var(--dim)}
.tbl .tr{display:flex;gap:10px;padding:1px 0}
.tbl code{color:var(--info);min-width:140px;flex-shrink:0}
footer{margin-top:14px;color:var(--dim);font-size:11px}
footer a{color:var(--brand)}
</style>
