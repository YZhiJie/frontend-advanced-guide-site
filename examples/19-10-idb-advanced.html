<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<title>IndexedDB 进阶：迁移 / 游标分页 / 分块批写</title>
<style>
  body { font: 14px/1.6 system-ui, sans-serif; margin: 32px; }
  button { margin-right: 8px; }
  pre { background: #f5f5f5; padding: 12px; white-space: pre-wrap; }
</style>
</head>
<body>
<h1>IndexedDB 进阶实验</h1>
<p>打开 DevTools → Application → IndexedDB 观察 <code>fag-advanced</code>。</p>
<button id="migrate">升级到 v3</button>
<button id="seed">写入 1000 条</button>
<button id="page">游标分页</button>
<button id="quota">模拟配额不足</button>
<pre id="log"></pre>
<script>
const DB_NAME = "fag-advanced";
const log = (msg) => (document.getElementById("log").textContent += msg + "\n");

/** v1 建 books；v2 加 by-author 索引；v3 加 by-updated 索引并回填 */
function openDB() {
  return new Promise((resolve, reject) => {
    const req = indexedDB.open(DB_NAME, 3);
    req.onupgradeneeded = (event) => {
      const db = req.result;
      const tx = req.transaction;
      if (event.oldVersion < 1) {
        const books = db.createObjectStore("books", { keyPath: "id" });
        books.createIndex("by-title", "title", { unique: false });
      }
      if (event.oldVersion < 2) {
        tx.objectStore("books").createIndex("by-author", "author", { unique: false });
      }
      if (event.oldVersion < 3) {
        const store = tx.objectStore("books");
        store.createIndex("by-updated", "updatedAt", { unique: false });
        // 回填：升级事务里可以继续读写旧数据
        store.openCursor().onsuccess = (e) => {
          const cursor = e.target.result;
          if (!cursor) return;
          const row = cursor.value;
          if (!row.updatedAt) cursor.update({ ...row, updatedAt: Date.now() });
          cursor.continue();
        };
      }
    };
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
    req.onblocked = () => reject(new Error("另一个标签页还开着旧版本，升级被阻塞"));
  });
}

async function bulkPut(db, rows, chunkSize = 200) {
  // 分块：每块一个事务，避免单个长事务持锁过久、也便于失败重试
  for (let i = 0; i < rows.length; i += chunkSize) {
    const chunk = rows.slice(i, i + chunkSize);
    await new Promise((resolve, reject) => {
      const tx = db.transaction("books", "readwrite");
      const store = tx.objectStore("books");
      for (const row of chunk) store.put(row);
      tx.oncomplete = () => resolve();
      tx.onerror = () => reject(tx.error);
      tx.onabort = () => reject(tx.error);
    });
    log(`写入 ${Math.min(i + chunkSize, rows.length)}/${rows.length}`);
  }
}

/** 游标分页：不要 getAll() 全量拉，按 key 继续 */
function readPage(db, afterId = null, pageSize = 20) {
  return new Promise((resolve, reject) => {
    const rows = [];
    const tx = db.transaction("books", "readonly");
    const range = afterId === null ? null : IDBKeyRange.lowerBound(afterId, true);
    const req = tx.objectStore("books").openCursor(range);
    req.onsuccess = (e) => {
      const cursor = e.target.result;
      if (!cursor || rows.length >= pageSize) return resolve(rows);
      rows.push(cursor.value);
      cursor.continue();
    };
    req.onerror = () => reject(req.error);
  });
}

document.getElementById("migrate").onclick = async () => {
  const db = await openDB();
  log(`数据库已打开，版本 ${db.version}`);
};
document.getElementById("seed").onclick = async () => {
  const db = await openDB();
  const rows = Array.from({ length: 1000 }, (_, i) => ({
    id: `b-${String(i).padStart(4, "0")}`,
    title: `书 ${i}`,
    author: `作者 ${i % 10}`,
    updatedAt: Date.now(),
  }));
  await bulkPut(db, rows);
  log("1000 条写入完成");
};
document.getElementById("page").onclick = async () => {
  const db = await openDB();
  const first = await readPage(db, null, 20);
  const second = await readPage(db, first.at(-1)?.id ?? null, 20);
  log(`第一页 ${first.length} 条，第二页首条 ${second[0]?.id}`);
};
document.getElementById("quota").onclick = async () => {
  const db = await openDB();
  try {
    // 真实配额不会靠这个触发；这里只演示错误分支的写法
    await bulkPut(db, [{ id: "huge", title: "x".repeat(5_000_000), author: "x" }], 1);
  } catch (err) {
    if (err?.name === "QuotaExceededError") {
      log("配额不足：应触发上层清理 + 重试，而不是静默丢数据");
    } else {
      log(`写入失败：${err?.name ?? err}`);
    }
  }
};
</script>
</body>
</html>
