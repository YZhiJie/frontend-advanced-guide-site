# 容器内 Nginx 配置（非 root 镜像 nginxinc/nginx-unprivileged）
# 与 frontend.conf 的差异：不监听 80/443、不做 TLS 终结（由 Ingress / 边缘网关负责），
# 只监听 8080 并服务静态产物；缓存分层与 SPA 回退规则保持一致。

map $uri $cache_control {
    default                              "no-cache";
    ~^/assets/                           "public, max-age=31536000, immutable";
    ~^/(images|fonts|media)/             "public, max-age=2592000";
    =/index.html                         "no-cache";
    =/sw.js                              "no-cache";
    =/manifest.webmanifest               "public, max-age=3600";
}

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Cache-Control $cache_control always;

    gzip on;
    gzip_static on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_types text/plain text/css application/javascript application/json application/manifest+json application/xml image/svg+xml;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location /assets/ {
        access_log off;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
