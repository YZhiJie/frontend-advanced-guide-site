# 前端生产 Nginx 总装配置（宿主机 / 边缘机部署）
# 放置位置：/etc/nginx/conf.d/frontend.conf
# 依赖：nginx >= 1.25.1（`http2 on` 语法）；更早版本把 `http2 on;` 删掉，
#       并把 `listen 443 ssl;` 改为 `listen 443 ssl http2;`
# 证书：certbot --nginx -d app.example.com 生成；续期由
#       `certbot renew --deploy-hook "nginx -s reload"` 完成（见 127.4）
# brotli：需要 ngx_brotli 模块（OpenResty 自带；官方 nginx 需自行编译）。
#         未安装时删除 brotli 开头的 4 行，否则 nginx -t 会报 unknown directive。

upstream frontend_bff {
    zone frontend_bff 64k;
    server 127.0.0.1:3000 max_fails=3 fail_timeout=10s;
    keepalive 32;
    keepalive_requests 1000;
    keepalive_timeout 60s;
}

# 缓存分层：用 map 统一在 server 层注入 Cache-Control。
# 原因：nginx 的 add_header 不会从父级继承——只要 location 里出现任何 add_header，
# server 层的全部 add_header 都会失效（安全头一起丢）。所以这里只允许 server 层
# 出现 add_header，location 里一律不写。
map $uri $cache_control {
    default                              "no-cache";
    ~^/assets/                           "public, max-age=31536000, immutable";
    ~^/(images|fonts|media)/             "public, max-age=2592000";
    =/index.html                         "no-cache";
    =/sw.js                              "no-cache";
    =/manifest.webmanifest               "public, max-age=3600";
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name app.example.com;

    # certbot webroot 续期通道：必须放在 301 之前，否则 ACME 校验被重定向
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;

    server_name app.example.com;

    ssl_certificate     /etc/letsencrypt/live/app.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    ssl_stapling on;
    ssl_stapling_verify on;
    resolver 1.1.1.1 8.8.8.8 valid=300s;
    resolver_timeout 5s;

    # 蓝绿 / 灰度切换点：current 是指向 releases/<sha> 的软链
    root /var/www/frontend/current;
    index index.html;

    server_tokens off;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' https://api.example.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    add_header Cache-Control $cache_control always;

    gzip on;
    gzip_static on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_types text/plain text/css application/javascript application/json application/manifest+json application/xml image/svg+xml;

    brotli on;
    brotli_static on;
    brotli_comp_level 6;
    brotli_types text/plain text/css application/javascript application/json application/manifest+json application/xml image/svg+xml;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location /api/ {
        proxy_pass http://frontend_bff;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-Id $request_id;
        proxy_connect_timeout 3s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        # SSE / 流式响应必须关闭缓冲，否则前端收不到增量
        proxy_buffering off;
    }

    # 带内容哈希的资源：文件名变了才发新请求，可以放心一年 immutable
    location /assets/ {
        access_log off;
        try_files $uri =404;
    }

    # HTML 入口不缓存，保证发版后下一次导航就能拿到新引用
    location = /index.html {
        try_files $uri =404;
    }

    location = /sw.js {
        try_files $uri =404;
    }

    # SPA history 路由回退：未知路径交给前端路由
    location / {
        try_files $uri $uri/ /index.html;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        internal;
    }

    access_log /var/log/nginx/frontend.access.log;
    error_log  /var/log/nginx/frontend.error.log warn;
}
