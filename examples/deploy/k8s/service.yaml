apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: web
  labels:
    app.kubernetes.io/name: frontend
    app.kubernetes.io/component: web
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: frontend
    app.kubernetes.io/component: web
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: v1
kind: Service
metadata:
  name: bff
  namespace: web
  labels:
    app.kubernetes.io/name: bff
    app.kubernetes.io/component: api
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: bff
    app.kubernetes.io/component: api
  ports:
    - name: http
      port: 3000
      targetPort: http
