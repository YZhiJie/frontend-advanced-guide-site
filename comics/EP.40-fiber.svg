<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 840" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#101a33"/>
    </linearGradient>
    <linearGradient id="titleGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="840" fill="url(#bg)"/>
  <polygon points="980,0 1060,0 760,840 680,840" fill="#a78bfa" opacity="0.05"/>
  <polygon points="150,0 220,0 1040,840 970,840" fill="#22d3ee" opacity="0.03"/>

  <rect x="20" y="14" width="92" height="36" rx="9" fill="#7C3AED"/>
  <text x="66" y="38" text-anchor="middle" font-size="18" font-weight="bold" fill="#ffffff">EP.40</text>
  <text x="126" y="40" font-size="26" font-weight="bold" fill="url(#titleGrad)">Fiber 为啥长这样</text>
  <text x="1180" y="38" text-anchor="end" font-size="13" fill="#64748b">进阶漫画剧场 · 霓虹墨 NEON INK</text>
  <rect x="20" y="62" width="1160" height="2" rx="1" fill="url(#titleGrad)" opacity="0.6"/>

    <g transform="translate(20,84)">
    <rect width="572" height="361" rx="14" fill="#0e1730" stroke="#223055"/>
    <polygon points="380,0 450,0 120,361 50,361" fill="#22d3ee" opacity="0.04"/>
    <rect x="14" y="13" width="26" height="20" rx="6" fill="#22d3ee"/>
    <text x="27" y="28" text-anchor="middle" font-size="14" font-weight="bold" fill="#0b1220">1</text>
    <text x="50" y="29" font-size="17" font-weight="bold" fill="#e2e8f0">困境：三指针看不懂</text>
    <g transform="translate(52,110)">
      <rect x="-19" y="14" width="38" height="22" rx="9" fill="#1d4ed8"/>
      <path d="M-5,18 L5,18 L3.5,27 L0,29 L-3.5,27 Z" fill="#f97316"/>
      <circle cx="0" cy="-2" r="16" fill="#ffd9b3"/>
      <path d="M-16,-2 L-11,-13 L-6,-4 L0,-14 L6,-4 L11,-13 L16,-2 Q0,-11 -16,-2 Z" fill="#f97316"/>
      <circle cx="-5" cy="0" r="1.7" fill="#0b1220"/>
      <circle cx="5" cy="0" r="1.7" fill="#0b1220"/>
      <path d="M-3,5 q3,3 6,0" stroke="#0b1220" stroke-width="1.3" fill="none"/>
    </g>
    <polygon points="88,100 74,106 88,112" fill="#f8fafc"/>
    <rect x="88" y="76" width="440" height="58" rx="10" fill="#f8fafc"/>
    <text x="102" y="100" font-size="15" fill="#0b1220">看 React 源码：child / sibling / return？</text>
    <text x="102" y="122" font-size="15" fill="#0b1220">为啥不是 parent + children[]？</text>
    <rect x="24" y="152" width="524" height="118" rx="8" fill="#0a0f1c" stroke="#22d3ee" stroke-opacity="0.35"/>
    <text x="38" y="174" font-size="12.5" fill="#fbbf24" font-family="'SF Mono',Consolas,monospace">// Fiber 节点结构</text>
    <text x="38" y="192" font-size="12.5" fill="#7dd3fc" font-family="'SF Mono',Consolas,monospace">{</text>
    <text x="54" y="210" font-size="12.5" fill="#a78bfa" font-family="'SF Mono',Consolas,monospace">  child: Fiber | null,     // 第一个子节点</text>
    <text x="54" y="228" font-size="12.5" fill="#a78bfa" font-family="'SF Mono',Consolas,monospace">  sibling: Fiber | null,  // 下一个兄弟</text>
    <text x="54" y="246" font-size="12.5" fill="#a78bfa" font-family="'SF Mono',Consolas,monospace">  return: Fiber | null,   // 父节点</text>
    <text x="38" y="264" font-size="12.5" fill="#7dd3fc" font-family="'SF Mono',Consolas,monospace">}</text>
    <text x="38" y="282" font-size="12.5" fill="#64748b" font-family="'SF Mono',Consolas,monospace">// 单向链表，为啥不搞双向？</text>
    <rect x="24" y="278" width="524" height="52" rx="8" fill="#111a30" stroke="#1e2a44"/>
    <rect x="24" y="278" width="4" height="52" rx="2" fill="#22d3ee"/>
    <text x="40" y="300" font-size="13.5" fill="#e2e8f0">答案藏在"时间切片"里——不能递归，只能可中断遍历。</text>
    <text x="40" y="320" font-size="13.5" fill="#94a3b8">递归调用栈爆了，谁来帮你恢复现场？</text>
  </g>

    <g transform="translate(608,84)">
    <rect width="572" height="361" rx="14" fill="#0e1730" stroke="#223055"/>
    <polygon points="420,0 480,0 150,361 90,361" fill="#a78bfa" opacity="0.05"/>
    <rect x="14" y="13" width="26" height="20" rx="6" fill="#a78bfa"/>
    <text x="27" y="28" text-anchor="middle" font-size="14" font-weight="bold" fill="#0b1220">2</text>
    <text x="50" y="29" font-size="17" font-weight="bold" fill="#e2e8f0">揭秘：链表 = 可恢复的栈</text>
    <g transform="translate(52,110)">
      <rect x="-19" y="14" width="38" height="22" rx="9" fill="#cbd5e1"/>
      <circle cx="0" cy="-2" r="16" fill="#ffd9b3"/>
      <path d="M-16,-2 a16,16 0 0 1 32,0 q-3,-12 -16,-12 q-13,0 -16,12 z" fill="#e2e8f0"/>
      <circle cx="-5" cy="0" r="4" fill="none" stroke="#94a3b8" stroke-width="1.4"/>
      <circle cx="5" cy="0" r="4" fill="none" stroke="#94a3b8" stroke-width="1.4"/>
      <path d="M-1,0 L1,0" stroke="#94a3b8" stroke-width="1.4"/>
      <circle cx="-5" cy="0" r="1.4" fill="#0b1220"/>
      <circle cx="5" cy="0" r="1.4" fill="#0b1220"/>
      <path d="M-8,5 q8,7 16,0 q-2,7 -8,7 q-6,0 -8,-7 z" fill="#e2e8f0"/>
    </g>
    <polygon points="88,100 74,106 88,112" fill="#f8fafc"/>
    <rect x="88" y="76" width="440" height="58" rx="10" fill="#f8fafc"/>
    <text x="102" y="100" font-size="15" fill="#0b1220">Fiber 链表 = 手动维护的遍历栈：</text>
    <text x="102" y="122" font-size="15" fill="#0b1220">child 下沉 / sibling 右走 / return 上升。</text>
    <rect x="24" y="152" width="524" height="84" rx="8" fill="#0a0f1c" stroke="#a78bfa" stroke-opacity="0.35"/>
    <text x="38" y="174" font-size="12.5" fill="#fbbf24" font-family="'SF Mono',Consolas,monospace">// workLoop：可中断循环</text>
    <text x="38" y="192" font-size="12.5" fill="#7dd3fc" font-family="'SF Mono',Consolas,monospace">let current = root;</text>
    <text x="38" y="210" font-size="12.5" fill="#34d399" font-family="'SF Mono',Consolas,monospace">while (current) {</text>
    <text x="54" y="228" font-size="12.5" fill="#7dd3fc" font-family="'SF Mono',Consolas,monospace">  current = beginWork(current);</text>
    <text x="38" y="246" font-size="12.5" fill="#34d399" font-family="'SF Mono',Consolas,monospace">  if (shouldYield()) break;  // 时间到了，保存 current</text>
    <text x="38" y="264" font-size="12.5" fill="#34d399" font-family="'SF Mono',Consolas,monospace">}</text>
    <rect x="24" y="258" width="524" height="72" rx="8" fill="#111a30" stroke="#1e2a44"/>
    <rect x="24" y="258" width="4" height="72" rx="2" fill="#a78bfa"/>
    <text x="40" y="282" font-size="13.5" fill="#e2e8f0">shouldYield = `frameDeadline.timeRemaining() &amp;lt; 1ms`</text>
    <text x="40" y="302" font-size="13.5" fill="#e2e8f0">保存 current，下次 `requestIdleCallback` 从它继续。</text>
    <text x="40" y="322" font-size="13.5" fill="#94a3b8">链表 = 遍历状态即节点本身 = 天然可挂起。</text>
  </g>

    <g transform="translate(20,462)">
    <rect width="572" height="361" rx="14" fill="#0e1730" stroke="#223055"/>
    <polygon points="380,0 450,0 120,361 50,361" fill="#f472b6" opacity="0.04"/>
    <rect x="14" y="13" width="26" height="20" rx="6" fill="#f472b6"/>
    <text x="27" y="28" text-anchor="middle" font-size="14" font-weight="bold" fill="#0b1220">3</text>
    <text x="50" y="29" font-size="17" font-weight="bold" fill="#e2e8f0">实证：手写 Fiber 切片</text>
    <g transform="translate(52,110)">
      <rect x="-19" y="14" width="38" height="22" rx="9" fill="#7C3AED"/>
      <circle cx="0" cy="-2" r="16" fill="#ffd9b3"/>
      <path d="M-16,-2 a16,16 0 0 1 32,0 q-2,-11 -16,-11 q-14,0 -16,11 z" fill="#22d3ee"/>
      <circle cx="15" cy="-11" r="6.5" fill="#22d3ee"/>
      <rect x="12" y="-9" width="6" height="4" rx="2" fill="#7C3AED"/>
      <circle cx="-5" cy="0" r="1.7" fill="#0b1220"/>
      <circle cx="5" cy="0" r="1.7" fill="#0b1220"/>
      <path d="M-3,5 q3,3 6,0" stroke="#0b1220" stroke-width="1.3" fill="none"/>
    </g>
    <polygon points="88,100 74,106 88,112" fill="#f8fafc"/>
    <rect x="88" y="76" width="440" height="58" rx="10" fill="#f8fafc"/>
    <text x="102" y="100" font-size="15" fill="#0b1220">1000 节点大组件，传统递归 render 卡死主线程；</text>
    <text x="102" y="122" font-size="15" fill="#0b1220">Fiber 切片后每次只跑 5ms，主线程丝滑。</text>
    <rect x="24" y="152" width="524" height="132" rx="8" fill="#0a0f1c" stroke="#f472b6" stroke-opacity="0.35"/>
    <text x="38" y="174" font-size="12.5" fill="#fbbf24" font-family="'SF Mono',Consolas,monospace">// Fiber 类</text>
    <text x="38" y="192" font-size="12.5" fill="#34d399" font-family="'SF Mono',Consolas,monospace">class Fiber {</text>
    <text x="54" y="210" font-size="12.5" fill="#7dd3fc" font-family="'SF Mono',Consolas,monospace">  child = null;</text>
    <text x="54" y="228" font-size="12.5" fill="#7dd3fc" font-family="'SF Mono',Consolas,monospace">  sibling = null;</text>
    <text x="54" y="246" font-size="12.5" fill="#7dd3fc" font-family="'SF Mono',Consolas,monospace">  return = null;</text>
    <text x="54" y="264" font-size="12.5" fill="#7dd3fc" font-family="'SF Mono',Consolas,monospace">  effectTag = 'update';</text>
    <text x="38" y="282" font-size="12.5" fill="#34d399" font-family="'SF Mono',Consolas,monospace">}</text>
    <text x="38" y="300" font-size="12.5" fill="#fbbf24" font-family="'SF Mono',Consolas,monospace">// requestIdleCallback 驱动循环</text>
    <text x="38" y="318" font-size="12.5" fill="#34d399" font-family="'SF Mono',Consolas,monospace">requestIdleCallback(workLoop, { timeout: 5000 });</text>
    <rect x="24" y="300" width="524" height="46" rx="8" fill="#111a30" stroke="#1e2a44"/>
    <rect x="24" y="300" width="4" height="46" rx="2" fill="#f472b6"/>
    <text x="40" y="322" font-size="13.5" fill="#e2e8f0">beginWork 创建子 Fiber（return 指向自己）；</text>
    <text x="40" y="342" font-size="13.5" fill="#94a3b8">completeWork 收集 DOM 更新，最后 commit 一次刷。</text>
  </g>

    <g transform="translate(608,462)">
    <rect width="572" height="361" rx="14" fill="#0e1730" stroke="#223055"/>
    <polygon points="420,0 480,0 150,361 90,361" fill="#f97316" opacity="0.04"/>
    <rect x="14" y="13" width="26" height="20" rx="6" fill="#f97316"/>
    <text x="27" y="28" text-anchor="middle" font-size="14" font-weight="bold" fill="#0b1220">4</text>
    <text x="50" y="29" font-size="17" font-weight="bold" fill="#e2e8f0">结案：三个方向要记牢</text>
    <g transform="translate(52,110)">
      <rect x="-19" y="14" width="38" height="22" rx="9" fill="#cbd5e1"/>
      <circle cx="0" cy="-2" r="16" fill="#ffd9b3"/>
      <path d="M-16,-2 a16,16 0 0 1 32,0 q-3,-12 -16,-12 q-13,0 -16,12 z" fill="#e2e8f0"/>
      <circle cx="-5" cy="0" r="4" fill="none" stroke="#94a3b8" stroke-width="1.4"/>
      <circle cx="5" cy="0" r="4" fill="none" stroke="#94a3b8" stroke-width="1.4"/>
      <path d="M-1,0 L1,0" stroke="#94a3b8" stroke-width="1.4"/>
      <circle cx="-5" cy="0" r="1.4" fill="#0b1220"/>
      <circle cx="5" cy="0" r="1.4" fill="#0b1220"/>
      <path d="M-8,5 q8,7 16,0 q-2,7 -8,7 q-6,0 -8,-7 z" fill="#e2e8f0"/>
    </g>
    <polygon points="88,100 74,106 88,112" fill="#f8fafc"/>
    <rect x="88" y="76" width="440" height="58" rx="10" fill="#f8fafc"/>
    <text x="102" y="100" font-size="15" fill="#0b1220">Fiber 三指针 = DFS 遍历状态的三个方向——</text>
    <text x="102" y="122" font-size="15" fill="#0b1220">理解了遍历，就懂了为啥这么设计。</text>
    <rect x="24" y="148" width="96" height="26" rx="13" fill="#f97316"/>
    <text x="72" y="166" text-anchor="middle" font-size="13" font-weight="bold" fill="#0b1220">⚠ 坑点</text>
    <rect x="32" y="183" width="9" height="9" rx="2" fill="#f97316"/>
    <text x="52" y="192" font-size="13.5" fill="#e2e8f0">child 指向第一个子节点，sibling 才是兄弟链表</text>
    <rect x="32" y="207" width="9" height="9" rx="2" fill="#f97316"/>
    <text x="52" y="216" font-size="13.5" fill="#e2e8f0">return 指向父 Fiber 本身，不是 parent DOM</text>
    <rect x="32" y="231" width="9" height="9" rx="2" fill="#f97316"/>
    <text x="52" y="240" font-size="13.5" fill="#e2e8f0">effectTag 要覆盖 place/update/delete 三种 commit 动作</text>
    <rect x="32" y="255" width="9" height="9" rx="2" fill="#f97316"/>
    <text x="52" y="264" font-size="13.5" fill="#e2e8f0">切片预算 5ms 够了，多了主线程又要卡</text>
    <rect x="24" y="278" width="524" height="52" rx="8" fill="#111a30" stroke="#1e2a44"/>
    <rect x="24" y="278" width="4" height="52" rx="2" fill="#f97316"/>
    <text x="40" y="300" font-size="13" font-weight="bold" fill="#f97316">码叔总结</text>
    <text x="118" y="300" font-size="13" fill="#e2e8f0">Fiber 不是新数据结构——它是"把递归改成可中断循环"。</text>
    <text x="40" y="320" font-size="13" fill="#e2e8f0">链表就是为了让遍历状态可以随时挂起恢复。</text>
  </g>

  <text x="1180" y="832" text-anchor="end" font-size="11" fill="#475569">NEON INK · frontend-advanced-guide · EP.40</text>
</svg>
