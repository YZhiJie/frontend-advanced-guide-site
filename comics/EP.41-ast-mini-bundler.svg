<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 840" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#101a33"/>
    </linearGradient>
    <linearGradient id="titleGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="840" fill="url(#bg)"/>
  <polygon points="980,0 1060,0 760,840 680,840" fill="#a78bfa" opacity="0.04"/>
  <polygon points="150,0 220,0 1040,840 970,840" fill="#22d3ee" opacity="0.03"/>

  <rect x="20" y="14" width="92" height="36" rx="9" fill="#7C3AED"/>
  <text x="66" y="38" text-anchor="middle" font-size="18" font-weight="bold" fill="#ffffff">EP.41</text>
  <text x="126" y="40" font-size="26" font-weight="bold" fill="url(#titleGrad)">AST 里藏了啥</text>
  <text x="1180" y="38" text-anchor="end" font-size="13" fill="#64748b">进阶漫画剧场 · 霓虹墨 NEON INK</text>
  <rect x="20" y="62" width="1160" height="2" rx="1" fill="url(#titleGrad)" opacity="0.6"/>

    <g transform="translate(20,84)">
    <rect width="572" height="361" rx="14" fill="#0e1730" stroke="#223055"/>
    <polygon points="380,0 450,0 120,361 50,361" fill="#22d3ee" opacity="0.04"/>
    <rect x="14" y="13" width="26" height="20" rx="6" fill="#22d3ee"/>
    <text x="27" y="28" text-anchor="middle" font-size="14" font-weight="bold" fill="#0b1220">1</text>
    <text x="50" y="29" font-size="17" font-weight="bold" fill="#e2e8f0">困境：tree-shaking 不全</text>
    <g transform="translate(52,110)">
      <rect x="-19" y="14" width="38" height="22" rx="9" fill="#1d4ed8"/>
      <path d="M-5,18 L5,18 L3.5,27 L0,29 L-3.5,27 Z" fill="#f97316"/>
      <circle cx="0" cy="-2" r="16" fill="#ffd9b3"/>
      <path d="M-16,-2 L-11,-13 L-6,-4 L0,-14 L6,-4 L11,-13 L16,-2 Q0,-11 -16,-2 Z" fill="#f97316"/>
      <circle cx="-5" cy="0" r="1.7" fill="#0b1220"/>
      <circle cx="5" cy="0" r="1.7" fill="#0b1220"/>
      <path d="M-3,5 q3,3 6,0" stroke="#0b1220" stroke-width="1.3" fill="none"/>
    </g>
    <polygon points="88,100 74,106 88,112" fill="#f8fafc"/>
    <rect x="88" y="76" width="440" height="58" rx="10" fill="#f8fafc"/>
    <text x="102" y="100" font-size="15" fill="#0b1220">tree-shaking 抖掉了没 import 的 export，</text>
    <text x="102" y="122" font-size="15" fill="#0b1220">为啥 export default 里的 dead code 还在？</text>
    <rect x="24" y="152" width="254" height="118" rx="8" fill="#0a0f1c" stroke="#22d3ee" stroke-opacity="0.35"/>
    <text x="38" y="174" font-size="12.5" fill="#fbbf24" font-family="'SF Mono',Consolas,monospace">// math.ts</text>
    <text x="38" y="192" font-size="12.5" fill="#34d399" font-family="'SF Mono',Consolas,monospace">export function add(a,b){return a+b}</text>
    <text x="38" y="210" font-size="12.5" fill="#f472b6" font-family="'SF Mono',Consolas,monospace">export function dead(){console.log('no')}</text>
    <text x="38" y="228" font-size="12.5" fill="#f472b6" font-family="'SF Mono',Consolas,monospace">export default function(){ return dead() }</text>
    <text x="38" y="246" font-size="12.5" fill="#7dd3fc" font-family="'SF Mono',Consolas,monospace">// bundle 后：</text>
    <text x="38" y="264" font-size="12.5" fill="#34d399" font-family="'SF Mono',Consolas,monospace">// add 抖掉了 ✓</text>
    <text x="38" y="282" font-size="12.5" fill="#f472b6" font-family="'SF Mono',Consolas,monospace">// dead 还在！✗</text>
    <rect x="286" y="152" width="262" height="118" rx="8" fill="#0a0f1c" stroke="#a78bfa" stroke-opacity="0.35"/>
    <text x="300" y="174" font-size="12.5" fill="#fbbf24" font-family="'SF Mono',Consolas,monospace">// 问题在哪？</text>
    <text x="300" y="192" font-size="12.5" fill="#7dd3fc" font-family="'SF Mono',Consolas,monospace">default export 是个匿名函数——</text>
    <text x="300" y="210" font-size="12.5" fill="#7dd3fc" font-family="'SF Mono',Consolas,monospace">它被 default export "引用"了。</text>
    <text x="300" y="228" font-size="12.5" fill="#7dd3fc" font-family="'SF Mono',Consolas,monospace">default 的函数体里</text>
    <text x="300" y="246" font-size="12.5" fill="#7dd3fc" font-family="'SF Mono',Consolas,monospace">又 call 了 dead()——</text>
    <text x="300" y="264" font-size="12.5" fill="#f472b6" font-family="'SF Mono',Consolas,monospace">AST 遍历时被标记为"被用了"。</text>
    <text x="300" y="282" font-size="12.5" fill="#64748b" font-family="'SF Mono',Consolas,monospace">关键：ESM 静态分析看"谁引用了谁"。</text>
    <rect x="24" y="278" width="524" height="52" rx="8" fill="#111a30" stroke="#1e2a44"/>
    <rect x="24" y="278" width="4" height="52" rx="2" fill="#22d3ee"/>
    <text x="40" y="300" font-size="13.5" fill="#e2e8f0">tree-shaking 不是"删没被 import 的"——是"删 AST 遍历时没被标记 reachable 的"。</text>
    <text x="40" y="320" font-size="13.5" fill="#94a3b8">export default 的函数体里所有引用都会被标 reachable。</text>
  </g>

    <g transform="translate(608,84)">
    <rect width="572" height="361" rx="14" fill="#0e1730" stroke="#223055"/>
    <polygon points="420,0 480,0 150,361 90,361" fill="#a78bfa" opacity="0.04"/>
    <rect x="14" y="13" width="26" height="20" rx="6" fill="#a78bfa"/>
    <text x="27" y="28" text-anchor="middle" font-size="14" font-weight="bold" fill="#0b1220">2</text>
    <text x="50" y="29" font-size="17" font-weight="bold" fill="#e2e8f0">揭秘：AST reachability</text>
    <g transform="translate(52,110)">
      <rect x="-19" y="14" width="38" height="22" rx="9" fill="#cbd5e1"/>
      <circle cx="0" cy="-2" r="16" fill="#ffd9b3"/>
      <path d="M-16,-2 a16,16 0 0 1 32,0 q-3,-12 -16,-12 q-13,0 -16,12 z" fill="#e2e8f0"/>
      <circle cx="-5" cy="0" r="4" fill="none" stroke="#94a3b8" stroke-width="1.4"/>
      <circle cx="5" cy="0" r="4" fill="none" stroke="#94a3b8" stroke-width="1.4"/>
      <path d="M-1,0 L1,0" stroke="#94a3b8" stroke-width="1.4"/>
      <circle cx="-5" cy="0" r="1.4" fill="#0b1220"/>
      <circle cx="5" cy="0" r="1.4" fill="#0b1220"/>
      <path d="M-8,5 q8,7 16,0 q-2,7 -8,7 q-6,0 -8,-7 z" fill="#e2e8f0"/>
    </g>
    <polygon points="88,100 74,106 88,112" fill="#f8fafc"/>
    <rect x="88" y="76" width="440" height="58" rx="10" fill="#f8fafc"/>
    <text x="102" y="100" font-size="15" fill="#0b1220">三步遍历：收集 import/export → 标记引用 → 删没被标到的。</text>
    <text x="102" y="122" font-size="15" fill="#0b1220">ESM 是静态的——AST 一看就知道谁用谁。</text>
    <rect x="24" y="152" width="254" height="132" rx="8" fill="#0a0f1c" stroke="#a78bfa" stroke-opacity="0.35"/>
    <text x="38" y="174" font-size="12.5" fill="#fbbf24" font-family="'SF Mono',Consolas,monospace">// Step 1: AST walker</text>
    <text x="38" y="192" font-size="12.5" fill="#34d399" font-family="'SF Mono',Consolas,monospace">function walk(node, parent) {</text>
    <text x="54" y="210" font-size="12.5" fill="#7dd3fc" font-family="'SF Mono',Consolas,monospace">  if (node.type === 'ImportDecl') collect(node);</text>
    <text x="54" y="228" font-size="12.5" fill="#7dd3fc" font-family="'SF Mono',Consolas,monospace">  if (node.type === 'ExportDecl') collect(node);</text>
    <text x="54" y="246" font-size="12.5" fill="#7dd3fc" font-family="'SF Mono',Consolas,monospace">  for (const key in node) walk(node[key], node);</text>
    <text x="38" y="264" font-size="12.5" fill="#34d399" font-family="'SF Mono',Consolas,monospace">}</text>
    <text x="38" y="282" font-size="12.5" fill="#fbbf24" font-family="'SF Mono',Consolas,monospace">// Step 2: reachability</text>
    <text x="38" y="300" font-size="12.5" fill="#34d399" font-family="'SF Mono',Consolas,monospace">mark(rootExports);</text>
    <text x="38" y="318" font-size="12.5" fill="#7dd3fc" font-family="'SF Mono',Consolas,monospace">// 递归 mark 所有 Identifier 引用</text>
    <text x="38" y="336" font-size="12.5" fill="#fbbf24" font-family="'SF Mono',Consolas,monospace">// Step 3: drop unmarked</text>
    <text x="38" y="354" font-size="12.5" fill="#f472b6" font-family="'SF Mono',Consolas,monospace">ast.body = ast.body.filter(n =&amp;gt; n.reachable);</text>
    <rect x="286" y="152" width="262" height="132" rx="8" fill="#0a0f1c" stroke="#22d3ee" stroke-opacity="0.35"/>
    <text x="300" y="174" font-size="12.5" fill="#fbbf24" font-family="'SF Mono',Consolas,monospace">// 依赖图：</text>
    <text x="300" y="192" font-size="12.5" fill="#7dd3fc" font-family="'SF Mono',Consolas,monospace">default → dead ✓</text>
    <text x="300" y="210" font-size="12.5" fill="#34d399" font-family="'SF Mono',Consolas,monospace">  (因为 default 函数体 call 了 dead)</text>
    <text x="300" y="228" font-size="12.5" fill="#f472b6" font-family="'SF Mono',Consolas,monospace">add → ✗ (没人 import)</text>
    <text x="300" y="246" font-size="12.5" fill="#64748b" font-family="'SF Mono',Consolas,monospace">dead → 被 default reachable</text>
    <text x="300" y="264" font-size="12.5" fill="#64748b" font-family="'SF Mono',Consolas,monospace">所以 default 不抖掉 = dead 也抖不掉</text>
    <rect x="286" y="290" width="262" height="40" rx="8" fill="#111a30" stroke="#1e2a44"/>
    <rect x="286" y="290" width="4" height="40" rx="2" fill="#a78bfa"/>
    <text x="302" y="312" font-size="13.5" fill="#e2e8f0">ESM 的好处就是 import/export 全静态。</text>
    <text x="302" y="330" font-size="13.5" fill="#94a3b8">CommonJS 的 require() 就动态了，抖不了。</text>
  </g>

    <g transform="translate(20,462)">
    <rect width="572" height="361" rx="14" fill="#0e1730" stroke="#223055"/>
    <polygon points="380,0 450,0 120,361 50,361" fill="#f472b6" opacity="0.04"/>
    <rect x="14" y="13" width="26" height="20" rx="6" fill="#f472b6"/>
    <text x="27" y="28" text-anchor="middle" font-size="14" font-weight="bold" fill="#0b1220">3</text>
    <text x="50" y="29" font-size="17" font-weight="bold" fill="#e2e8f0">实证：手写 tree-shaker</text>
    <g transform="translate(52,110)">
      <rect x="-19" y="14" width="38" height="22" rx="9" fill="#7C3AED"/>
      <circle cx="0" cy="-2" r="16" fill="#ffd9b3"/>
      <path d="M-16,-2 a16,16 0 0 1 32,0 q-2,-11 -16,-11 q-14,0 -16,11 z" fill="#22d3ee"/>
      <circle cx="15" cy="-11" r="6.5" fill="#22d3ee"/>
      <rect x="12" y="-9" width="6" height="4" rx="2" fill="#7C3AED"/>
      <circle cx="-5" cy="0" r="1.7" fill="#0b1220"/>
      <circle cx="5" cy="0" r="1.7" fill="#0b1220"/>
      <path d="M-3,5 q3,3 6,0" stroke="#0b1220" stroke-width="1.3" fill="none"/>
    </g>
    <polygon points="88,100 74,106 88,112" fill="#f8fafc"/>
    <rect x="88" y="76" width="440" height="58" rx="10" fill="#f8fafc"/>
    <text x="102" y="100" font-size="15" fill="#0b1220">用 acorn parse 出 AST 跑一下：</text>
    <text x="102" y="122" font-size="15" fill="#0b1220">打包后的 dead code 真没了！</text>
    <rect x="24" y="152" width="524" height="140" rx="8" fill="#0a0f1c" stroke="#f472b6" stroke-opacity="0.35"/>
    <text x="38" y="174" font-size="12.5" fill="#fbbf24" font-family="'SF Mono',Consolas,monospace">// 输入：lib.js（被 main.js import 了 add）</text>
    <text x="38" y="192" font-size="12.5" fill="#34d399" font-family="'SF Mono',Consolas,monospace">export function add(a,b){return a+b}</text>
    <text x="38" y="210" font-size="12.5" fill="#f472b6" font-family="'SF Mono',Consolas,monospace">export function sub(a,b){return a-b}</text>
    <text x="38" y="228" font-size="12.5" fill="#f472b6" font-family="'SF Mono',Consolas,monospace">export function mul(a,b){return a*b}</text>
    <text x="38" y="246" font-size="12.5" fill="#7dd3fc" font-family="'SF Mono',Consolas,monospace">// acorn.parse → AST → walk → mark 'add'</text>
    <text x="38" y="264" font-size="12.5" fill="#7dd3fc" font-family="'SF Mono',Consolas,monospace">// generate 输出：</text>
    <text x="38" y="282" font-size="12.5" fill="#34d399" font-family="'SF Mono',Consolas,monospace">function add(a,b){return a+b}  ✓</text>
    <text x="38" y="300" font-size="12.5" fill="#64748b" font-family="'SF Mono',Consolas,monospace">// sub 和 mul 被自动干掉了！</text>
    <text x="38" y="318" font-size="12.5" fill="#34d399" font-family="'SF Mono',Consolas,monospace">// 包体积：420B → 132B，-69%</text>
    <rect x="24" y="300" width="524" height="46" rx="8" fill="#111a30" stroke="#1e2a44"/>
    <rect x="24" y="300" width="4" height="46" rx="2" fill="#f472b6"/>
    <text x="40" y="322" font-size="13.5" fill="#e2e8f0">ESM 树摇的威力：没用的代码连打包都不会打进去。</text>
    <text x="40" y="342" font-size="13.5" fill="#94a3b8">对比 CJS 动态 require——Vite 为啥强推 ESM？</text>
  </g>

    <g transform="translate(608,462)">
    <rect width="572" height="361" rx="14" fill="#0e1730" stroke="#223055"/>
    <polygon points="420,0 480,0 150,361 90,361" fill="#f97316" opacity="0.04"/>
    <rect x="14" y="13" width="26" height="20" rx="6" fill="#f97316"/>
    <text x="27" y="28" text-anchor="middle" font-size="14" font-weight="bold" fill="#0b1220">4</text>
    <text x="50" y="29" font-size="17" font-weight="bold" fill="#e2e8f0">结案：抖不掉的死角</text>
    <g transform="translate(52,110)">
      <rect x="-19" y="14" width="38" height="22" rx="9" fill="#cbd5e1"/>
      <circle cx="0" cy="-2" r="16" fill="#ffd9b3"/>
      <path d="M-16,-2 a16,16 0 0 1 32,0 q-3,-12 -16,-12 q-13,0 -16,12 z" fill="#e2e8f0"/>
      <circle cx="-5" cy="0" r="4" fill="none" stroke="#94a3b8" stroke-width="1.4"/>
      <circle cx="5" cy="0" r="4" fill="none" stroke="#94a3b8" stroke-width="1.4"/>
      <path d="M-1,0 L1,0" stroke="#94a3b8" stroke-width="1.4"/>
      <circle cx="-5" cy="0" r="1.4" fill="#0b1220"/>
      <circle cx="5" cy="0" r="1.4" fill="#0b1220"/>
      <path d="M-8,5 q8,7 16,0 q-2,7 -8,7 q-6,0 -8,-7 z" fill="#e2e8f0"/>
    </g>
    <polygon points="88,100 74,106 88,112" fill="#f8fafc"/>
    <rect x="88" y="76" width="440" height="58" rx="10" fill="#f8fafc"/>
    <text x="102" y="100" font-size="15" fill="#0b1220">AST 是静态分析的天花板——</text>
    <text x="102" y="122" font-size="15" fill="#0b1220">但天花板之上还有动态的东西。</text>
    <rect x="24" y="148" width="96" height="26" rx="13" fill="#f97316"/>
    <text x="72" y="166" text-anchor="middle" font-size="13" font-weight="bold" fill="#0b1220">⚠ 坑点</text>
    <rect x="32" y="183" width="9" height="9" rx="2" fill="#f97316"/>
    <text x="52" y="192" font-size="13.5" fill="#e2e8f0">eval / new Function 里的代码，AST 碰不到 = 抖不掉</text>
    <rect x="32" y="207" width="9" height="9" rx="2" fill="#f97316"/>
    <text x="52" y="216" font-size="13.5" fill="#e2e8f0">CJS require() 动态路径，静态分析做不到</text>
    <rect x="32" y="231" width="9" height="9" rx="2" fill="#f97316"/>
    <text x="52" y="240" font-size="13.5" fill="#e2e8f0">纯函数注释 / sideEffects:false 才能激进抖</text>
    <rect x="32" y="255" width="9" height="9" rx="2" fill="#f97316"/>
    <text x="52" y="264" font-size="13.5" fill="#e2e8f0">export default 里的代码跟着 default 走</text>
    <rect x="24" y="278" width="524" height="52" rx="8" fill="#111a30" stroke="#1e2a44"/>
    <rect x="24" y="278" width="4" height="52" rx="2" fill="#f97316"/>
    <text x="40" y="300" font-size="13" font-weight="bold" fill="#f97316">码叔总结</text>
    <text x="118" y="300" font-size="13" fill="#e2e8f0">AST 是代码编译器的"上帝视角"——但上帝也怕 eval。</text>
    <text x="40" y="320" font-size="13" fill="#e2e8f0">写 ESM、声明 pure/sideEffects，抖摇树才摇得干净。</text>
  </g>

  <text x="1180" y="832" text-anchor="end" font-size="11" fill="#475569">NEON INK · frontend-advanced-guide · EP.41</text>
</svg>
