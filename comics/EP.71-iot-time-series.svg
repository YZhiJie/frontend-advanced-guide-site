<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 840" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1220"/><stop offset="1" stop-color="#101a33"/></linearGradient>
    <linearGradient id="titleGrad" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#22d3ee"/><stop offset="1" stop-color="#a78bfa"/></linearGradient>
  </defs>
  <rect width="1200" height="840" fill="url(#bg)"/>
  <polygon points="980,0 1060,0 760,840 680,840" fill="#22d3ee" opacity="0.04"/>

  <rect x="20" y="14" width="92" height="36" rx="9" fill="#7C3AED"/>
  <text x="66" y="38" text-anchor="middle" font-size="18" font-weight="bold" fill="#fff">EP.71</text>
  <text x="126" y="40" font-size="26" font-weight="bold" fill="url(#titleGrad)">百万数据点的可视化密码</text>
  <text x="1180" y="38" text-anchor="end" font-size="13" fill="#64748b">进阶漫画剧场 · 霓虹墨 NEON INK</text>
  <rect x="20" y="62" width="1160" height="2" rx="1" fill="url(#titleGrad)" opacity="0.6"/>

  <g transform="translate(20,84)">
    <rect width="572" height="361" rx="14" fill="#0e1730" stroke="#223055"/>
    <rect x="14" y="13" width="26" height="20" rx="6" fill="#22d3ee"/>
    <text x="27" y="28" text-anchor="middle" font-size="14" font-weight="bold" fill="#0b1220">1</text>
    <text x="50" y="29" font-size="17" font-weight="bold" fill="#e2e8f0">困境：百万点画不动</text>
    <text x="28" y="130" font-size="14" fill="#94a3b8">IoT 设备每秒上报 10 个点，</text>
    <text x="28" y="152" font-size="14" fill="#f97316">一天就是百万级，图表直接卡死。</text>
    <rect x="24" y="175" width="524" height="94" rx="8" fill="#0a0f1c" stroke="#f97316" stroke-opacity="0.4"/>
    <text x="38" y="198" font-size="13" fill="#fdba74" font-family="monospace">1,000,000 个数据点</text>
    <text x="38" y="220" font-size="13" fill="#fdba74" font-family="monospace">SVG 渲染 → 浏览器爆炸</text>
    <text x="38" y="242" font-size="13" fill="#fdba74" font-family="monospace">屏幕只有 ~2000 像素宽</text>
    <rect x="24" y="295" width="524" height="44" rx="8" fill="#111a30" stroke="#1e2a44"/>
    <text x="40" y="322" font-size="13.5" fill="#e2e8f0">画百万个点毫无意义，必须降采样。</text>
  </g>

  <g transform="translate(608,84)">
    <rect width="572" height="361" rx="14" fill="#0e1730" stroke="#223055"/>
    <rect x="14" y="13" width="26" height="20" rx="6" fill="#a78bfa"/>
    <text x="27" y="28" text-anchor="middle" font-size="14" font-weight="bold" fill="#0b1220">2</text>
    <text x="50" y="29" font-size="17" font-weight="bold" fill="#e2e8f0">揭秘：降采样算法</text>
    <rect x="24" y="50" width="524" height="180" rx="8" fill="#0a0f1c" stroke="#a78bfa" stroke-opacity="0.3"/>
    <text x="38" y="72" font-size="12.5" fill="#7dd3fc" font-family="monospace">方法1: 平均聚合</text>
    <text x="38" y="92" font-size="12.5" fill="#94a3b8">  按时间窗口取均值，适合看趋势</text>
    <text x="38" y="112" font-size="12.5" fill="#7dd3fc" font-family="monospace">方法2: LTTB (形状保持)</text>
    <text x="38" y="132" font-size="12.5" fill="#94a3b8">  选面积最大的点，保留峰值</text>
    <text x="38" y="152" font-size="12.5" fill="#f472b6" font-family="monospace">100万 → 2000 个可视点</text>
    <text x="38" y="172" font-size="12.5" fill="#94a3b8">  服务端 GROUP BY time() 聚合</text>
    <text x="38" y="192" font-size="12.5" fill="#94a3b8">  客户端 LTTB 再降一次</text>
    <text x="38" y="214" font-size="12.5" fill="#94a3b8">趋势用平均聚合，异常用 LTTB</text>
    <rect x="24" y="250" width="524" height="80" rx="8" fill="#111a30" stroke="#1e2a44"/>
    <text x="40" y="274" font-size="13.5" fill="#e2e8f0">屏幕像素有限，</text>
    <text x="40" y="294" font-size="13.5" fill="#94a3b8">把数据降到可视点数即可。</text>
    <text x="40" y="314" font-size="13.5" fill="#94a3b8">Canvas 渲染，别用 SVG。</text>
  </g>

  <g transform="translate(20,465)">
    <rect width="572" height="361" rx="14" fill="#0e1730" stroke="#223055"/>
    <rect x="14" y="13" width="26" height="20" rx="6" fill="#34d399"/>
    <text x="27" y="28" text-anchor="middle" font-size="14" font-weight="bold" fill="#0b1220">3</text>
    <text x="50" y="29" font-size="17" font-weight="bold" fill="#e2e8f0">实证：告警与实时缓冲</text>
    <text x="28" y="70" font-size="14" fill="#94a3b8">单点超阈值是毛刺，</text>
    <text x="28" y="90" font-size="14" fill="#94a3b8">连续 N 点超阈值才告警。</text>
    <rect x="24" y="110" width="524" height="150" rx="8" fill="#0a0f1c" stroke="#34d399" stroke-opacity="0.3"/>
    <text x="38" y="132" font-size="12.5" fill="#7dd3fc" font-family="monospace">滚动窗口告警:</text>
    <text x="38" y="152" font-size="12.5" fill="#94a3b8">  连续 3 点 > 阈值 → 触发</text>
    <text x="38" y="172" font-size="12.5" fill="#94a3b8">  单点毛刺 → 不触发(防抖)</text>
    <text x="38" y="192" font-size="12.5" fill="#7dd3fc" font-family="monospace">实时缓冲 flush:</text>
    <text x="38" y="212" font-size="12.5" fill="#f472b6" font-family="monospace">  高频推送先缓冲，500ms~1s 合并</text>
    <text x="38" y="240" font-size="12.5" fill="#94a3b8">  减少渲染次数，防卡顿</text>
    <rect x="24" y="280" width="524" height="56" rx="8" fill="#111a30" stroke="#1e2a44"/>
    <text x="40" y="305" font-size="13.5" fill="#e2e8f0">告警要防抖防风暴，</text>
    <text x="40" y="325" font-size="13.5" fill="#94a3b8">实时数据要缓冲合并渲染。</text>
  </g>

  <g transform="translate(608,465)">
    <rect width="572" height="361" rx="14" fill="#0e1730" stroke="#223055"/>
    <rect x="14" y="13" width="26" height="20" rx="6" fill="#f472b6"/>
    <text x="27" y="28" text-anchor="middle" font-size="14" font-weight="bold" fill="#0b1220">4</text>
    <text x="50" y="29" font-size="17" font-weight="bold" fill="#e2e8f0">结案：时间对齐与存储</text>
    <text x="28" y="70" font-size="14" fill="#94a3b8">多设备上报时间不一致，</text>
    <text x="28" y="90" font-size="14" fill="#94a3b8">要对齐到统一时间网格。</text>
    <rect x="24" y="110" width="524" height="130" rx="8" fill="#0a0f1c" stroke="#f472b6" stroke-opacity="0.3"/>
    <text x="38" y="132" font-size="12.5" fill="#7dd3fc" font-family="monospace">时间对齐: 对齐到 10s 网格</text>
    <text x="38" y="152" font-size="12.5" fill="#94a3b8">  最近邻 / 线性插值 / 前向填充</text>
    <text x="38" y="172" font-size="12.5" fill="#7dd3fc" font-family="monospace">时序数据库:</text>
    <text x="38" y="192" font-size="12.5" fill="#94a3b8">  InfluxDB / TDengine / TimescaleDB</text>
    <text x="38" y="212" font-size="12.5" fill="#94a3b8">  保留策略: 原始7天, 分钟级1年</text>
    <text x="38" y="226" font-size="12.5" fill="#94a3b8">  UTC 时间戳存储, 前端按时区显示</text>
    <rect x="24" y="260" width="524" height="76" rx="8" fill="#111a30" stroke="#1e2a44"/>
    <rect x="24" y="260" width="4" height="76" rx="2" fill="#f472b6"/>
    <text x="40" y="285" font-size="13.5" fill="#e2e8f0">核心口诀：海量数据先降采样，</text>
    <text x="40" y="305" font-size="13.5" fill="#94a3b8">告警防抖防风暴，实时缓冲合并，</text>
    <text x="40" y="325" font-size="13.5" fill="#94a3b8">多设备对齐时间网格。</text>
  </g>
</svg>
