<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 840" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#101a33"/>
    </linearGradient>
    <linearGradient id="titleGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="840" fill="url(#bg)"/>
  <polygon points="980,0 1060,0 760,840 680,840" fill="#22d3ee" opacity="0.04"/>
  <polygon points="150,0 220,0 1040,840 970,840" fill="#a78bfa" opacity="0.03"/>

  <rect x="20" y="14" width="92" height="36" rx="9" fill="#7C3AED"/>
  <text x="66" y="38" text-anchor="middle" font-size="18" font-weight="bold" fill="#ffffff">EP.31</text>
  <text x="126" y="40" font-size="26" font-weight="bold" fill="url(#titleGrad)">排序大比武</text>
  <text x="1180" y="38" text-anchor="end" font-size="13" fill="#64748b">进阶漫画剧场 · 霓虹墨 NEON INK</text>
  <rect x="20" y="62" width="1160" height="2" rx="1" fill="url(#titleGrad)" opacity="0.6"/>

  <g transform="translate(20,84)">
    <rect width="572" height="361" rx="14" fill="#0e1730" stroke="#223055"/>
    <polygon points="380,0 450,0 120,361 50,361" fill="#22d3ee" opacity="0.04"/>
    <rect x="14" y="13" width="26" height="20" rx="6" fill="#22d3ee"/>
    <text x="27" y="28" text-anchor="middle" font-size="14" font-weight="bold" fill="#0b1220">1</text>
    <text x="50" y="29" font-size="17" font-weight="bold" fill="#e2e8f0">困境：sort 翻车</text>
    <g transform="translate(52,110)">
      <rect x="-19" y="14" width="38" height="22" rx="9" fill="#7C3AED"/>
      <circle cx="0" cy="-2" r="16" fill="#ffd9b3"/>
      <path d="M-16,-2 a16,16 0 0 1 32,0 q-2,-11 -16,-11 q-14,0 -16,11 z" fill="#22d3ee"/>
      <circle cx="15" cy="-11" r="6.5" fill="#22d3ee"/>
      <rect x="12" y="-9" width="6" height="4" rx="2" fill="#7C3AED"/>
      <circle cx="-5" cy="0" r="1.7" fill="#0b1220"/>
      <circle cx="5" cy="0" r="1.7" fill="#0b1220"/>
      <path d="M-3,5 q3,3 6,0" stroke="#0b1220" stroke-width="1.3" fill="none"/>
    </g>
    <polygon points="88,100 74,106 88,112" fill="#f8fafc"/>
    <rect x="88" y="82" width="380" height="52" rx="10" fill="#f8fafc"/>
    <text x="102" y="104" font-size="15" fill="#0b1220">[10,9,1].sort() 后，</text>
    <text x="102" y="126" font-size="15" fill="#0b1220">竟变成 [1,10,9]？！</text>
    <rect x="24" y="152" width="524" height="118" rx="8" fill="#0a0f1c" stroke="#22d3ee" stroke-opacity="0.35"/>
    <text x="38" y="174" font-size="12.5" fill="#fbbf24" font-family="'SF Mono',Consolas,monospace">// 默认按字符串字典序排！</text>
    <text x="38" y="192" font-size="12.5" fill="#7dd3fc" font-family="'SF Mono',Consolas,monospace">[10, 9, 1].sort()</text>
    <text x="38" y="210" font-size="12.5" fill="#f472b6" font-family="'SF Mono',Consolas,monospace">// → ['1','10','9'] 字典序</text>
    <text x="38" y="228" font-size="12.5" fill="#34d399" font-family="'SF Mono',Consolas,monospace">// 正确：传数字比较器</text>
    <text x="38" y="246" font-size="12.5" fill="#7dd3fc" font-family="'SF Mono',Consolas,monospace">[10,9,1].sort((a,b) =&gt; a-b)</text>
    <rect x="24" y="278" width="524" height="52" rx="8" fill="#111a30" stroke="#1e2a44"/>
    <rect x="24" y="278" width="4" height="52" rx="2" fill="#22d3ee"/>
    <text x="40" y="300" font-size="13.5" fill="#e2e8f0">表格分数列一排序，</text>
    <text x="40" y="320" font-size="13.5" fill="#94a3b8">10 竟然排在 9 前面。</text>
  </g>

  <g transform="translate(608,84)">
    <rect width="572" height="361" rx="14" fill="#0e1730" stroke="#223055"/>
    <polygon points="420,0 480,0 150,361 90,361" fill="#a78bfa" opacity="0.04"/>
    <rect x="14" y="13" width="26" height="20" rx="6" fill="#a78bfa"/>
    <text x="27" y="28" text-anchor="middle" font-size="14" font-weight="bold" fill="#0b1220">2</text>
    <text x="50" y="29" font-size="17" font-weight="bold" fill="#e2e8f0">揭秘：六路选手</text>
    <g transform="translate(52,110)">
      <rect x="-19" y="14" width="38" height="22" rx="9" fill="#cbd5e1"/>
      <circle cx="0" cy="-2" r="16" fill="#ffd9b3"/>
      <path d="M-16,-2 a16,16 0 0 1 32,0 q-3,-12 -16,-12 q-13,0 -16,12 z" fill="#e2e8f0"/>
      <circle cx="-5" cy="0" r="4" fill="none" stroke="#94a3b8" stroke-width="1.4"/>
      <circle cx="5" cy="0" r="4" fill="none" stroke="#94a3b8" stroke-width="1.4"/>
      <path d="M-1,0 L1,0" stroke="#94a3b8" stroke-width="1.4"/>
      <circle cx="-5" cy="0" r="1.4" fill="#0b1220"/>
      <circle cx="5" cy="0" r="1.4" fill="#0b1220"/>
      <path d="M-8,5 q8,7 16,0 q-2,7 -8,7 q-6,0 -8,-7 z" fill="#e2e8f0"/>
    </g>
    <polygon points="88,100 74,106 88,112" fill="#f8fafc"/>
    <rect x="88" y="82" width="380" height="52" rx="10" fill="#f8fafc"/>
    <text x="102" y="104" font-size="15" fill="#0b1220">sort 默认按字典序排，</text>
    <text x="102" y="126" font-size="15" fill="#0b1220">数字必须传比较器。</text>
    <rect x="24" y="152" width="256" height="96" rx="8" fill="#0a0f1c" stroke="#f472b6" stroke-opacity="0.35"/>
    <text x="38" y="176" font-size="12.5" fill="#f472b6" font-family="'SF Mono',Consolas,monospace">O(n²) 三兄弟</text>
    <text x="38" y="200" font-size="12.5" fill="#7dd3fc" font-family="'SF Mono',Consolas,monospace">冒泡 · 选择 · 插入</text>
    <text x="38" y="224" font-size="12.5" fill="#94a3b8" font-family="'SF Mono',Consolas,monospace">// 小数据、近乎有序用</text>
    <rect x="292" y="152" width="256" height="96" rx="8" fill="#0a0f1c" stroke="#22d3ee" stroke-opacity="0.35"/>
    <text x="306" y="176" font-size="12.5" fill="#22d3ee" font-family="'SF Mono',Consolas,monospace">O(n log n) 三剑客</text>
    <text x="306" y="200" font-size="12.5" fill="#7dd3fc" font-family="'SF Mono',Consolas,monospace">归并 · 快排 · 堆排</text>
    <text x="306" y="224" font-size="12.5" fill="#94a3b8" font-family="'SF Mono',Consolas,monospace">// 大数据量的主力</text>
    <rect x="24" y="278" width="524" height="52" rx="8" fill="#111a30" stroke="#1e2a44"/>
    <rect x="24" y="278" width="4" height="52" rx="2" fill="#a78bfa"/>
    <text x="40" y="300" font-size="13.5" fill="#e2e8f0">冒泡选择插入好懂，</text>
    <text x="40" y="320" font-size="13.5" fill="#94a3b8">归并快排堆排更快。</text>
  </g>

  <g transform="translate(20,462)">
    <rect width="572" height="361" rx="14" fill="#0e1730" stroke="#223055"/>
    <polygon points="380,0 450,0 120,361 50,361" fill="#f472b6" opacity="0.04"/>
    <rect x="14" y="13" width="26" height="20" rx="6" fill="#f472b6"/>
    <text x="27" y="28" text-anchor="middle" font-size="14" font-weight="bold" fill="#0b1220">3</text>
    <text x="50" y="29" font-size="17" font-weight="bold" fill="#e2e8f0">实证：快排分区</text>
    <g transform="translate(52,110)">
      <rect x="-19" y="14" width="38" height="22" rx="9" fill="#1d4ed8"/>
      <path d="M-5,18 L5,18 L3.5,27 L0,29 L-3.5,27 Z" fill="#f97316"/>
      <circle cx="0" cy="-2" r="16" fill="#ffd9b3"/>
      <path d="M-16,-2 L-11,-13 L-6,-4 L0,-14 L6,-4 L11,-13 L16,-2 Q0,-11 -16,-2 Z" fill="#f97316"/>
      <circle cx="-5" cy="0" r="1.7" fill="#0b1220"/>
      <circle cx="5" cy="0" r="1.7" fill="#0b1220"/>
      <path d="M-3,5 q3,3 6,0" stroke="#0b1220" stroke-width="1.3" fill="none"/>
    </g>
    <polygon points="88,100 74,106 88,112" fill="#f8fafc"/>
    <rect x="88" y="82" width="380" height="52" rx="10" fill="#f8fafc"/>
    <text x="102" y="104" font-size="15" fill="#0b1220">pivot 选 6 双指针扫，</text>
    <text x="102" y="126" font-size="15" fill="#0b1220">小的放左，大的放右。</text>
    <rect x="40" y="150" width="44" height="36" rx="6" fill="#0a0f1c" stroke="#22d3ee"/>
    <text x="62" y="173" text-anchor="middle" font-size="15" font-weight="bold" fill="#e2e8f0">3</text>
    <rect x="92" y="150" width="44" height="36" rx="6" fill="#0a0f1c" stroke="#22d3ee"/>
    <text x="114" y="173" text-anchor="middle" font-size="15" font-weight="bold" fill="#e2e8f0">7</text>
    <rect x="144" y="150" width="44" height="36" rx="6" fill="#0a0f1c" stroke="#22d3ee"/>
    <text x="166" y="173" text-anchor="middle" font-size="15" font-weight="bold" fill="#e2e8f0">1</text>
    <rect x="196" y="150" width="44" height="36" rx="6" fill="#0a0f1c" stroke="#22d3ee"/>
    <text x="218" y="173" text-anchor="middle" font-size="15" font-weight="bold" fill="#e2e8f0">8</text>
    <rect x="248" y="150" width="44" height="36" rx="6" fill="#0a0f1c" stroke="#22d3ee"/>
    <text x="270" y="173" text-anchor="middle" font-size="15" font-weight="bold" fill="#e2e8f0">2</text>
    <rect x="300" y="150" width="44" height="36" rx="6" fill="#0a0f1c" stroke="#f97316" stroke-width="2"/>
    <text x="322" y="173" text-anchor="middle" font-size="15" font-weight="bold" fill="#f97316">6</text>
    <text x="322" y="140" text-anchor="middle" font-size="12" font-weight="bold" fill="#f97316" font-family="'SF Mono',Consolas,monospace">pivot</text>
    <polygon points="62,192 56,202 68,202" fill="#22d3ee"/>
    <text x="62" y="220" text-anchor="middle" font-size="14" font-weight="bold" fill="#22d3ee">i</text>
    <polygon points="270,192 264,202 276,202" fill="#f472b6"/>
    <text x="270" y="220" text-anchor="middle" font-size="14" font-weight="bold" fill="#f472b6">j</text>
    <text x="40" y="252" font-size="13.5" fill="#e2e8f0">① j 扫到 1、2 小于 6，依次换到左侧</text>
    <text x="40" y="278" font-size="13.5" fill="#fbbf24" font-family="'SF Mono',Consolas,monospace">② pivot 归位：[3,1,2 | 6 | 7,8]</text>
    <text x="40" y="304" font-size="13.5" fill="#e2e8f0">③ 左右两半各自递归，直到全有序</text>
    <rect x="24" y="318" width="524" height="34" rx="8" fill="#111a30" stroke="#1e2a44"/>
    <rect x="24" y="318" width="4" height="34" rx="2" fill="#f472b6"/>
    <text x="40" y="340" font-size="13.5" fill="#e2e8f0">一次分区定一个 pivot，左右递归。</text>
  </g>

  <g transform="translate(608,462)">
    <rect width="572" height="361" rx="14" fill="#0e1730" stroke="#223055"/>
    <polygon points="420,0 480,0 150,361 90,361" fill="#f97316" opacity="0.04"/>
    <rect x="14" y="13" width="26" height="20" rx="6" fill="#f97316"/>
    <text x="27" y="28" text-anchor="middle" font-size="14" font-weight="bold" fill="#0b1220">4</text>
    <text x="50" y="29" font-size="17" font-weight="bold" fill="#e2e8f0">结案：别手写排序</text>
    <g transform="translate(52,110)">
      <rect x="-19" y="14" width="38" height="22" rx="9" fill="#cbd5e1"/>
      <circle cx="0" cy="-2" r="16" fill="#ffd9b3"/>
      <path d="M-16,-2 a16,16 0 0 1 32,0 q-3,-12 -16,-12 q-13,0 -16,12 z" fill="#e2e8f0"/>
      <circle cx="-5" cy="0" r="4" fill="none" stroke="#94a3b8" stroke-width="1.4"/>
      <circle cx="5" cy="0" r="4" fill="none" stroke="#94a3b8" stroke-width="1.4"/>
      <path d="M-1,0 L1,0" stroke="#94a3b8" stroke-width="1.4"/>
      <circle cx="-5" cy="0" r="1.4" fill="#0b1220"/>
      <circle cx="5" cy="0" r="1.4" fill="#0b1220"/>
      <path d="M-8,5 q8,7 16,0 q-2,7 -8,7 q-6,0 -8,-7 z" fill="#e2e8f0"/>
    </g>
    <polygon points="88,100 74,106 88,112" fill="#f8fafc"/>
    <rect x="88" y="82" width="380" height="52" rx="10" fill="#f8fafc"/>
    <text x="102" y="104" font-size="15" fill="#0b1220">V8 的 sort 是 TimSort，</text>
    <text x="102" y="126" font-size="15" fill="#0b1220">业务直接调，别手写。</text>
    <rect x="24" y="140" width="96" height="26" rx="13" fill="#f97316"/>
    <text x="72" y="158" text-anchor="middle" font-size="13" font-weight="bold" fill="#0b1220">⚠ 坑点</text>
    <rect x="32" y="176" width="9" height="9" rx="2" fill="#f97316"/>
    <text x="52" y="185" font-size="14" fill="#e2e8f0">数字排序必传 (a,b) =&gt; a-b</text>
    <rect x="32" y="204" width="9" height="9" rx="2" fill="#f97316"/>
    <text x="52" y="213" font-size="14" fill="#e2e8f0">稳定性看算法，快排不稳</text>
    <rect x="32" y="232" width="9" height="9" rx="2" fill="#f97316"/>
    <text x="52" y="241" font-size="14" fill="#e2e8f0">sort 原地改原数组，先拷贝</text>
    <rect x="340" y="168" width="208" height="88" rx="8" fill="#0a0f1c" stroke="#a78bfa" stroke-opacity="0.35"/>
    <text x="354" y="190" font-size="12.5" fill="#7dd3fc" font-family="'SF Mono',Consolas,monospace">V8: sort = TimSort</text>
    <text x="354" y="212" font-size="12.5" fill="#34d399" font-family="'SF Mono',Consolas,monospace">短数组 → 插入排序</text>
    <text x="354" y="234" font-size="12.5" fill="#34d399" font-family="'SF Mono',Consolas,monospace">长数组 → 归并 run</text>
    <rect x="24" y="296" width="524" height="44" rx="8" fill="#111a30" stroke="#1e2a44"/>
    <rect x="24" y="296" width="4" height="44" rx="2" fill="#22d3ee"/>
    <text x="40" y="314" font-size="13.5" font-weight="bold" fill="#22d3ee">码叔总结</text>
    <text x="40" y="332" font-size="13.5" fill="#e2e8f0">比较器传对，拷贝再排。</text>
  </g>

  <text x="1180" y="832" text-anchor="end" font-size="11" fill="#475569">NEON INK · frontend-advanced-guide · EP.31</text>
</svg>
