<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 840" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#101a33"/>
    </linearGradient>
    <linearGradient id="titleGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="840" fill="url(#bg)"/>
  <polygon points="980,0 1060,0 760,840 680,840" fill="#22d3ee" opacity="0.04"/>
  <polygon points="150,0 220,0 1040,840 970,840" fill="#a78bfa" opacity="0.03"/>

  <rect x="20" y="14" width="92" height="36" rx="9" fill="#7C3AED"/>
  <text x="66" y="38" text-anchor="middle" font-size="18" font-weight="bold" fill="#ffffff">EP.45</text>
  <text x="126" y="40" font-size="26" font-weight="bold" fill="url(#titleGrad)">fetch 背后那个 URL 对象</text>
  <text x="1180" y="38" text-anchor="end" font-size="13" fill="#64748b">进阶漫画剧场 · 霓虹墨 NEON INK</text>
  <rect x="20" y="62" width="1160" height="2" rx="1" fill="url(#titleGrad)" opacity="0.6"/>

  <g transform="translate(20,84)">
    <rect width="572" height="361" rx="14" fill="#0e1730" stroke="#223055"/>
    <polygon points="380,0 450,0 120,361 50,361" fill="#22d3ee" opacity="0.04"/>
    <rect x="14" y="13" width="26" height="20" rx="6" fill="#22d3ee"/>
    <text x="27" y="28" text-anchor="middle" font-size="14" font-weight="bold" fill="#0b1220">1</text>
    <text x="50" y="29" font-size="17" font-weight="bold" fill="#e2e8f0">困境：redirect 崩了</text>
    <g transform="translate(52,110)">
      <rect x="-19" y="14" width="38" height="22" rx="9" fill="#1d4ed8"/>
      <path d="M-5,18 L5,18 L3.5,27 L0,29 L-3.5,27 Z" fill="#f97316"/>
      <circle cx="0" cy="-2" r="16" fill="#ffd9b3"/>
      <path d="M-16,-2 L-11,-13 L-6,-4 L0,-14 L6,-4 L11,-13 L16,-2 Q0,-11 -16,-2 Z" fill="#f97316"/>
      <circle cx="-5" cy="0" r="1.7" fill="#0b1220"/>
      <circle cx="5" cy="0" r="1.7" fill="#0b1220"/>
      <path d="M-3,5 q3,3 6,0" stroke="#0b1220" stroke-width="1.3" fill="none"/>
    </g>
    <polygon points="88,100 74,106 88,112" fill="#f8fafc"/>
    <rect x="88" y="76" width="440" height="58" rx="10" fill="#f8fafc"/>
    <text x="102" y="100" font-size="15" fill="#0b1220">手写 fetch 一遇 301 升级 HTTPS，</text>
    <text x="102" y="122" font-size="15" fill="#0b1220">AbortController 一 cancel 就 TypeError。</text>
    <rect x="24" y="152" width="524" height="118" rx="8" fill="#0a0f1c" stroke="#22d3ee" stroke-opacity="0.35"/>
    <text x="38" y="174" font-size="12.5" fill="#fbbf24" font-family="'SF Mono',Consolas,monospace">// 我这是踩了什么坑？</text>
    <text x="38" y="192" font-size="12.5" fill="#f472b6" font-family="'SF Mono',Consolas,monospace">Error: Protocol &quot;https:&quot; not supported. ??!?</text>
    <text x="38" y="210" font-size="12.5" fill="#f472b6" font-family="'SF Mono',Consolas,monospace">TypeError: The operation was aborted.</text>
    <text x="38" y="228" font-size="12.5" fill="#7dd3fc" font-family="'SF Mono',Consolas,monospace">// 这报错就像没说——</text>
    <text x="38" y="246" font-size="12.5" fill="#7dd3fc" font-family="'SF Mono',Consolas,monospace">// 明明我就是传了个 URL 字符串啊。</text>
    <rect x="24" y="278" width="524" height="52" rx="8" fill="#111a30" stroke="#1e2a44"/>
    <rect x="24" y="278" width="4" height="52" rx="2" fill="#22d3ee"/>
    <text x="40" y="300" font-size="13.5" fill="#e2e8f0">URL 字符串没状态，只有 URL 对象才会换协议。</text>
    <text x="40" y="320" font-size="13.5" fill="#94a3b8">AbortController 是异步 cancel，别指望立即生效。</text>
  </g>

  <g transform="translate(608,84)">
    <rect width="572" height="361" rx="14" fill="#0e1730" stroke="#223055"/>
    <polygon points="420,0 480,0 150,361 90,361" fill="#a78bfa" opacity="0.04"/>
    <rect x="14" y="13" width="26" height="20" rx="6" fill="#a78bfa"/>
    <text x="27" y="28" text-anchor="middle" font-size="14" font-weight="bold" fill="#0b1220">2</text>
    <text x="50" y="29" font-size="17" font-weight="bold" fill="#e2e8f0">揭秘：URL 会变，但 String 不会</text>
    <g transform="translate(52,110)">
      <rect x="-19" y="14" width="38" height="22" rx="9" fill="#cbd5e1"/>
      <circle cx="0" cy="-2" r="16" fill="#ffd9b3"/>
      <path d="M-16,-2 a16,16 0 0 1 32,0 q-3,-12 -16,-12 q-13,0 -16,12 z" fill="#e2e8f0"/>
      <circle cx="-5" cy="0" r="4" fill="none" stroke="#94a3b8" stroke-width="1.4"/>
      <circle cx="5" cy="0" r="4" fill="none" stroke="#94a3b8" stroke-width="1.4"/>
      <path d="M-1,0 L1,0" stroke="#94a3b8" stroke-width="1.4"/>
      <circle cx="-5" cy="0" r="1.4" fill="#0b1220"/>
      <circle cx="5" cy="0" r="1.4" fill="#0b1220"/>
      <path d="M-8,5 q8,7 16,0 q-2,7 -8,7 q-6,0 -8,-7 z" fill="#e2e8f0"/>
    </g>
    <polygon points="88,100 74,106 88,112" fill="#f8fafc"/>
    <rect x="88" y="76" width="440" height="58" rx="10" fill="#f8fafc"/>
    <text x="102" y="100" font-size="15" fill="#0b1220">redirect 要换 URL 对象；</text>
    <text x="102" y="122" font-size="15" fill="#0b1220">AbortController 要监听 signal。</text>
    <rect x="24" y="152" width="524" height="102" rx="8" fill="#0a0f1c" stroke="#a78bfa" stroke-opacity="0.35"/>
    <text x="38" y="174" font-size="12.5" fill="#fbbf24" font-family="'SF Mono',Consolas,monospace">// redirect 处理：</text>
    <text x="38" y="192" font-size="12.5" fill="#7dd3fc" font-family="'SF Mono',Consolas,monospace">const next = new URL(location.headers.location, base);</text>
    <text x="38" y="210" font-size="12.5" fill="#7dd3fc" font-family="'SF Mono',Consolas,monospace">req = net.request(next, { signal, ...opt });</text>
    <text x="38" y="228" font-size="12.5" fill="#fbbf24" font-family="'SF Mono',Consolas,monospace">// abort 处理：</text>
    <text x="38" y="246" font-size="12.5" fill="#7dd3fc" font-family="'SF Mono',Consolas,monospace">signal.addEventListener('abort', () =&gt; req.destroy());</text>
    <rect x="24" y="266" width="524" height="52" rx="8" fill="#111a30" stroke="#1e2a44"/>
    <rect x="24" y="266" width="4" height="52" rx="2" fill="#a78bfa"/>
    <text x="40" y="288" font-size="13.5" fill="#e2e8f0">signal.aborted 是状态，监听 'abort' 才是事件；</text>
    <text x="40" y="308" font-size="13.5" fill="#94a3b8">redirect 协议只能升不能降（安全规则）。</text>
  </g>

  <g transform="translate(20,462)">
    <rect width="572" height="361" rx="14" fill="#0e1730" stroke="#223055"/>
    <polygon points="380,0 450,0 120,361 50,361" fill="#f472b6" opacity="0.04"/>
    <rect x="14" y="13" width="26" height="20" rx="6" fill="#f472b6"/>
    <text x="27" y="28" text-anchor="middle" font-size="14" font-weight="bold" fill="#0b1220">3</text>
    <text x="50" y="29" font-size="17" font-weight="bold" fill="#e2e8f0">实证：mini-fetch 三条链</text>
    <g transform="translate(52,110)">
      <rect x="-19" y="14" width="38" height="22" rx="9" fill="#7C3AED"/>
      <circle cx="0" cy="-2" r="16" fill="#ffd9b3"/>
      <path d="M-16,-2 a16,16 0 0 1 32,0 q-2,-11 -16,-11 q-14,0 -16,11 z" fill="#22d3ee"/>
      <circle cx="15" cy="-11" r="6.5" fill="#22d3ee"/>
      <rect x="12" y="-9" width="6" height="4" rx="2" fill="#7C3AED"/>
      <circle cx="-5" cy="0" r="1.7" fill="#0b1220"/>
      <circle cx="5" cy="0" r="1.7" fill="#0b1220"/>
      <path d="M-3,5 q3,3 6,0" stroke="#0b1220" stroke-width="1.3" fill="none"/>
    </g>
    <polygon points="88,100 74,106 88,112" fill="#f8fafc"/>
    <rect x="88" y="76" width="440" height="58" rx="10" fill="#f8fafc"/>
    <text x="102" y="100" font-size="15" fill="#0b1220">标签君的 mini-fetch 跑了通：</text>
    <text x="102" y="122" font-size="15" fill="#0b1220">redirect → abort → 超时三条链都顺。</text>
    <rect x="24" y="152" width="524" height="140" rx="8" fill="#0a0f1c" stroke="#f472b6" stroke-opacity="0.35"/>
    <text x="38" y="174" font-size="12.5" fill="#fbbf24" font-family="'SF Mono',Consolas,monospace">// mini-fetch 的三条主线：</text>
    <text x="38" y="192" font-size="12.5" fill="#34d399" font-family="'SF Mono',Consolas,monospace">① 30x &amp;&amp; follow → 换 URL 对象重入</text>
    <text x="38" y="210" font-size="12.5" fill="#34d399" font-family="'SF Mono',Consolas,monospace">② abort 监听 → req.destroy() 立即炸断</text>
    <text x="38" y="228" font-size="12.5" fill="#34d399" font-family="'SF Mono',Consolas,monospace">③ 超时 setTimeout → 记状态再 destroy()</text>
    <text x="38" y="246" font-size="12.5" fill="#7dd3fc" font-family="'SF Mono',Consolas,monospace">// 小细节：超时 abort 后记得 clearTimeout</text>
    <text x="38" y="264" font-size="12.5" fill="#7dd3fc" font-family="'SF Mono',Consolas,monospace">// 不然下次请求回调还会误打过来</text>
    <text x="38" y="282" font-size="12.5" fill="#f472b6" font-family="'SF Mono',Consolas,monospace">timeout: 8000ms ✓   follow: 5 ✓   signal.cancel() ✓</text>
    <rect x="24" y="294" width="524" height="32" rx="8" fill="#111a30" stroke="#1e2a44"/>
    <rect x="24" y="294" width="4" height="32" rx="2" fill="#f472b6"/>
    <text x="40" y="316" font-size="13.5" fill="#e2e8f0">abort 后先记 aborted = true，再 destroy——</text>
  </g>

  <g transform="translate(608,462)">
    <rect width="572" height="361" rx="14" fill="#0e1730" stroke="#223055"/>
    <polygon points="420,0 480,0 150,361 90,361" fill="#f97316" opacity="0.04"/>
    <rect x="14" y="13" width="26" height="20" rx="6" fill="#f97316"/>
    <text x="27" y="28" text-anchor="middle" font-size="14" font-weight="bold" fill="#0b1220">4</text>
    <text x="50" y="29" font-size="17" font-weight="bold" fill="#e2e8f0">结案：三个不能忘</text>
    <g transform="translate(52,110)">
      <rect x="-19" y="14" width="38" height="22" rx="9" fill="#cbd5e1"/>
      <circle cx="0" cy="-2" r="16" fill="#ffd9b3"/>
      <path d="M-16,-2 a16,16 0 0 1 32,0 q-3,-12 -16,-12 q-13,0 -16,12 z" fill="#e2e8f0"/>
      <circle cx="-5" cy="0" r="4" fill="none" stroke="#94a3b8" stroke-width="1.4"/>
      <circle cx="5" cy="0" r="4" fill="none" stroke="#94a3b8" stroke-width="1.4"/>
      <path d="M-1,0 L1,0" stroke="#94a3b8" stroke-width="1.4"/>
      <circle cx="-5" cy="0" r="1.4" fill="#0b1220"/>
      <circle cx="5" cy="0" r="1.4" fill="#0b1220"/>
      <path d="M-8,5 q8,7 16,0 q-2,7 -8,7 q-6,0 -8,-7 z" fill="#e2e8f0"/>
    </g>
    <polygon points="88,100 74,106 88,112" fill="#f8fafc"/>
    <rect x="88" y="76" width="440" height="58" rx="10" fill="#f8fafc"/>
    <text x="102" y="100" font-size="15" fill="#0b1220">fetch = URL 解析器 + request 管理 + abort 信号——</text>
    <text x="102" y="122" font-size="15" fill="#0b1220">拆开看其实也没那么玄乎。</text>
    <rect x="24" y="148" width="96" height="26" rx="13" fill="#f97316"/>
    <text x="72" y="166" text-anchor="middle" font-size="13" font-weight="bold" fill="#0b1220">⚠ 坑点</text>
    <rect x="32" y="183" width="9" height="9" rx="2" fill="#f97316"/>
    <text x="52" y="192" font-size="13.5" fill="#e2e8f0">redirect 协议只能升级不能降级</text>
    <rect x="32" y="207" width="9" height="9" rx="2" fill="#f97316"/>
    <text x="52" y="216" font-size="13.5" fill="#e2e8f0">abort 后状态要先记再 destroy</text>
    <rect x="32" y="231" width="9" height="9" rx="2" fill="#f97316"/>
    <text x="52" y="240" font-size="13.5" fill="#e2e8f0">超时后要 clearTimeout 别让回调漏网</text>
    <rect x="32" y="255" width="9" height="9" rx="2" fill="#f97316"/>
    <text x="52" y="264" font-size="13.5" fill="#e2e8f0">location 头可能是相对路径，用 new URL 拼</text>
    <rect x="24" y="278" width="524" height="52" rx="8" fill="#111a30" stroke="#1e2a44"/>
    <rect x="24" y="278" width="4" height="52" rx="2" fill="#f97316"/>
    <text x="40" y="300" font-size="13" font-weight="bold" fill="#f97316">码叔总结</text>
    <text x="118" y="300" font-size="13" fill="#e2e8f0">URL 是活的、signal 是事件、timeout 是定时炸弹——</text>
    <text x="40" y="320" font-size="13" fill="#e2e8f0">手写 fetch 就像写一个有状态的小状态机。</text>
  </g>

  <text x="1180" y="832" text-anchor="end" font-size="11" fill="#475569">NEON INK · frontend-advanced-guide · EP.45</text>
</svg>
