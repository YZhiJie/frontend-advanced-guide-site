    <text x="102" y="118" font-size="15" fill="#0b1220">直接 reject！</text>
    <rect x="24" y="142" width="524" height="200" rx="8" fill="#0a0f1c" stroke="#f472b6" stroke-opacity="0.35"/>
    <text x="38" y="164" font-size="12.5" fill="#7dd3fc" font-family="'SF Mono',Consolas,monospace">下载量 &lt; 1万        +25</text>
    <text x="38" y="186" font-size="12.5" fill="#7dd3fc" font-family="'SF Mono',Consolas,monospace">730 天未发布       +25</text>
    <text x="38" y="208" font-size="12.5" fill="#f472b6" font-family="'SF Mono',Consolas,monospace">postinstall 脚本    +15</text>
    <text x="38" y="230" font-size="12.5" fill="#f472b6" font-family="'SF Mono',Consolas,monospace">传递依赖 &gt; 10      +15</text>
    <text x="38" y="252" font-size="12.5" fill="#f87171" font-family="'SF Mono',Consolas,monospace">已废弃              +30</text>
    <text x="38" y="280" font-size="12.5" fill="#34d399" font-family="'SF Mono',Consolas,monospace">// score 100 → reject</text>
    <text x="38" y="300" font-size="12.5" fill="#34d399" font-family="'SF Mono',Consolas,monospace">// 安装脚本硬门槛 → 至少 review</text>
    <text x="38" y="326" font-size="12" fill="#94a3b8" font-family="'SF Mono',Consolas,monospace">硬门槛优先于总分,废弃包一票否决</text>
