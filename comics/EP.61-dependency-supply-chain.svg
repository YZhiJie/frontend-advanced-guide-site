  <text x="126" y="40" font-size="26" font-weight="bold" fill="url(#titleGrad61)">依赖供应链暗门</text>
  <text x="1180" y="38" text-anchor="end" font-size="13" fill="#64748b">进阶漫画剧场 · 霓虹墨 NEON INK</text>
  <rect x="20" y="62" width="1160" height="2" rx="1" fill="url(#titleGrad61)" opacity="0.6"/>

  <g transform="translate(20,84)">
