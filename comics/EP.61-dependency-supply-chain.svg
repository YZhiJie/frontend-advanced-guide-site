    <text x="102" y="132" font-size="15" fill="#0b1220">而是一条闭环。</text>
    <rect x="24" y="162" width="524" height="180" rx="8" fill="#0a0f1c" stroke="#a78bfa" stroke-opacity="0.35"/>
    <text x="38" y="184" font-size="12.5" fill="#22d3ee" font-family="'SF Mono',Consolas,monospace">① 准入  评分/硬门槛/白名单</text>
    <text x="38" y="206" font-size="12.5" fill="#7dd3fc" font-family="'SF Mono',Consolas,monospace">② 锁定  lockfile/私有 registry</text>
    <text x="38" y="228" font-size="12.5" fill="#f472b6" font-family="'SF Mono',Consolas,monospace">③ 监测  audit/SBOM/漏洞情报</text>
    <text x="38" y="250" font-size="12.5" fill="#f87171" font-family="'SF Mono',Consolas,monospace">④ 响应  定级/SLA/修复路径</text>
    <text x="38" y="278" font-size="12.5" fill="#34d399" font-family="'SF Mono',Consolas,monospace">// 准入管源头,锁定管一致</text>
    <text x="38" y="298" font-size="12.5" fill="#34d399" font-family="'SF Mono',Consolas,monospace">// 监测管时效,响应管止损</text>
    <text x="38" y="324" font-size="12" fill="#94a3b8" font-family="'SF Mono',Consolas,monospace">缺一层就漏:准入最容易被跳过</text>
  </g>

  <g transform="translate(20,462)">
    <rect width="572" height="361" rx="14" fill="#0e1730" stroke="#223055"/>
    <polygon points="380,0 450,0 120,361 50,361" fill="#f472b6" opacity="0.04"/>
    <rect x="14" y="13" width="26" height="20" rx="6" fill="#f472b6"/>
    <text x="27" y="28" text-anchor="middle" font-size="14" font-weight="bold" fill="#0b1220">3</text>
    <text x="50" y="29" font-size="17" font-weight="bold" fill="#e2e8f0">实证：评分器一跑就露馅</text>
    <g transform="translate(52,110)">
      <rect x="-19" y="14" width="38" height="22" rx="9" fill="#a78bfa"/>
