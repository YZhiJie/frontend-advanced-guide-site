    <rect x="88" y="76" width="440" height="50" rx="10" fill="#f8fafc"/>
    <text x="102" y="98" font-size="15" fill="#0b1220">扫描器报的严重度，</text>
    <text x="102" y="118" font-size="15" fill="#0b1220">不等于你的有效风险。</text>
    <rect x="24" y="142" width="524" height="86" rx="8" fill="#0a0f1c" stroke="#f97316" stroke-opacity="0.35"/>
    <text x="38" y="166" font-size="12.5" fill="#22d3ee" font-family="'SF Mono',Consolas,monospace">有效严重度 = 声明 − 环境/可达 + 利用</text>
    <text x="38" y="188" font-size="12.5" fill="#f472b6" font-family="'SF Mono',Consolas,monospace">Critical 24h 止血 / 72h 修复</text>
    <text x="38" y="210" font-size="12.5" fill="#34d399" font-family="'SF Mono',Consolas,monospace">路径 升级→覆盖→补丁→替换→隔离→接受</text>
    <rect x="24" y="238" width="524" height="58" rx="8" fill="#0a0f1c" stroke="#f97316" stroke-opacity="0.35"/>
