<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 840" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#101a33"/>
    </linearGradient>
    <linearGradient id="titleGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="840" fill="url(#bg)"/>
  <polygon points="980,0 1060,0 760,840 680,840" fill="#22d3ee" opacity="0.04"/>
  <polygon points="150,0 220,0 1040,840 970,840" fill="#a78bfa" opacity="0.03"/>

  <rect x="20" y="14" width="92" height="36" rx="9" fill="#7C3AED"/>
  <text x="66" y="38" text-anchor="middle" font-size="18" font-weight="bold" fill="#ffffff">EP.35</text>
  <text x="126" y="40" font-size="26" font-weight="bold" fill="url(#titleGrad)">正则高级用法通关</text>
  <text x="1180" y="38" text-anchor="end" font-size="13" fill="#64748b">进阶漫画剧场 · 霓虹墨 NEON INK</text>
  <rect x="20" y="62" width="1160" height="2" rx="1" fill="url(#titleGrad)" opacity="0.6"/>

  <g transform="translate(20,84)">
    <rect width="572" height="361" rx="14" fill="#0e1730" stroke="#223055"/>
    <polygon points="380,0 450,0 120,361 50,361" fill="#22d3ee" opacity="0.04"/>
    <rect x="14" y="13" width="26" height="20" rx="6" fill="#22d3ee"/>
    <text x="27" y="28" text-anchor="middle" font-size="14" font-weight="bold" fill="#0b1220">1</text>
    <text x="50" y="29" font-size="17" font-weight="bold" fill="#e2e8f0">困境：贪婪吞了整串</text>
    <g transform="translate(52,110)">
      <rect x="-19" y="14" width="38" height="22" rx="9" fill="#1d4ed8"/>
      <path d="M-5,18 L5,18 L3.5,27 L0,29 L-3.5,27 Z" fill="#f97316"/>
      <circle cx="0" cy="-2" r="16" fill="#ffd9b3"/>
      <path d="M-16,-2 L-11,-13 L-6,-4 L0,-14 L6,-4 L11,-13 L16,-2 Q0,-11 -16,-2 Z" fill="#f97316"/>
      <circle cx="-5" cy="0" r="1.7" fill="#0b1220"/>
      <circle cx="5" cy="0" r="1.7" fill="#0b1220"/>
      <path d="M-3,5 q3,3 6,0" stroke="#0b1220" stroke-width="1.3" fill="none"/>
    </g>
    <polygon points="88,100 74,106 88,112" fill="#f8fafc"/>
    <rect x="88" y="76" width="440" height="58" rx="10" fill="#f8fafc"/>
    <text x="102" y="100" font-size="15" fill="#0b1220">提取标签怎么整串都被吃掉？</text>
    <text x="102" y="122" font-size="15" fill="#0b1220">量词默认贪婪，先吃满再回吐。</text>
    <rect x="24" y="152" width="524" height="118" rx="8" fill="#0a0f1c" stroke="#22d3ee" stroke-opacity="0.35"/>
    <text x="38" y="174" font-size="12.5" fill="#fbbf24" font-family="'SF Mono',Consolas,monospace">// 贪婪:先吃满,再逐字符回吐(回溯)</text>
    <text x="38" y="192" font-size="12.5" fill="#7dd3fc" font-family="'SF Mono',Consolas,monospace">html.match(/&lt;.+&gt;/)   // 整串被吞!</text>
    <text x="38" y="210" font-size="12.5" fill="#7dd3fc" font-family="'SF Mono',Consolas,monospace">html.match(/&lt;.+?&gt;/)  // ['&lt;div&gt;']</text>
    <text x="38" y="228" font-size="12.5" fill="#34d399" font-family="'SF Mono',Consolas,monospace">// 嵌套量词→指数级回溯(ReDoS)</text>
    <text x="38" y="246" font-size="12.5" fill="#f472b6" font-family="'SF Mono',Consolas,monospace">/^(a+)+b$/.test('a'.repeat(30)+'c')</text>
    <rect x="24" y="278" width="524" height="52" rx="8" fill="#111a30" stroke="#1e2a44"/>
    <rect x="24" y="278" width="4" height="52" rx="2" fill="#22d3ee"/>
    <text x="40" y="300" font-size="13.5" fill="#e2e8f0">贪婪先吃满再回吐，惰性满足即停。</text>
    <text x="40" y="320" font-size="13.5" fill="#94a3b8">——一个问号，两种"吃到几口"的策略。</text>
  </g>

  <g transform="translate(608,84)">
    <rect width="572" height="361" rx="14" fill="#0e1730" stroke="#223055"/>
    <polygon points="420,0 480,0 150,361 90,361" fill="#a78bfa" opacity="0.04"/>
    <rect x="14" y="13" width="26" height="20" rx="6" fill="#a78bfa"/>
    <text x="27" y="28" text-anchor="middle" font-size="14" font-weight="bold" fill="#0b1220">2</text>
    <text x="50" y="29" font-size="17" font-weight="bold" fill="#e2e8f0">揭秘：分组三兄弟</text>
    <g transform="translate(52,110)">
      <rect x="-19" y="14" width="38" height="22" rx="9" fill="#cbd5e1"/>
      <circle cx="0" cy="-2" r="16" fill="#ffd9b3"/>
      <path d="M-16,-2 a16,16 0 0 1 32,0 q-3,-12 -16,-12 q-13,0 -16,12 z" fill="#e2e8f0"/>
      <circle cx="-5" cy="0" r="4" fill="none" stroke="#94a3b8" stroke-width="1.4"/>
      <circle cx="5" cy="0" r="4" fill="none" stroke="#94a3b8" stroke-width="1.4"/>
      <path d="M-1,0 L1,0" stroke="#94a3b8" stroke-width="1.4"/>
      <circle cx="-5" cy="0" r="1.4" fill="#0b1220"/>
      <circle cx="5" cy="0" r="1.4" fill="#0b1220"/>
      <path d="M-8,5 q8,7 16,0 q-2,7 -8,7 q-6,0 -8,-7 z" fill="#e2e8f0"/>
    </g>
    <polygon points="88,100 74,106 88,112" fill="#f8fafc"/>
    <rect x="88" y="76" width="440" height="58" rx="10" fill="#f8fafc"/>
    <text x="102" y="100" font-size="15" fill="#0b1220">别急着背符号：三种括号三件事，</text>
    <text x="102" y="122" font-size="15" fill="#0b1220">存不存、叫不叫名，一眼分清。</text>
    <rect x="24" y="152" width="250" height="30" rx="8" fill="#111a30" stroke="#22d3ee" stroke-opacity="0.5"/>
    <text x="149" y="172" text-anchor="middle" font-size="13" fill="#22d3ee">① (x) 捕获：存值占下标</text>
    <rect x="298" y="152" width="250" height="30" rx="8" fill="#111a30" stroke="#a78bfa" stroke-opacity="0.5"/>
    <text x="423" y="172" text-anchor="middle" font-size="13" fill="#a78bfa">② (?:x) 只分组不存</text>
    <rect x="24" y="190" width="250" height="30" rx="8" fill="#111a30" stroke="#f472b6" stroke-opacity="0.5"/>
    <text x="149" y="210" text-anchor="middle" font-size="13" fill="#f472b6">③ (?&lt;n&gt;x) 命名：挂 groups</text>
    <rect x="298" y="190" width="250" height="30" rx="8" fill="#111a30" stroke="#f97316" stroke-opacity="0.5"/>
    <text x="423" y="210" text-anchor="middle" font-size="13" fill="#f97316">④ \1 \k&lt;n&gt;：反向引用</text>
    <rect x="24" y="228" width="250" height="30" rx="8" fill="#111a30" stroke="#34d399" stroke-opacity="0.5"/>
    <text x="149" y="248" text-anchor="middle" font-size="13" fill="#34d399">⑤ $1 $&lt;n&gt;：重排文本</text>
    <rect x="298" y="228" width="250" height="30" rx="8" fill="#111a30" stroke="#fbbf24" stroke-opacity="0.5"/>
    <text x="423" y="248" text-anchor="middle" font-size="13" fill="#fbbf24">⑥ matchAll+/g 全量遍历</text>
    <rect x="24" y="278" width="524" height="52" rx="8" fill="#111a30" stroke="#1e2a44"/>
    <rect x="24" y="278" width="4" height="52" rx="2" fill="#a78bfa"/>
    <text x="40" y="300" font-size="13.5" fill="#e2e8f0">要按名取值用 (?&lt;name&gt;)，配 matchAll</text>
    <text x="40" y="320" font-size="13.5" fill="#94a3b8">遍历全部匹配——可读性远胜魔法下标。</text>
  </g>

  <g transform="translate(20,462)">
    <rect width="572" height="361" rx="14" fill="#0e1730" stroke="#223055"/>
    <polygon points="380,0 450,0 120,361 50,361" fill="#f472b6" opacity="0.04"/>
    <rect x="14" y="13" width="26" height="20" rx="6" fill="#f472b6"/>
    <text x="27" y="28" text-anchor="middle" font-size="14" font-weight="bold" fill="#0b1220">3</text>
    <text x="50" y="29" font-size="17" font-weight="bold" fill="#e2e8f0">实证：四种零宽断言</text>
    <g transform="translate(52,110)">
      <rect x="-19" y="14" width="38" height="22" rx="9" fill="#7C3AED"/>
      <circle cx="0" cy="-2" r="16" fill="#ffd9b3"/>
      <path d="M-16,-2 a16,16 0 0 1 32,0 q-2,-11 -16,-11 q-14,0 -16,11 z" fill="#22d3ee"/>
      <circle cx="15" cy="-11" r="6.5" fill="#22d3ee"/>
      <rect x="12" y="-9" width="6" height="4" rx="2" fill="#7C3AED"/>
      <circle cx="-5" cy="0" r="1.7" fill="#0b1220"/>
      <circle cx="5" cy="0" r="1.7" fill="#0b1220"/>
      <path d="M-3,5 q3,3 6,0" stroke="#0b1220" stroke-width="1.3" fill="none"/>
    </g>
    <polygon points="88,100 74,106 88,112" fill="#f8fafc"/>
    <rect x="88" y="76" width="440" height="58" rx="10" fill="#f8fafc"/>
    <text x="102" y="100" font-size="15" fill="#0b1220">断言像探针：只看位置不吃字符，</text>
    <text x="102" y="122" font-size="15" fill="#0b1220">前后左右四个方向都能站岗。</text>
    <rect x="24" y="152" width="524" height="118" rx="8" fill="#0a0f1c" stroke="#f472b6" stroke-opacity="0.35"/>
    <text x="38" y="174" font-size="12.5" fill="#fbbf24" font-family="'SF Mono',Consolas,monospace">// ?= 右是  ?! 右非  站在两个字符之间</text>
    <text x="38" y="192" font-size="12.5" fill="#7dd3fc" font-family="'SF Mono',Consolas,monospace">/\d+(?=元)/g   // 100、300</text>
    <text x="38" y="210" font-size="12.5" fill="#f472b6" font-family="'SF Mono',Consolas,monospace">/\d+(?!元)/g   // 10,200,30 截尾!</text>
    <text x="38" y="228" font-size="12.5" fill="#34d399" font-family="'SF Mono',Consolas,monospace">(?&lt;=\$)\d+     // 左是 $ 才要</text>
    <text x="38" y="246" font-size="12.5" fill="#7dd3fc" font-family="'SF Mono',Consolas,monospace">(?&lt;!\$)\b\d+    // 左非 $ 才要</text>
    <rect x="24" y="278" width="524" height="52" rx="8" fill="#111a30" stroke="#1e2a44"/>
    <rect x="24" y="278" width="4" height="52" rx="2" fill="#f472b6"/>
    <text x="40" y="300" font-size="13.5" fill="#e2e8f0">千分位 = \B 与 (?=...) 的位置组合；</text>
    <text x="40" y="320" font-size="13.5" fill="#94a3b8">密码校验 = 多个 (?=...) 并列关卡。</text>
  </g>

  <g transform="translate(608,462)">
    <rect width="572" height="361" rx="14" fill="#0e1730" stroke="#223055"/>
    <polygon points="420,0 480,0 150,361 90,361" fill="#f97316" opacity="0.04"/>
    <rect x="14" y="13" width="26" height="20" rx="6" fill="#f97316"/>
    <text x="27" y="28" text-anchor="middle" font-size="14" font-weight="bold" fill="#0b1220">4</text>
    <text x="50" y="29" font-size="17" font-weight="bold" fill="#e2e8f0">结案：坑在回溯上</text>
    <g transform="translate(52,110)">
      <rect x="-19" y="14" width="38" height="22" rx="9" fill="#cbd5e1"/>
      <circle cx="0" cy="-2" r="16" fill="#ffd9b3"/>
      <path d="M-16,-2 a16,16 0 0 1 32,0 q-3,-12 -16,-12 q-13,0 -16,12 z" fill="#e2e8f0"/>
      <circle cx="-5" cy="0" r="4" fill="none" stroke="#94a3b8" stroke-width="1.4"/>
      <circle cx="5" cy="0" r="4" fill="none" stroke="#94a3b8" stroke-width="1.4"/>
      <path d="M-1,0 L1,0" stroke="#94a3b8" stroke-width="1.4"/>
      <circle cx="-5" cy="0" r="1.4" fill="#0b1220"/>
      <circle cx="5" cy="0" r="1.4" fill="#0b1220"/>
      <path d="M-8,5 q8,7 16,0 q-2,7 -8,7 q-6,0 -8,-7 z" fill="#e2e8f0"/>
    </g>
    <polygon points="88,100 74,106 88,112" fill="#f8fafc"/>
    <rect x="88" y="76" width="440" height="58" rx="10" fill="#f8fafc"/>
    <text x="102" y="100" font-size="15" fill="#0b1220">从吞并到截尾，坑全在回溯上，</text>
    <text x="102" y="122" font-size="15" fill="#0b1220">写之前先想清楚它怎么退。</text>
    <rect x="24" y="148" width="96" height="26" rx="13" fill="#f97316"/>
    <text x="72" y="166" text-anchor="middle" font-size="13" font-weight="bold" fill="#0b1220">⚠ 坑点</text>
    <rect x="32" y="183" width="9" height="9" rx="2" fill="#f97316"/>
    <text x="52" y="192" font-size="13.5" fill="#e2e8f0">贪婪遇嵌套跨标签吞并，切 HTML 用 DOM</text>
    <rect x="32" y="207" width="9" height="9" rx="2" fill="#f97316"/>
    <text x="52" y="216" font-size="13.5" fill="#e2e8f0">(a+)+b 类嵌套量词指数回溯 → ReDoS</text>
    <rect x="32" y="231" width="9" height="9" rx="2" fill="#f97316"/>
    <text x="52" y="240" font-size="13.5" fill="#e2e8f0">负向先行 \d+(?!元) 回溯截尾：100→10</text>
    <rect x="32" y="255" width="9" height="9" rx="2" fill="#f97316"/>
    <text x="52" y="264" font-size="13.5" fill="#e2e8f0">ES2025 重复命名组：先探测再降级</text>
    <rect x="24" y="278" width="524" height="52" rx="8" fill="#111a30" stroke="#1e2a44"/>
    <rect x="24" y="278" width="4" height="52" rx="2" fill="#f97316"/>
    <text x="40" y="300" font-size="13" font-weight="bold" fill="#f97316">码叔总结</text>
    <text x="118" y="300" font-size="13" fill="#e2e8f0">贪婪吃满再回吐，惰性满足即停；</text>
    <text x="118" y="320" font-size="13" fill="#e2e8f0">断言只定位置，回溯才是坑源。</text>
  </g>

  <text x="1180" y="832" text-anchor="end" font-size="11" fill="#475569">NEON INK · frontend-advanced-guide · EP.35</text>
</svg>
