    <rect x="342" y="140" width="96" height="30" rx="8" fill="#111a30" stroke="#f97316" stroke-opacity="0.5"/>
    <text x="390" y="160" text-anchor="middle" font-size="12.5" fill="#f97316">④ 遍历顺序</text>
    <rect x="448" y="140" width="96" height="30" rx="8" fill="#111a30" stroke="#34d399" stroke-opacity="0.5"/>
    <text x="496" y="160" text-anchor="middle" font-size="12.5" fill="#34d399">⑤ 返回值</text>
