    <text x="490" y="214" text-anchor="middle" font-size="12.5" fill="#94a3b8" font-family="'SF Mono',Consolas,monospace">5</text>
    <text x="40" y="250" font-size="12.5" fill="#fbbf24" font-family="'SF Mono',Consolas,monospace">dp[i] = max(nums[i], dp[i-1]+nums[i])</text>
    <text x="40" y="276" font-size="13.5" fill="#34d399">答案 6：子数组 [4, -1, 2, 1]</text>
    <rect x="24" y="296" width="524" height="44" rx="8" fill="#111a30" stroke="#1e2a44"/>
    <rect x="24" y="296" width="4" height="44" rx="2" fill="#f472b6"/>
    <text x="40" y="314" font-size="13.5" fill="#e2e8f0">前序和一旦变负，</text>
    <text x="40" y="332" font-size="13.5" fill="#94a3b8">果断从当前元素重开。</text>
