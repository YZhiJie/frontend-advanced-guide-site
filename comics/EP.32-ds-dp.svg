    <rect x="86" y="196" width="40" height="26" rx="4" fill="#0a0f1c" stroke="#223055"/>
    <text x="106" y="214" text-anchor="middle" font-size="12.5" fill="#94a3b8" font-family="'SF Mono',Consolas,monospace">-2</text>
    <rect x="134" y="196" width="40" height="26" rx="4" fill="#0a0f1c" stroke="#223055"/>
    <text x="154" y="214" text-anchor="middle" font-size="12.5" fill="#94a3b8" font-family="'SF Mono',Consolas,monospace">1</text>
