    <text x="202" y="214" text-anchor="middle" font-size="12.5" fill="#94a3b8" font-family="'SF Mono',Consolas,monospace">-2</text>
    <rect x="230" y="196" width="40" height="26" rx="4" fill="#0a0f1c" stroke="#223055"/>
    <text x="250" y="214" text-anchor="middle" font-size="12.5" fill="#94a3b8" font-family="'SF Mono',Consolas,monospace">4</text>
    <rect x="278" y="196" width="40" height="26" rx="4" fill="#0a0f1c" stroke="#223055"/>
    <text x="298" y="214" text-anchor="middle" font-size="12.5" fill="#94a3b8" font-family="'SF Mono',Consolas,monospace">3</text>
    <rect x="326" y="196" width="40" height="26" rx="4" fill="#0a0f1c" stroke="#223055"/>
    <text x="346" y="214" text-anchor="middle" font-size="12.5" fill="#94a3b8" font-family="'SF Mono',Consolas,monospace">5</text>
    <rect x="374" y="196" width="40" height="26" rx="4" fill="#0a0f1c" stroke="#f97316" stroke-width="2"/>
