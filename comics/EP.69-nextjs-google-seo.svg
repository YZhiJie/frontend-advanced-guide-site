<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 840" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1220"/><stop offset="1" stop-color="#101a33"/></linearGradient>
    <linearGradient id="titleGrad" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#22d3ee"/><stop offset="1" stop-color="#a78bfa"/></linearGradient>
  </defs>
  <rect width="1200" height="840" fill="url(#bg)"/>
  <polygon points="980,0 1060,0 760,840 680,840" fill="#22d3ee" opacity="0.04"/>

  <rect x="20" y="14" width="92" height="36" rx="9" fill="#7C3AED"/>
  <text x="66" y="38" text-anchor="middle" font-size="18" font-weight="bold" fill="#fff">EP.69</text>
  <text x="126" y="40" font-size="26" font-weight="bold" fill="url(#titleGrad)">让 Google 搜到你的站</text>
  <text x="1180" y="38" text-anchor="end" font-size="13" fill="#64748b">进阶漫画剧场 · 霓虹墨 NEON INK</text>
  <rect x="20" y="62" width="1160" height="2" rx="1" fill="url(#titleGrad)" opacity="0.6"/>

  <g transform="translate(20,84)">
    <rect width="572" height="361" rx="14" fill="#0e1730" stroke="#223055"/>
    <rect x="14" y="13" width="26" height="20" rx="6" fill="#22d3ee"/>
    <text x="27" y="28" text-anchor="middle" font-size="14" font-weight="bold" fill="#0b1220">1</text>
    <text x="50" y="29" font-size="17" font-weight="bold" fill="#e2e8f0">困境：Google 搜不到</text>
    <text x="28" y="130" font-size="14" fill="#94a3b8">海外站点上线了，</text>
    <text x="28" y="152" font-size="14" fill="#f97316">但 Google 搜索根本找不到我们的页面。</text>
    <rect x="24" y="175" width="524" height="94" rx="8" fill="#0a0f1c" stroke="#f97316" stroke-opacity="0.4"/>
    <text x="38" y="198" font-size="13" fill="#fdba74" font-family="monospace">页面用 CSR 渲染，</text>
    <text x="38" y="220" font-size="13" fill="#fdba74" font-family="monospace">爬虫拿到的是空壳 HTML</text>
    <text x="38" y="242" font-size="13" fill="#fdba74" font-family="monospace">→ 无法索引内容</text>
    <rect x="24" y="295" width="524" height="44" rx="8" fill="#111a30" stroke="#1e2a44"/>
    <text x="40" y="322" font-size="13.5" fill="#e2e8f0">需要 SEO 的页面不能用纯 CSR。</text>
  </g>

  <g transform="translate(608,84)">
    <rect width="572" height="361" rx="14" fill="#0e1730" stroke="#223055"/>
    <rect x="14" y="13" width="26" height="20" rx="6" fill="#a78bfa"/>
    <text x="27" y="28" text-anchor="middle" font-size="14" font-weight="bold" fill="#0b1220">2</text>
    <text x="50" y="29" font-size="17" font-weight="bold" fill="#e2e8f0">揭秘：渲染策略与 Metadata</text>
    <rect x="24" y="50" width="524" height="180" rx="8" fill="#0a0f1c" stroke="#a78bfa" stroke-opacity="0.3"/>
    <text x="38" y="72" font-size="12.5" fill="#7dd3fc" font-family="monospace">SSG  构建时生成  静态内容</text>
    <text x="38" y="92" font-size="12.5" fill="#94a3b8">SSR  请求时生成  实时数据</text>
    <text x="38" y="112" font-size="12.5" fill="#94a3b8">ISR  构建+定时重建  定期更新</text>
    <text x="38" y="132" font-size="12.5" fill="#94a3b8">CSR  客户端渲染  无需 SEO 的页</text>
    <text x="38" y="152" font-size="12.5" fill="#f472b6" font-family="monospace">Metadata API (Next.js App Router):</text>
    <text x="38" y="172" font-size="12.5" fill="#94a3b8">  title &lt; 60字符</text>
    <text x="38" y="192" font-size="12.5" fill="#94a3b8">  description 50-160字符</text>
    <text x="38" y="212" font-size="12.5" fill="#94a3b8">  openGraph.image 1200x630</text>
    <rect x="24" y="250" width="524" height="80" rx="8" fill="#111a30" stroke="#1e2a44"/>
    <text x="40" y="274" font-size="13.5" fill="#e2e8f0">SEO 页面用 SSG/SSR/ISR，</text>
    <text x="40" y="294" font-size="13.5" fill="#94a3b8">Metadata 写对 title/description/OG。</text>
    <text x="40" y="314" font-size="13.5" fill="#94a3b8">爬虫才能正确索引。</text>
  </g>

  <g transform="translate(20,465)">
    <rect width="572" height="361" rx="14" fill="#0e1730" stroke="#223055"/>
    <rect x="14" y="13" width="26" height="20" rx="6" fill="#34d399"/>
    <text x="27" y="28" text-anchor="middle" font-size="14" font-weight="bold" fill="#0b1220">3</text>
    <text x="50" y="29" font-size="17" font-weight="bold" fill="#e2e8f0">实证：sitemap + JSON-LD</text>
    <text x="28" y="70" font-size="14" fill="#94a3b8">告诉爬虫有哪些页面，</text>
    <text x="28" y="90" font-size="14" fill="#94a3b8">告诉爬虫页面内容的语义。</text>
    <rect x="24" y="110" width="524" height="150" rx="8" fill="#0a0f1c" stroke="#34d399" stroke-opacity="0.3"/>
    <text x="38" y="132" font-size="12.5" fill="#7dd3fc" font-family="monospace">sitemap.xml: 列出所有 URL</text>
    <text x="38" y="152" font-size="12.5" fill="#94a3b8">  robots.txt: 指向 sitemap</text>
    <text x="38" y="172" font-size="12.5" fill="#7dd3fc" font-family="monospace">JSON-LD 结构化数据:</text>
    <text x="38" y="192" font-size="12.5" fill="#94a3b8">  @type: Article/Product/FAQPage</text>
    <text x="38" y="212" font-size="12.5" fill="#f472b6" font-family="monospace">  搜索结果展示富片段</text>
    <text x="38" y="240" font-size="12.5" fill="#94a3b8">FAQPage → 搜索结果显示问答</text>
    <rect x="24" y="280" width="524" height="56" rx="8" fill="#111a30" stroke="#1e2a44"/>
    <text x="40" y="305" font-size="13.5" fill="#e2e8f0">sitemap 让爬虫发现页面，</text>
    <text x="40" y="325" font-size="13.5" fill="#94a3b8">JSON-LD 让爬虫理解内容。</text>
  </g>

  <g transform="translate(608,465)">
    <rect width="572" height="361" rx="14" fill="#0e1730" stroke="#223055"/>
    <rect x="14" y="13" width="26" height="20" rx="6" fill="#f472b6"/>
    <text x="27" y="28" text-anchor="middle" font-size="14" font-weight="bold" fill="#0b1220">4</text>
    <text x="50" y="29" font-size="17" font-weight="bold" fill="#e2e8f0">结案：Core Web Vitals</text>
    <text x="28" y="70" font-size="14" fill="#94a3b8">Google 用 CWV 衡量体验，</text>
    <text x="28" y="90" font-size="14" fill="#94a3b8">直接影响搜索排名。</text>
    <rect x="24" y="110" width="524" height="130" rx="8" fill="#0a0f1c" stroke="#f472b6" stroke-opacity="0.3"/>
    <text x="38" y="132" font-size="12.5" fill="#7dd3fc" font-family="monospace">LCP &lt; 2.5s  最大内容绘制</text>
    <text x="38" y="152" font-size="12.5" fill="#94a3b8">  → next/image 自动压缩</text>
    <text x="38" y="172" font-size="12.5" fill="#7dd3fc" font-family="monospace">CLS &lt; 0.1  累计布局偏移</text>
    <text x="38" y="192" font-size="12.5" fill="#94a3b8">  → 图片固定宽高</text>
    <text x="38" y="212" font-size="12.5" fill="#7dd3fc" font-family="monospace">INP &lt; 200ms 交互到下一帧</text>
    <text x="38" y="226" font-size="12.5" fill="#94a3b8">  → 拆长任务，Web Worker</text>
    <rect x="24" y="260" width="524" height="76" rx="8" fill="#111a30" stroke="#1e2a44"/>
    <rect x="24" y="260" width="4" height="76" rx="2" fill="#f472b6"/>
    <text x="40" y="285" font-size="13.5" fill="#e2e8f0">核心口诀：SEO 用 SSG/SSR，</text>
    <text x="40" y="305" font-size="13.5" fill="#94a3b8">Metadata 写对，sitemap+JSON-LD，</text>
    <text x="40" y="325" font-size="13.5" fill="#94a3b8">CWV 达标影响排名。</text>
  </g>
</svg>
