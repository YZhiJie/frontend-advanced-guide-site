<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 840" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#101a33"/>
    </linearGradient>
    <linearGradient id="titleGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="840" fill="url(#bg)"/>
  <polygon points="980,0 1060,0 760,840 680,840" fill="#22d3ee" opacity="0.04"/>
  <polygon points="150,0 220,0 1040,840 970,840" fill="#a78bfa" opacity="0.03"/>

  <rect x="20" y="14" width="92" height="36" rx="9" fill="#7C3AED"/>
  <text x="66" y="38" text-anchor="middle" font-size="18" font-weight="bold" fill="#ffffff">EP.19</text>
  <text x="126" y="40" font-size="26" font-weight="bold" fill="url(#titleGrad)">业务片段百宝箱</text>
  <text x="1180" y="38" text-anchor="end" font-size="13" fill="#64748b">进阶漫画剧场 · 霓虹墨 NEON INK</text>
  <rect x="20" y="62" width="1160" height="2" rx="1" fill="url(#titleGrad)" opacity="0.6"/>

  <g transform="translate(20,84)">
    <rect width="572" height="361" rx="14" fill="#0e1730" stroke="#223055"/>
    <polygon points="380,0 450,0 120,361 50,361" fill="#22d3ee" opacity="0.04"/>
    <rect x="14" y="13" width="26" height="20" rx="6" fill="#22d3ee"/>
    <text x="27" y="28" text-anchor="middle" font-size="14" font-weight="bold" fill="#0b1220">1</text>
    <text x="50" y="29" font-size="17" font-weight="bold" fill="#e2e8f0">困境：第一百遍复制</text>
    <g transform="translate(52,110)">
      <rect x="-19" y="14" width="38" height="22" rx="9" fill="#1d4ed8"/>
      <path d="M-5,18 L5,18 L3.5,27 L0,29 L-3.5,27 Z" fill="#f97316"/>
      <circle cx="0" cy="-2" r="16" fill="#ffd9b3"/>
      <path d="M-16,-2 L-11,-13 L-6,-4 L0,-14 L6,-4 L11,-13 L16,-2 Q0,-11 -16,-2 Z" fill="#f97316"/>
      <circle cx="-5" cy="0" r="1.7" fill="#0b1220"/>
      <circle cx="5" cy="0" r="1.7" fill="#0b1220"/>
      <path d="M-3,5 q3,3 6,0" stroke="#0b1220" stroke-width="1.3" fill="none"/>
    </g>
    <polygon points="88,100 74,106 88,112" fill="#f8fafc"/>
    <rect x="88" y="82" width="252" height="52" rx="10" fill="#f8fafc"/>
    <text x="102" y="104" font-size="15" fill="#0b1220">表单校验、提交锁、倒计时…</text>
    <text x="102" y="126" font-size="15" fill="#0b1220">每个项目都重写一遍！</text>
    <rect x="24" y="152" width="524" height="110" rx="8" fill="#0a0f1c" stroke="#22d3ee" stroke-opacity="0.35"/>
    <text x="38" y="174" font-size="12.5" fill="#64748b" font-family="'SF Mono',Consolas,monospace">// 三个项目的 utils 目录里躺着:</text>
    <text x="38" y="192" font-size="12.5" fill="#7dd3fc" font-family="'SF Mono',Consolas,monospace">validatePhone()  formatAmount()</text>
    <text x="38" y="210" font-size="12.5" fill="#7dd3fc" font-family="'SF Mono',Consolas,monospace">withSubmitLock()  countdown()</text>
    <text x="38" y="228" font-size="12.5" fill="#f472b6" font-family="'SF Mono',Consolas,monospace">// 同一套逻辑,开新项目就抄一遍</text>
    <text x="38" y="246" font-size="12.5" fill="#f472b6" font-family="'SF Mono',Consolas,monospace">// 边界 bug 也一并抄了过去</text>
    <rect x="24" y="278" width="524" height="52" rx="8" fill="#111a30" stroke="#1e2a44"/>
    <rect x="24" y="278" width="4" height="52" rx="2" fill="#22d3ee"/>
    <text x="40" y="300" font-size="13.5" fill="#e2e8f0">规则散落在事件回调里,文案各写各的;</text>
    <text x="40" y="320" font-size="13.5" fill="#94a3b8">复制的次数,就是重新踩坑的次数。</text>
  </g>

  <g transform="translate(608,84)">
    <rect width="572" height="361" rx="14" fill="#0e1730" stroke="#223055"/>
    <polygon points="420,0 480,0 150,361 90,361" fill="#a78bfa" opacity="0.04"/>
    <rect x="14" y="13" width="26" height="20" rx="6" fill="#a78bfa"/>
    <text x="27" y="28" text-anchor="middle" font-size="14" font-weight="bold" fill="#0b1220">2</text>
    <text x="50" y="29" font-size="17" font-weight="bold" fill="#e2e8f0">揭秘：规则即数据</text>
    <g transform="translate(52,110)">
      <rect x="-19" y="14" width="38" height="22" rx="9" fill="#cbd5e1"/>
      <circle cx="0" cy="-2" r="16" fill="#ffd9b3"/>
      <path d="M-16,-2 a16,16 0 0 1 32,0 q-3,-12 -16,-12 q-13,0 -16,12 z" fill="#e2e8f0"/>
      <circle cx="-5" cy="0" r="4" fill="none" stroke="#94a3b8" stroke-width="1.4"/>
      <circle cx="5" cy="0" r="4" fill="none" stroke="#94a3b8" stroke-width="1.4"/>
      <path d="M-1,0 L1,0" stroke="#94a3b8" stroke-width="1.4"/>
      <circle cx="-5" cy="0" r="1.4" fill="#0b1220"/>
      <circle cx="5" cy="0" r="1.4" fill="#0b1220"/>
      <path d="M-8,5 q8,7 16,0 q-2,7 -8,7 q-6,0 -8,-7 z" fill="#e2e8f0"/>
    </g>
    <polygon points="88,100 74,106 88,112" fill="#f8fafc"/>
    <rect x="88" y="82" width="252" height="52" rx="10" fill="#f8fafc"/>
    <text x="102" y="104" font-size="15" fill="#0b1220">规则写成数据,不是 if-else,</text>
    <text x="102" y="126" font-size="15" fill="#0b1220">校验引擎只有一份。</text>
    <rect x="24" y="152" width="524" height="110" rx="8" fill="#0a0f1c" stroke="#a78bfa" stroke-opacity="0.35"/>
    <text x="38" y="174" font-size="12.5" fill="#7dd3fc" font-family="'SF Mono',Consolas,monospace">phone: [</text>
    <text x="38" y="192" font-size="12.5" fill="#7dd3fc" font-family="'SF Mono',Consolas,monospace">  required('请输入手机号'),</text>
    <text x="38" y="210" font-size="12.5" fill="#7dd3fc" font-family="'SF Mono',Consolas,monospace">  pattern(/^1[3-9]\d{9}$/, '格式不正确'),</text>
    <text x="38" y="228" font-size="12.5" fill="#7dd3fc" font-family="'SF Mono',Consolas,monospace">]</text>
    <text x="38" y="246" font-size="12.5" fill="#34d399" font-family="'SF Mono',Consolas,monospace">validateForm(form, schema) // 一份引擎</text>
    <rect x="24" y="278" width="524" height="52" rx="8" fill="#111a30" stroke="#1e2a44"/>
    <rect x="24" y="278" width="4" height="52" rx="2" fill="#a78bfa"/>
    <text x="40" y="300" font-size="13.5" fill="#e2e8f0">blur 校验单字段,只报第一条错误;</text>
    <text x="40" y="320" font-size="13.5" fill="#94a3b8">submit 全表收集,schema 可后端下发。</text>
  </g>

  <g transform="translate(20,462)">
    <rect width="572" height="361" rx="14" fill="#0e1730" stroke="#223055"/>
    <polygon points="380,0 450,0 120,361 50,361" fill="#f472b6" opacity="0.04"/>
    <rect x="14" y="13" width="26" height="20" rx="6" fill="#f472b6"/>
    <text x="27" y="28" text-anchor="middle" font-size="14" font-weight="bold" fill="#0b1220">3</text>
    <text x="50" y="29" font-size="17" font-weight="bold" fill="#e2e8f0">实证：连点只下一单</text>
    <g transform="translate(52,110)">
      <rect x="-19" y="14" width="38" height="22" rx="9" fill="#7C3AED"/>
      <circle cx="0" cy="-2" r="16" fill="#ffd9b3"/>
      <path d="M-16,-2 a16,16 0 0 1 32,0 q-3,-13 -16,-13 q-13,0 -16,13 z" fill="#22d3ee"/>
      <circle cx="15" cy="4" r="6.5" fill="#22d3ee"/>
      <circle cx="-5" cy="0" r="1.7" fill="#0b1220"/>
      <circle cx="5" cy="0" r="1.7" fill="#0b1220"/>
      <path d="M-3,5 q3,3 6,0" stroke="#0b1220" stroke-width="1.3" fill="none"/>
    </g>
    <polygon points="88,100 74,106 88,112" fill="#f8fafc"/>
    <rect x="88" y="82" width="196" height="52" rx="10" fill="#f8fafc"/>
    <text x="102" y="104" font-size="15" fill="#0b1220">连点五下支付按钮,</text>
    <text x="102" y="126" font-size="15" fill="#0b1220">后台会收到几张单？</text>
    <rect x="24" y="152" width="524" height="110" rx="8" fill="#0a0f1c" stroke="#f472b6" stroke-opacity="0.35"/>
    <text x="38" y="174" font-size="12.5" fill="#7dd3fc" font-family="'SF Mono',Consolas,monospace">const submit = withSubmitLock(createOrder)</text>
    <text x="38" y="196" font-size="12.5" fill="#7dd3fc" font-family="'SF Mono',Consolas,monospace">Promise.all([submit(), submit(), submit()])</text>
    <text x="38" y="222" font-size="12.5" fill="#34d399" font-family="'SF Mono',Consolas,monospace">// 任务只执行 1 次,其余返回 undefined</text>
    <text x="38" y="244" font-size="12.5" fill="#fbbf24" font-family="'SF Mono',Consolas,monospace">// 锁在 finally 释放:报错也不锁死</text>
    <rect x="24" y="278" width="524" height="52" rx="8" fill="#111a30" stroke="#1e2a44"/>
    <rect x="24" y="278" width="4" height="52" rx="2" fill="#f472b6"/>
    <text x="40" y="300" font-size="13.5" fill="#e2e8f0">❌ 裸 onClick:五连点 = 五张重复单;</text>
    <text x="40" y="320" font-size="13.5" fill="#94a3b8">✅ 提交锁:在途期间再点直接忽略。</text>
  </g>

  <g transform="translate(608,462)">
    <rect width="572" height="361" rx="14" fill="#0e1730" stroke="#223055"/>
    <polygon points="420,0 480,0 150,361 90,361" fill="#f97316" opacity="0.04"/>
    <rect x="14" y="13" width="26" height="20" rx="6" fill="#f97316"/>
    <text x="27" y="28" text-anchor="middle" font-size="14" font-weight="bold" fill="#0b1220">4</text>
    <text x="50" y="29" font-size="17" font-weight="bold" fill="#e2e8f0">结案：片段沉淀三原则</text>
    <g transform="translate(52,110)">
      <rect x="-19" y="14" width="38" height="22" rx="9" fill="#cbd5e1"/>
      <circle cx="0" cy="-2" r="16" fill="#ffd9b3"/>
      <path d="M-16,-2 a16,16 0 0 1 32,0 q-3,-12 -16,-12 q-13,0 -16,12 z" fill="#e2e8f0"/>
      <circle cx="-5" cy="0" r="4" fill="none" stroke="#94a3b8" stroke-width="1.4"/>
      <circle cx="5" cy="0" r="4" fill="none" stroke="#94a3b8" stroke-width="1.4"/>
      <path d="M-1,0 L1,0" stroke="#94a3b8" stroke-width="1.4"/>
      <circle cx="-5" cy="0" r="1.4" fill="#0b1220"/>
      <circle cx="5" cy="0" r="1.4" fill="#0b1220"/>
      <path d="M-8,5 q8,7 16,0 q-2,7 -8,7 q-6,0 -8,-7 z" fill="#e2e8f0"/>
    </g>
    <polygon points="88,100 74,106 88,112" fill="#f8fafc"/>
    <rect x="88" y="82" width="216" height="52" rx="10" fill="#f8fafc"/>
    <text x="102" y="104" font-size="15" fill="#0b1220">好片段三要素:纯函数、</text>
    <text x="102" y="126" font-size="15" fill="#0b1220">框架无关、边界齐全。</text>
    <rect x="24" y="154" width="96" height="26" rx="13" fill="#f97316"/>
    <text x="72" y="172" text-anchor="middle" font-size="13" font-weight="bold" fill="#0b1220">⚠ 坑点</text>
    <rect x="32" y="200" width="9" height="9" rx="2" fill="#f97316"/>
    <text x="52" y="209" font-size="14" fill="#e2e8f0">required 误杀 0 / false:只判 null 与空串</text>
    <rect x="32" y="228" width="9" height="9" rx="2" fill="#f97316"/>
    <text x="52" y="237" font-size="14" fill="#e2e8f0">提交锁在 finally 释放,报错不锁死按钮</text>
    <rect x="32" y="256" width="9" height="9" rx="2" fill="#f97316"/>
    <text x="52" y="265" font-size="14" fill="#e2e8f0">倒计时必须返回 cancel,卸载即清理</text>
    <rect x="24" y="290" width="524" height="50" rx="8" fill="#111a30" stroke="#1e2a44"/>
    <rect x="24" y="290" width="4" height="50" rx="2" fill="#22d3ee"/>
    <text x="40" y="311" font-size="13.5" font-weight="bold" fill="#22d3ee">码叔总结</text>
    <text x="40" y="331" font-size="13.5" fill="#e2e8f0">把重复百遍的逻辑,沉淀成复制即可用的纯函数。</text>
  </g>

  <text x="1180" y="832" text-anchor="end" font-size="11" fill="#475569">NEON INK · frontend-advanced-guide · EP.19</text>
</svg>
