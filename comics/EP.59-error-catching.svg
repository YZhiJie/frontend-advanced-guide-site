<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 840" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif">
  <defs>
    <linearGradient id="bg59" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#101a33"/>
    </linearGradient>
    <linearGradient id="titleGrad59" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="840" fill="url(#bg59)"/>
  <polygon points="980,0 1060,0 760,840 680,840" fill="#22d3ee" opacity="0.04"/>
  <polygon points="150,0 220,0 1040,840 970,840" fill="#f472b6" opacity="0.03"/>

  <rect x="20" y="14" width="92" height="36" rx="9" fill="#7C3AED"/>
  <text x="66" y="38" text-anchor="middle" font-size="18" font-weight="bold" fill="#ffffff">EP.59</text>
  <text x="126" y="40" font-size="26" font-weight="bold" fill="url(#titleGrad59)">错误捕获四张网</text>
  <text x="1180" y="38" text-anchor="end" font-size="13" fill="#64748b">进阶漫画剧场 · 霓虹墨 NEON INK</text>
  <rect x="20" y="62" width="1160" height="2" rx="1" fill="url(#titleGrad59)" opacity="0.6"/>

  <g transform="translate(20,84)">
    <rect width="572" height="361" rx="14" fill="#0e1730" stroke="#223055"/>
    <polygon points="380,0 450,0 120,361 50,361" fill="#22d3ee" opacity="0.04"/>
    <rect x="14" y="13" width="26" height="20" rx="6" fill="#22d3ee"/>
    <text x="27" y="28" text-anchor="middle" font-size="14" font-weight="bold" fill="#0b1220">1</text>
    <text x="50" y="29" font-size="17" font-weight="bold" fill="#e2e8f0">困境：try/catch 漏网</text>
    <g transform="translate(52,120)">
      <rect x="-19" y="14" width="38" height="22" rx="9" fill="#1d4ed8"/>
      <path d="M-5,18 L5,18 L3.5,27 L0,29 L-3.5,27 Z" fill="#f97316"/>
      <circle cx="0" cy="-2" r="16" fill="#ffd9b3"/>
      <path d="M-16,-2 L-11,-13 L-6,-4 L0,-14 L6,-4 L11,-13 L16,-2 Q0,-11 -16,-2 Z" fill="#f97316"/>
      <circle cx="-5" cy="0" r="1.7" fill="#0b1220"/>
      <circle cx="5" cy="0" r="1.7" fill="#0b1220"/>
      <path d="M-3,5 q3,3 6,0" stroke="#0b1220" stroke-width="1.3" fill="none"/>
    </g>
    <polygon points="88,110 74,116 88,122" fill="#f8fafc"/>
    <rect x="88" y="86" width="440" height="58" rx="10" fill="#f8fafc"/>
    <text x="102" y="110" font-size="15" fill="#0b1220">明明套了 try/catch，</text>
    <text x="102" y="132" font-size="15" fill="#0b1220">线上报错还是漏了一屏！</text>
    <rect x="24" y="162" width="524" height="110" rx="8" fill="#0a0f1c" stroke="#22d3ee" stroke-opacity="0.35"/>
    <text x="38" y="184" font-size="12.5" fill="#fbbf24" font-family="'SF Mono',Consolas,monospace">// 这层 try 根本罩不住下面两行</text>
    <text x="38" y="206" font-size="12.5" fill="#7dd3fc" font-family="'SF Mono',Consolas,monospace">try {</text>
    <text x="38" y="228" font-size="12.5" fill="#f472b6" font-family="'SF Mono',Consolas,monospace">  setTimeout(() => { throw e }, 0)</text>
    <text x="38" y="250" font-size="12.5" fill="#f472b6" font-family="'SF Mono',Consolas,monospace">  fetch('/api')  // reject 也抓不到</text>
    <rect x="24" y="286" width="524" height="60" rx="8" fill="#111a30" stroke="#1e2a44"/>
    <rect x="24" y="286" width="4" height="60" rx="2" fill="#f97316"/>
    <text x="40" y="310" font-size="13.5" fill="#e2e8f0">回调执行时外层 try 早已出栈</text>
    <text x="40" y="330" font-size="13.5" fill="#f97316">异步回调与 Promise 各有自己的通道</text>
  </g>

  <g transform="translate(608,84)">
    <rect width="572" height="361" rx="14" fill="#0e1730" stroke="#223055"/>
    <polygon points="420,0 480,0 150,361 90,361" fill="#a78bfa" opacity="0.04"/>
    <rect x="14" y="13" width="26" height="20" rx="6" fill="#a78bfa"/>
    <text x="27" y="28" text-anchor="middle" font-size="14" font-weight="bold" fill="#0b1220">2</text>
    <text x="50" y="29" font-size="17" font-weight="bold" fill="#e2e8f0">揭秘：四类错误四张网</text>
    <g transform="translate(52,120)">
      <rect x="-19" y="14" width="38" height="22" rx="9" fill="#cbd5e1"/>
      <circle cx="0" cy="-2" r="16" fill="#ffd9b3"/>
      <path d="M-16,-2 a16,16 0 0 1 32,0 q-3,-12 -16,-12 q-13,0 -16,12 z" fill="#e2e8f0"/>
      <circle cx="-5" cy="0" r="4" fill="none" stroke="#94a3b8" stroke-width="1.4"/>
      <circle cx="5" cy="0" r="4" fill="none" stroke="#94a3b8" stroke-width="1.4"/>
      <path d="M-1,0 L1,0" stroke="#94a3b8" stroke-width="1.4"/>
      <circle cx="-5" cy="0" r="1.4" fill="#0b1220"/>
      <circle cx="5" cy="0" r="1.4" fill="#0b1220"/>
      <path d="M-8,5 q8,7 16,0 q-2,7 -8,7 q-6,0 -8,-7 z" fill="#e2e8f0"/>
    </g>
    <polygon points="88,110 74,116 88,122" fill="#f8fafc"/>
    <rect x="88" y="86" width="440" height="58" rx="10" fill="#f8fafc"/>
    <text x="102" y="110" font-size="15" fill="#0b1220">错误不走同一条通道，</text>
    <text x="102" y="132" font-size="15" fill="#0b1220">先分类，再分别下网。</text>
    <rect x="24" y="162" width="524" height="180" rx="8" fill="#0a0f1c" stroke="#a78bfa" stroke-opacity="0.35"/>
    <text x="38" y="184" font-size="12.5" fill="#22d3ee" font-family="'SF Mono',Consolas,monospace">try/catch          → 同步同栈</text>
    <text x="38" y="206" font-size="12.5" fill="#f472b6" font-family="'SF Mono',Consolas,monospace">error(捕获阶段)     → JS + 资源 404</text>
    <text x="38" y="228" font-size="12.5" fill="#f472b6" font-family="'SF Mono',Consolas,monospace">unhandledrejection → 没人接的拒绝</text>
    <text x="38" y="250" font-size="12.5" fill="#f472b6" font-family="'SF Mono',Consolas,monospace">ErrorBoundary      → 框架渲染期</text>
    <text x="38" y="278" font-size="12.5" fill="#34d399" font-family="'SF Mono',Consolas,monospace">// executor 同步 throw 是特例:</text>
    <text x="38" y="298" font-size="12.5" fill="#34d399" font-family="'SF Mono',Consolas,monospace">// 自动转成 rejection</text>
    <text x="38" y="324" font-size="12" fill="#94a3b8" font-family="'SF Mono',Consolas,monospace">try/catch 只管「同步同栈」那一格</text>
  </g>

  <g transform="translate(20,462)">
    <rect width="572" height="361" rx="14" fill="#0e1730" stroke="#223055"/>
    <polygon points="380,0 450,0 120,361 50,361" fill="#f472b6" opacity="0.04"/>
    <rect x="14" y="13" width="26" height="20" rx="6" fill="#f472b6"/>
    <text x="27" y="28" text-anchor="middle" font-size="14" font-weight="bold" fill="#0b1220">3</text>
    <text x="50" y="29" font-size="17" font-weight="bold" fill="#e2e8f0">实证：all 短路 ≠ 取消</text>
    <g transform="translate(52,110)">
      <rect x="-19" y="14" width="38" height="22" rx="9" fill="#a78bfa"/>
      <circle cx="0" cy="-2" r="16" fill="#ffd9b3"/>
      <path d="M-16,-4 Q-8,-16 0,-4 Q8,-16 16,-4 Q8,-8 0,-4 Q-8,-8 -16,-4 Z" fill="#22d3ee"/>
      <path d="M0,-16 L0,-4" stroke="#22d3ee" stroke-width="3"/>
      <circle cx="-5" cy="0" r="1.7" fill="#0b1220"/>
      <circle cx="5" cy="0" r="1.7" fill="#0b1220"/>
      <path d="M-3,5 q3,3 6,0" stroke="#0b1220" stroke-width="1.3" fill="none"/>
      <rect x="-14" y="12" width="28" height="18" rx="4" fill="#7C3AED"/>
      <text x="0" y="25" text-anchor="middle" font-size="10" font-weight="bold" fill="#fff">{"}"}</text>
    </g>
    <polygon points="88,100 74,106 88,112" fill="#f8fafc"/>
    <rect x="88" y="76" width="440" height="50" rx="10" fill="#f8fafc"/>
    <text x="102" y="98" font-size="15" fill="#0b1220">Promise.all 一个挂了，</text>
    <text x="102" y="118" font-size="15" fill="#0b1220">其余请求还在天上飞！</text>
    <rect x="24" y="142" width="524" height="190" rx="8" fill="#0a0f1c" stroke="#f472b6" stroke-opacity="0.35"/>
    <text x="38" y="164" font-size="12.5" fill="#22d3ee" font-family="'SF Mono',Consolas,monospace">all([快失败 10ms, 慢成功 50ms])</text>
    <text x="38" y="184" font-size="12.5" fill="#f472b6" font-family="'SF Mono',Consolas,monospace">// 10ms 整体失败,但慢成功照跑</text>
    <text x="38" y="204" font-size="12.5" fill="#f472b6" font-family="'SF Mono',Consolas,monospace">// 60ms 后:两个任务都跑完了</text>
    <text x="38" y="230" font-size="12.5" fill="#7dd3fc" font-family="'SF Mono',Consolas,monospace">allSettled → 全部落定再记账</text>
    <text x="38" y="250" font-size="12.5" fill="#7dd3fc" font-family="'SF Mono',Consolas,monospace">race → 超时控制 any → 多源择优</text>
    <text x="38" y="276" font-size="12.5" fill="#34d399" font-family="'SF Mono',Consolas,monospace">// 多步流程失败:逆序补偿(Saga)</text>
    <text x="38" y="296" font-size="12.5" fill="#34d399" font-family="'SF Mono',Consolas,monospace">// 回补库存 → 撤销订单</text>
    <text x="38" y="322" font-size="12" fill="#94a3b8" font-family="'SF Mono',Consolas,monospace">想真正取消,得配 AbortController</text>
  </g>

  <g transform="translate(608,462)">
    <rect width="572" height="361" rx="14" fill="#0e1730" stroke="#223055"/>
    <polygon points="420,0 480,0 150,361 90,361" fill="#f97316" opacity="0.04"/>
    <rect x="14" y="13" width="26" height="20" rx="6" fill="#f97316"/>
    <text x="27" y="28" text-anchor="middle" font-size="14" font-weight="bold" fill="#0b1220">4</text>
    <text x="50" y="29" font-size="17" font-weight="bold" fill="#e2e8f0">结案：捕获只是上半场</text>
    <g transform="translate(52,110)">
      <rect x="-19" y="14" width="38" height="22" rx="9" fill="#cbd5e1"/>
      <circle cx="0" cy="-2" r="16" fill="#ffd9b3"/>
      <path d="M-16,-2 a16,16 0 0 1 32,0 q-3,-12 -16,-12 q-13,0 -16,12 z" fill="#e2e8f0"/>
      <circle cx="-5" cy="0" r="4" fill="none" stroke="#94a3b8" stroke-width="1.4"/>
      <circle cx="5" cy="0" r="4" fill="none" stroke="#94a3b8" stroke-width="1.4"/>
      <path d="M-1,0 L1,0" stroke="#94a3b8" stroke-width="1.4"/>
      <circle cx="-5" cy="0" r="1.4" fill="#0b1220"/>
      <circle cx="5" cy="0" r="1.4" fill="#0b1220"/>
      <path d="M-8,5 q8,7 16,0 q-2,7 -8,7 q-6,0 -8,-7 z" fill="#e2e8f0"/>
    </g>
    <polygon points="88,100 74,106 88,112" fill="#f8fafc"/>
    <rect x="88" y="76" width="440" height="50" rx="10" fill="#f8fafc"/>
    <text x="102" y="98" font-size="15" fill="#0b1220">抓到只是开始，</text>
    <text x="102" y="118" font-size="15" fill="#0b1220">归一化分级后才算治理。</text>
    <rect x="24" y="142" width="524" height="86" rx="8" fill="#0a0f1c" stroke="#f97316" stroke-opacity="0.35"/>
    <text x="38" y="166" font-size="12.5" fill="#22d3ee" font-family="'SF Mono',Consolas,monospace">normalizeError → 统一 AppError</text>
    <text x="38" y="188" font-size="12.5" fill="#f472b6" font-family="'SF Mono',Consolas,monospace">分级:fatal 立即报,error 批量攒</text>
    <text x="38" y="210" font-size="12.5" fill="#34d399" font-family="'SF Mono',Consolas,monospace">指纹聚合:同一故障 count 累加</text>
    <rect x="24" y="238" width="524" height="58" rx="8" fill="#0a0f1c" stroke="#f97316" stroke-opacity="0.35"/>
    <rect x="24" y="238" width="4" height="58" rx="2" fill="#f97316"/>
    <text x="38" y="262" font-size="13.5" font-weight="bold" fill="#f97316">⚠ 坑点：sourcemap 只传监控平台</text>
    <text x="38" y="282" font-size="12.5" fill="#e2e8f0">部署到公网等于源码白送</text>
    <rect x="24" y="306" width="524" height="46" rx="8" fill="#111a30" stroke="#34d399" stroke-opacity="0.3"/>
    <text x="40" y="328" font-size="13" font-weight="bold" fill="#34d399">✓ 一条原则</text>
    <text x="40" y="346" font-size="12.5" fill="#e2e8f0">局部能消化就别冒泡，漏网的交给全局</text>
  </g>
</svg>
