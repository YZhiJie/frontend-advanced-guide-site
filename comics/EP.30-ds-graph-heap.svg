<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 840" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#101a33"/>
    </linearGradient>
    <linearGradient id="titleGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="840" fill="url(#bg)"/>
  <polygon points="980,0 1060,0 760,840 680,840" fill="#22d3ee" opacity="0.04"/>
  <polygon points="150,0 220,0 1040,840 970,840" fill="#a78bfa" opacity="0.03"/>

  <rect x="20" y="14" width="92" height="36" rx="9" fill="#7C3AED"/>
  <text x="66" y="38" text-anchor="middle" font-size="18" font-weight="bold" fill="#ffffff">EP.30</text>
  <text x="126" y="40" font-size="26" font-weight="bold" fill="url(#titleGrad)">图与堆：依赖的天网</text>
  <text x="1180" y="38" text-anchor="end" font-size="13" fill="#64748b">进阶漫画剧场 · 霓虹墨 NEON INK</text>
  <rect x="20" y="62" width="1160" height="2" rx="1" fill="url(#titleGrad)" opacity="0.6"/>

  <g transform="translate(20,84)">
    <rect width="572" height="361" rx="14" fill="#0e1730" stroke="#223055"/>
    <polygon points="380,0 450,0 120,361 50,361" fill="#22d3ee" opacity="0.04"/>
    <rect x="14" y="13" width="26" height="20" rx="6" fill="#22d3ee"/>
    <text x="27" y="28" text-anchor="middle" font-size="14" font-weight="bold" fill="#0b1220">1</text>
    <text x="50" y="29" font-size="17" font-weight="bold" fill="#e2e8f0">困境：循环依赖</text>
    <g transform="translate(52,110)">
      <rect x="-19" y="14" width="38" height="22" rx="9" fill="#1d4ed8"/>
      <path d="M-5,18 L5,18 L3.5,27 L0,29 L-3.5,27 Z" fill="#f97316"/>
      <circle cx="0" cy="-2" r="16" fill="#ffd9b3"/>
      <path d="M-16,-2 L-11,-13 L-6,-4 L0,-14 L6,-4 L11,-13 L16,-2 Q0,-11 -16,-2 Z" fill="#f97316"/>
      <circle cx="-5" cy="0" r="1.7" fill="#0b1220"/>
      <circle cx="5" cy="0" r="1.7" fill="#0b1220"/>
      <path d="M-3,5 q3,3 6,0" stroke="#0b1220" stroke-width="1.3" fill="none"/>
    </g>
    <polygon points="88,100 74,106 88,112" fill="#f8fafc"/>
    <rect x="88" y="82" width="380" height="52" rx="10" fill="#f8fafc"/>
    <text x="102" y="104" font-size="15" fill="#0b1220">A 依赖 B，B 又依赖 A，</text>
    <text x="102" y="126" font-size="15" fill="#0b1220">打包直接死循环！</text>
    <rect x="24" y="152" width="524" height="118" rx="8" fill="#0a0f1c" stroke="#22d3ee" stroke-opacity="0.35"/>
    <text x="38" y="174" font-size="12.5" fill="#fbbf24" font-family="'SF Mono',Consolas,monospace">// 手写构建工具 bundle()</text>
    <text x="38" y="192" font-size="12.5" fill="#7dd3fc" font-family="'SF Mono',Consolas,monospace">a.js: import './b.js'</text>
    <text x="38" y="210" font-size="12.5" fill="#7dd3fc" font-family="'SF Mono',Consolas,monospace">b.js: import './a.js' // ← 环</text>
    <text x="38" y="228" font-size="12.5" fill="#f472b6" font-family="'SF Mono',Consolas,monospace">RangeError: call stack overflow</text>
    <text x="38" y="246" font-size="12.5" fill="#f472b6" font-family="'SF Mono',Consolas,monospace">// 顺序错乱 + 循环依赖死循环</text>
    <rect x="24" y="278" width="524" height="52" rx="8" fill="#111a30" stroke="#1e2a44"/>
    <rect x="24" y="278" width="4" height="52" rx="2" fill="#22d3ee"/>
    <text x="40" y="300" font-size="13.5" fill="#e2e8f0">模块顺序全靠运气，</text>
    <text x="40" y="320" font-size="13.5" fill="#94a3b8">没有依赖图寸步难行。</text>
  </g>

  <g transform="translate(608,84)">
    <rect width="572" height="361" rx="14" fill="#0e1730" stroke="#223055"/>
    <polygon points="420,0 480,0 150,361 90,361" fill="#a78bfa" opacity="0.04"/>
    <rect x="14" y="13" width="26" height="20" rx="6" fill="#a78bfa"/>
    <text x="27" y="28" text-anchor="middle" font-size="14" font-weight="bold" fill="#0b1220">2</text>
    <text x="50" y="29" font-size="17" font-weight="bold" fill="#e2e8f0">揭秘：图与邻接表</text>
    <g transform="translate(52,110)">
      <rect x="-19" y="14" width="38" height="22" rx="9" fill="#cbd5e1"/>
      <circle cx="0" cy="-2" r="16" fill="#ffd9b3"/>
      <path d="M-16,-2 a16,16 0 0 1 32,0 q-3,-12 -16,-12 q-13,0 -16,12 z" fill="#e2e8f0"/>
      <circle cx="-5" cy="0" r="4" fill="none" stroke="#94a3b8" stroke-width="1.4"/>
      <circle cx="5" cy="0" r="4" fill="none" stroke="#94a3b8" stroke-width="1.4"/>
      <path d="M-1,0 L1,0" stroke="#94a3b8" stroke-width="1.4"/>
      <circle cx="-5" cy="0" r="1.4" fill="#0b1220"/>
      <circle cx="5" cy="0" r="1.4" fill="#0b1220"/>
      <path d="M-8,5 q8,7 16,0 q-2,7 -8,7 q-6,0 -8,-7 z" fill="#e2e8f0"/>
    </g>
    <polygon points="88,100 74,106 88,112" fill="#f8fafc"/>
    <rect x="88" y="82" width="380" height="52" rx="10" fill="#f8fafc"/>
    <text x="102" y="104" font-size="15" fill="#0b1220">图 = 顶点 + 边，</text>
    <text x="102" y="126" font-size="15" fill="#0b1220">前端用邻接表存最省。</text>
    <rect x="24" y="152" width="524" height="118" rx="8" fill="#0a0f1c" stroke="#a78bfa" stroke-opacity="0.35"/>
    <text x="38" y="174" font-size="12.5" fill="#7dd3fc" font-family="'SF Mono',Consolas,monospace">const graph = new Map&lt;V, V[]&gt;()</text>
    <text x="38" y="192" font-size="12.5" fill="#7dd3fc" font-family="'SF Mono',Consolas,monospace">function addEdge(v, w) {</text>
    <text x="38" y="210" font-size="12.5" fill="#7dd3fc" font-family="'SF Mono',Consolas,monospace">  graph.get(v).push(w)</text>
    <text x="38" y="228" font-size="12.5" fill="#7dd3fc" font-family="'SF Mono',Consolas,monospace">}</text>
    <text x="38" y="246" font-size="12.5" fill="#34d399" font-family="'SF Mono',Consolas,monospace">// 邻接表 O(V+E)，稀疏图首选</text>
    <rect x="24" y="278" width="524" height="52" rx="8" fill="#111a30" stroke="#1e2a44"/>
    <rect x="24" y="278" width="4" height="52" rx="2" fill="#a78bfa"/>
    <text x="40" y="300" font-size="13.5" fill="#e2e8f0">邻接矩阵 O(V²) 太浪费，</text>
    <text x="40" y="320" font-size="13.5" fill="#94a3b8">依赖图稀疏，选邻接表。</text>
  </g>

  <g transform="translate(20,462)">
    <rect width="572" height="361" rx="14" fill="#0e1730" stroke="#223055"/>
    <polygon points="380,0 450,0 120,361 50,361" fill="#f472b6" opacity="0.04"/>
    <rect x="14" y="13" width="26" height="20" rx="6" fill="#f472b6"/>
    <text x="27" y="28" text-anchor="middle" font-size="14" font-weight="bold" fill="#0b1220">3</text>
    <text x="50" y="29" font-size="17" font-weight="bold" fill="#e2e8f0">实证：拓扑排序走查</text>
    <g transform="translate(52,110)">
      <rect x="-19" y="14" width="38" height="22" rx="9" fill="#7C3AED"/>
      <circle cx="0" cy="-2" r="16" fill="#ffd9b3"/>
      <path d="M-16,-2 a16,16 0 0 1 32,0 q-2,-11 -16,-11 q-14,0 -16,11 z" fill="#22d3ee"/>
      <circle cx="15" cy="-11" r="6.5" fill="#22d3ee"/>
      <rect x="12" y="-9" width="6" height="4" rx="2" fill="#7C3AED"/>
      <circle cx="-5" cy="0" r="1.7" fill="#0b1220"/>
      <circle cx="5" cy="0" r="1.7" fill="#0b1220"/>
      <path d="M-3,5 q3,3 6,0" stroke="#0b1220" stroke-width="1.3" fill="none"/>
    </g>
    <polygon points="88,100 74,106 88,112" fill="#f8fafc"/>
    <rect x="88" y="82" width="380" height="52" rx="10" fill="#f8fafc"/>
    <text x="102" y="104" font-size="15" fill="#0b1220">Kahn：入度为零先出队，</text>
    <text x="102" y="126" font-size="15" fill="#0b1220">边删光，全归零。</text>
    <circle cx="70" cy="180" r="17" fill="#0a0f1c" stroke="#22d3ee" stroke-width="1.5"/>
    <text x="70" y="185" text-anchor="middle" font-size="14" font-weight="bold" fill="#22d3ee">A</text>
    <line x1="87" y1="180" x2="148" y2="180" stroke="#64748b" stroke-width="1.5"/>
    <polygon points="150,180 140,175 140,185" fill="#64748b"/>
    <circle cx="170" cy="180" r="17" fill="#0a0f1c" stroke="#a78bfa" stroke-width="1.5"/>
    <text x="170" y="185" text-anchor="middle" font-size="14" font-weight="bold" fill="#a78bfa">B</text>
    <line x1="187" y1="180" x2="248" y2="180" stroke="#64748b" stroke-width="1.5"/>
    <polygon points="250,180 240,175 240,185" fill="#64748b"/>
    <circle cx="270" cy="180" r="17" fill="#0a0f1c" stroke="#f472b6" stroke-width="1.5"/>
    <text x="270" y="185" text-anchor="middle" font-size="14" font-weight="bold" fill="#f472b6">C</text>
    <rect x="320" y="148" width="224" height="68" rx="8" fill="#0a0f1c" stroke="#f472b6" stroke-opacity="0.35"/>
    <text x="334" y="170" font-size="12.5" fill="#f472b6" font-family="'SF Mono',Consolas,monospace">入度表 indegree</text>
    <text x="334" y="194" font-size="12.5" fill="#7dd3fc" font-family="'SF Mono',Consolas,monospace">A:0  B:1  C:2</text>
    <text x="40" y="248" font-size="13.5" fill="#e2e8f0">① 出队 A：B 的入度归零</text>
    <text x="40" y="274" font-size="13.5" fill="#e2e8f0">② 出队 B：C 的入度归零</text>
    <text x="40" y="300" font-size="13.5" fill="#34d399">③ 出队 C：得到 A → B → C</text>
    <rect x="336" y="318" width="212" height="32" rx="8" fill="#111a30" stroke="#fbbf24" stroke-opacity="0.5"/>
    <text x="350" y="339" font-size="13" fill="#fbbf24">同层抢优先级？→ 大顶堆</text>
  </g>

  <g transform="translate(608,462)">
    <rect width="572" height="361" rx="14" fill="#0e1730" stroke="#223055"/>
    <polygon points="420,0 480,0 150,361 90,361" fill="#f97316" opacity="0.04"/>
    <rect x="14" y="13" width="26" height="20" rx="6" fill="#f97316"/>
    <text x="27" y="28" text-anchor="middle" font-size="14" font-weight="bold" fill="#0b1220">4</text>
    <text x="50" y="29" font-size="17" font-weight="bold" fill="#e2e8f0">结案：堆与优先级</text>
    <g transform="translate(52,110)">
      <rect x="-19" y="14" width="38" height="22" rx="9" fill="#cbd5e1"/>
      <circle cx="0" cy="-2" r="16" fill="#ffd9b3"/>
      <path d="M-16,-2 a16,16 0 0 1 32,0 q-3,-12 -16,-12 q-13,0 -16,12 z" fill="#e2e8f0"/>
      <circle cx="-5" cy="0" r="4" fill="none" stroke="#94a3b8" stroke-width="1.4"/>
      <circle cx="5" cy="0" r="4" fill="none" stroke="#94a3b8" stroke-width="1.4"/>
      <path d="M-1,0 L1,0" stroke="#94a3b8" stroke-width="1.4"/>
      <circle cx="-5" cy="0" r="1.4" fill="#0b1220"/>
      <circle cx="5" cy="0" r="1.4" fill="#0b1220"/>
      <path d="M-8,5 q8,7 16,0 q-2,7 -8,7 q-6,0 -8,-7 z" fill="#e2e8f0"/>
    </g>
    <polygon points="88,100 74,106 88,112" fill="#f8fafc"/>
    <rect x="88" y="82" width="380" height="52" rx="10" fill="#f8fafc"/>
    <text x="102" y="104" font-size="15" fill="#0b1220">堆是优先级队列真身，</text>
    <text x="102" y="126" font-size="15" fill="#0b1220">取最值只要 O(1)。</text>
    <rect x="24" y="140" width="96" height="26" rx="13" fill="#f97316"/>
    <text x="72" y="158" text-anchor="middle" font-size="13" font-weight="bold" fill="#0b1220">⚠ 坑点</text>
    <rect x="32" y="176" width="9" height="9" rx="2" fill="#f97316"/>
    <text x="52" y="185" font-size="14" fill="#e2e8f0">入度不归零 = 有环要报错</text>
    <rect x="32" y="204" width="9" height="9" rx="2" fill="#f97316"/>
    <text x="52" y="213" font-size="14" fill="#e2e8f0">DFS 递归太深，改迭代写法</text>
    <rect x="32" y="232" width="9" height="9" rx="2" fill="#f97316"/>
    <text x="52" y="241" font-size="14" fill="#e2e8f0">堆只保堆顶最值，非全局有序</text>
    <line x1="500" y1="180" x2="462" y2="204" stroke="#64748b" stroke-width="1.5"/>
    <line x1="500" y1="180" x2="538" y2="204" stroke="#64748b" stroke-width="1.5"/>
    <circle cx="500" cy="180" r="14" fill="#0a0f1c" stroke="#f97316" stroke-width="1.5"/>
    <text x="500" y="185" text-anchor="middle" font-size="13" font-weight="bold" fill="#f97316">9</text>
    <circle cx="462" cy="216" r="12" fill="#0a0f1c" stroke="#22d3ee" stroke-width="1.5"/>
    <text x="462" y="221" text-anchor="middle" font-size="12" font-weight="bold" fill="#22d3ee">6</text>
    <circle cx="538" cy="216" r="12" fill="#0a0f1c" stroke="#22d3ee" stroke-width="1.5"/>
    <text x="538" y="221" text-anchor="middle" font-size="12" font-weight="bold" fill="#22d3ee">8</text>
    <text x="500" y="252" text-anchor="middle" font-size="12" fill="#fbbf24" font-family="'SF Mono',Consolas,monospace">siftUp 上浮</text>
    <text x="32" y="282" font-size="13.5" fill="#e2e8f0">应用：模块依赖图 · 任务调度 · TopK 热榜</text>
    <rect x="24" y="300" width="524" height="44" rx="8" fill="#111a30" stroke="#1e2a44"/>
    <rect x="24" y="300" width="4" height="44" rx="2" fill="#22d3ee"/>
    <text x="40" y="318" font-size="13.5" font-weight="bold" fill="#22d3ee">码叔总结</text>
    <text x="40" y="336" font-size="13.5" fill="#e2e8f0">图管先后，堆管轻重缓急。</text>
  </g>

  <text x="1180" y="832" text-anchor="end" font-size="11" fill="#475569">NEON INK · frontend-advanced-guide · EP.30</text>
</svg>
