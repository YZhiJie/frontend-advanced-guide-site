<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 840" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif">
  <defs>
    <linearGradient id="bg57" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#101a33"/>
    </linearGradient>
    <linearGradient id="titleGrad57" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="840" fill="url(#bg57)"/>
  <polygon points="980,0 1060,0 760,840 680,840" fill="#f472b6" opacity="0.04"/>
  <polygon points="150,0 220,0 1040,840 970,840" fill="#34d399" opacity="0.03"/>

  <rect x="20" y="14" width="92" height="36" rx="9" fill="#7C3AED"/>
  <text x="66" y="38" text-anchor="middle" font-size="18" font-weight="bold" fill="#ffffff">EP.57</text>
  <text x="126" y="40" font-size="26" font-weight="bold" fill="url(#titleGrad57)">销毁还是隐藏</text>
  <text x="1180" y="38" text-anchor="end" font-size="13" fill="#64748b">进阶漫画剧场 · 霓虹墨 NEON INK</text>
  <rect x="20" y="62" width="1160" height="2" rx="1" fill="url(#titleGrad57)" opacity="0.6"/>

  
  <g transform="translate(20,84)">
    <rect width="572" height="361" rx="14" fill="#0e1730" stroke="#223055"/>
    <polygon points="380,0 450,0 120,361 50,361" fill="#22d3ee" opacity="0.04"/>
    <rect x="14" y="13" width="26" height="20" rx="6" fill="#22d3ee"/>
    <text x="27" y="28" text-anchor="middle" font-size="14" font-weight="bold" fill="#0b1220">1</text>
    <text x="50" y="29" font-size="17" font-weight="bold" fill="#e2e8f0">困境：隐藏了还能点</text>
    <g transform="translate(52,120)">
      <rect x="-19" y="14" width="38" height="22" rx="9" fill="#1d4ed8"/>
      <path d="M-5,18 L5,18 L3.5,27 L0,29 L-3.5,27 Z" fill="#f97316"/>
      <circle cx="0" cy="-2" r="16" fill="#ffd9b3"/>
      <path d="M-16,-2 L-11,-13 L-6,-4 L0,-14 L6,-4 L11,-13 L16,-2 Q0,-11 -16,-2 Z" fill="#f97316"/>
      <circle cx="-5" cy="0" r="1.7" fill="#0b1220"/>
      <circle cx="5" cy="0" r="1.7" fill="#0b1220"/>
      <path d="M-3,5 q3,3 6,0" stroke="#0b1220" stroke-width="1.3" fill="none"/>
    </g>
    <polygon points="88,110 74,116 88,122" fill="#f8fafc"/>
    <rect x="88" y="86" width="440" height="58" rx="10" fill="#f8fafc"/>
    <text x="102" y="110" font-size="15" fill="#0b1220">按钮用 display:none 藏了，</text>
    <text x="102" y="132" font-size="15" fill="#0b1220">Tab 键居然还能聚焦它？</text>
    <rect x="24" y="162" width="524" height="82" rx="8" fill="#0a0f1c" stroke="#22d3ee" stroke-opacity="0.35"/>
    <text x="38" y="184" font-size="12.5" fill="#fbbf24" font-family="'SF Mono',Consolas,monospace">// 反模式：隐藏而非销毁</text>
    <text x="38" y="206" font-size="12.5" fill="#f472b6" font-family="'SF Mono',Consolas,monospace">el.style.display = 'none'</text>
    <text x="38" y="226" font-size="12.5" fill="#7dd3fc" font-family="'SF Mono',Consolas,monospace">// 元素还在 DOM 里！</text>
    <rect x="24" y="254" width="524" height="88" rx="8" fill="#111a30" stroke="#1e2a44"/>
    <rect x="24" y="254" width="4" height="88" rx="2" fill="#f97316"/>
    <text x="40" y="278" font-size="13.5" fill="#e2e8f0">隐藏 = 视觉不可见，但：</text>
    <text x="40" y="298" font-size="13.5" fill="#94a3b8">① Tab 可聚焦  ② querySelector 可选中</text>
    <text x="40" y="318" font-size="13.5" fill="#f97316">③ 仍可触发点击 → 安全 & a11y 隐患</text>
  </g>

  
  <g transform="translate(608,84)">
    <rect width="572" height="361" rx="14" fill="#0e1730" stroke="#223055"/>
    <polygon points="420,0 480,0 150,361 90,361" fill="#a78bfa" opacity="0.04"/>
    <rect x="14" y="13" width="26" height="20" rx="6" fill="#a78bfa"/>
    <text x="27" y="28" text-anchor="middle" font-size="14" font-weight="bold" fill="#0b1220">2</text>
    <text x="50" y="29" font-size="17" font-weight="bold" fill="#e2e8f0">揭秘：销毁才是正解</text>
    <g transform="translate(52,120)">
      <rect x="-19" y="14" width="38" height="22" rx="9" fill="#cbd5e1"/>
      <circle cx="0" cy="-2" r="16" fill="#ffd9b3"/>
      <path d="M-16,-2 a16,16 0 0 1 32,0 q-3,-12 -16,-12 q-13,0 -16,12 z" fill="#e2e8f0"/>
      <circle cx="-5" cy="0" r="4" fill="none" stroke="#94a3b8" stroke-width="1.4"/>
      <circle cx="5" cy="0" r="4" fill="none" stroke="#94a3b8" stroke-width="1.4"/>
      <path d="M-1,0 L1,0" stroke="#94a3b8" stroke-width="1.4"/>
      <circle cx="-5" cy="0" r="1.4" fill="#0b1220"/>
      <circle cx="5" cy="0" r="1.4" fill="#0b1220"/>
      <path d="M-8,5 q8,7 16,0 q-2,7 -8,7 q-6,0 -8,-7 z" fill="#e2e8f0"/>
    </g>
    <polygon points="88,110 74,116 88,122" fill="#f8fafc"/>
    <rect x="88" y="86" width="440" height="58" rx="10" fill="#f8fafc"/>
    <text x="102" y="110" font-size="15" fill="#0b1220">无权限的元素直接从 DOM 移除，</text>
    <text x="102" y="132" font-size="15" fill="#0b1220">不可聚焦、不可选中。</text>
    <rect x="24" y="162" width="524" height="180" rx="8" fill="#0a0f1c" stroke="#a78bfa" stroke-opacity="0.35"/>
    <text x="38" y="184" font-size="12.5" fill="#22d3ee" font-family="'SF Mono',Consolas,monospace">// 销毁：用注释节点占位</text>
    <text x="38" y="206" font-size="12.5" fill="#f472b6" font-family="'SF Mono',Consolas,monospace">function removeIfNoPermission(el, binding, owned) {</text>
    <text x="38" y="226" font-size="12.5" fill="#7dd3fc" font-family="'SF Mono',Consolas,monospace">  if (!checkPermission(binding, owned)) {</text>
    <text x="38" y="246" font-size="12.5" fill="#34d399" font-family="'SF Mono',Consolas,monospace">    const ph = document.createComment('denied')</text>
    <text x="38" y="266" font-size="12.5" fill="#34d399" font-family="'SF Mono',Consolas,monospace">    el.parentNode.replaceChild(ph, el)</text>
    <text x="38" y="286" font-size="12.5" fill="#7dd3fc" font-family="'SF Mono',Consolas,monospace">  }</text>
    <text x="38" y="306" font-size="12.5" fill="#f472b6" font-family="'SF Mono',Consolas,monospace">}</text>
    <text x="286" y="330" text-anchor="middle" font-size="12" fill="#fbbf24">注释占位便于调试：审查元素能看到「这里被权限拦截了」</text>
  </g>

  
  <g transform="translate(20,462)">
    <rect width="572" height="361" rx="14" fill="#0e1730" stroke="#223055"/>
    <polygon points="380,0 450,0 120,361 50,361" fill="#f472b6" opacity="0.04"/>
    <rect x="14" y="13" width="26" height="20" rx="6" fill="#f472b6"/>
    <text x="27" y="28" text-anchor="middle" font-size="14" font-weight="bold" fill="#0b1220">3</text>
    <text x="50" y="29" font-size="17" font-weight="bold" fill="#e2e8f0">实证：四种绑定形态</text>
    <g transform="translate(52,110)">
      <rect x="-19" y="14" width="38" height="22" rx="9" fill="#a78bfa"/>
      <circle cx="0" cy="-2" r="16" fill="#ffd9b3"/>
      <path d="M-16,-4 Q-8,-16 0,-4 Q8,-16 16,-4 Q8,-8 0,-4 Q-8,-8 -16,-4 Z" fill="#22d3ee"/>
      <path d="M0,-16 L0,-4" stroke="#22d3ee" stroke-width="3"/>
      <circle cx="-5" cy="0" r="1.7" fill="#0b1220"/>
      <circle cx="5" cy="0" r="1.7" fill="#0b1220"/>
      <path d="M-3,5 q3,3 6,0" stroke="#0b1220" stroke-width="1.3" fill="none"/>
      <rect x="-14" y="12" width="28" height="18" rx="4" fill="#7C3AED"/>
      <text x="0" y="25" text-anchor="middle" font-size="10" font-weight="bold" fill="#fff">{"}"}</text>
    </g>
    <polygon points="88,100 74,106 88,112" fill="#f8fafc"/>
    <rect x="88" y="76" width="440" height="50" rx="10" fill="#f8fafc"/>
    <text x="102" y="98" font-size="15" fill="#0b1220">v-permission 支持四种写法，</text>
    <text x="102" y="118" font-size="15" fill="#0b1220">判定逻辑只有一份。</text>
    <rect x="24" y="142" width="524" height="198" rx="8" fill="#0a0f1c" stroke="#f472b6" stroke-opacity="0.35"/>
    <text x="38" y="164" font-size="12.5" fill="#22d3ee" font-family="'SF Mono',Consolas,monospace">// 单条权限码</text>
    <text x="38" y="184" font-size="12.5" fill="#f472b6" font-family="'SF Mono',Consolas,monospace">v-permission="'user:edit'"</text>
    <text x="38" y="206" font-size="12.5" fill="#22d3ee" font-family="'SF Mono',Consolas,monospace">// 数组：满足任一</text>
    <text x="38" y="226" font-size="12.5" fill="#f472b6" font-family="'SF Mono',Consolas,monospace">v-permission="['user:edit','user:delete']"</text>
    <text x="38" y="250" font-size="12.5" fill="#22d3ee" font-family="'SF Mono',Consolas,monospace">// 显式 any / all</text>
    <text x="38" y="270" font-size="12.5" fill="#f472b6" font-family="'SF Mono',Consolas,monospace">v-permission="{any:[...]}"  // 任一</text>
    <text x="38" y="290" font-size="12.5" fill="#f472b6" font-family="'SF Mono',Consolas,monospace">v-permission="{all:[...]}"  // 全部</text>
    <text x="38" y="318" font-size="12" fill="#34d399" font-family="'SF Mono',Consolas,monospace">checkPermission 纯函数，按钮/接口/守卫复用</text>
    <text x="38" y="336" font-size="12" fill="#94a3b8" font-family="'SF Mono',Consolas,monospace">不用 MutationObserver 监听 display，一次性销毁</text>
  </g>

  
  <g transform="translate(608,462)">
    <rect width="572" height="361" rx="14" fill="#0e1730" stroke="#223055"/>
    <polygon points="420,0 480,0 150,361 90,361" fill="#f97316" opacity="0.04"/>
    <rect x="14" y="13" width="26" height="20" rx="6" fill="#f97316"/>
    <text x="27" y="28" text-anchor="middle" font-size="14" font-weight="bold" fill="#0b1220">4</text>
    <text x="50" y="29" font-size="17" font-weight="bold" fill="#e2e8f0">结案：前端只是体验层</text>
    <g transform="translate(52,110)">
      <rect x="-19" y="14" width="38" height="22" rx="9" fill="#cbd5e1"/>
      <circle cx="0" cy="-2" r="16" fill="#ffd9b3"/>
      <path d="M-16,-2 a16,16 0 0 1 32,0 q-3,-12 -16,-12 q-13,0 -16,12 z" fill="#e2e8f0"/>
      <circle cx="-5" cy="0" r="4" fill="none" stroke="#94a3b8" stroke-width="1.4"/>
      <circle cx="5" cy="0" r="4" fill="none" stroke="#94a3b8" stroke-width="1.4"/>
      <path d="M-1,0 L1,0" stroke="#94a3b8" stroke-width="1.4"/>
      <circle cx="-5" cy="0" r="1.4" fill="#0b1220"/>
      <circle cx="5" cy="0" r="1.4" fill="#0b1220"/>
      <path d="M-8,5 q8,7 16,0 q-2,7 -8,7 q-6,0 -8,-7 z" fill="#e2e8f0"/>
    </g>
    <polygon points="88,100 74,106 88,112" fill="#f8fafc"/>
    <rect x="88" y="76" width="440" height="50" rx="10" fill="#f8fafc"/>
    <text x="102" y="98" font-size="15" fill="#0b1220">按钮隐藏只是体验优化，</text>
    <text x="102" y="118" font-size="15" fill="#0b1220">真正的安全边界在后端。</text>
    <rect x="24" y="142" width="524" height="70" rx="8" fill="#0a0f1c" stroke="#f97316" stroke-opacity="0.35"/>
    <rect x="24" y="142" width="4" height="70" rx="2" fill="#f97316"/>
    <text x="38" y="166" font-size="13.5" font-weight="bold" fill="#f97316">⚠ 坑点：只靠前端按钮控制</text>
    <text x="38" y="186" font-size="12.5" fill="#e2e8f0">攻击者可直接调接口、改 DOM、绕过按钮</text>
    <text x="38" y="204" font-size="12.5" fill="#94a3b8">接口层必须独立校验权限码，返回 403</text>
    <rect x="24" y="224" width="524" height="118" rx="8" fill="#111a30" stroke="#34d399" stroke-opacity="0.3"/>
    <text x="40" y="248" font-size="13.5" font-weight="bold" fill="#34d399">✓ 框架适配</text>
    <text x="40" y="270" font-size="12.5" fill="#e2e8f0">Vue：app.directive('permission', { mounted })</text>
    <text x="40" y="290" font-size="12.5" fill="#e2e8f0">React：usePermission(code) + 条件渲染</text>
    <text x="40" y="310" font-size="12.5" fill="#e2e8f0">判定逻辑都调 checkPermission 纯函数</text>
    <text x="40" y="332" font-size="12" fill="#64748b">码叔：前端按钮是门帘，后端接口才是门锁。</text>
  </g>
</svg>
