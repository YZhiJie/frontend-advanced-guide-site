<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 840" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1220"/><stop offset="1" stop-color="#101a33"/></linearGradient>
    <linearGradient id="titleGrad" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#22d3ee"/><stop offset="1" stop-color="#a78bfa"/></linearGradient>
  </defs>
  <rect width="1200" height="840" fill="url(#bg)"/>
  <polygon points="980,0 1060,0 760,840 680,840" fill="#22d3ee" opacity="0.04"/>

  <rect x="20" y="14" width="92" height="36" rx="9" fill="#7C3AED"/>
  <text x="66" y="38" text-anchor="middle" font-size="18" font-weight="bold" fill="#fff">EP.72</text>
  <text x="126" y="40" font-size="26" font-weight="bold" fill="url(#titleGrad)">巨石应用的拆分术</text>
  <text x="1180" y="38" text-anchor="end" font-size="13" fill="#64748b">进阶漫画剧场 · 霓虹墨 NEON INK</text>
  <rect x="20" y="62" width="1160" height="2" rx="1" fill="url(#titleGrad)" opacity="0.6"/>

  <g transform="translate(20,84)">
    <rect width="572" height="361" rx="14" fill="#0e1730" stroke="#223055"/>
    <rect x="14" y="13" width="26" height="20" rx="6" fill="#22d3ee"/>
    <text x="27" y="28" text-anchor="middle" font-size="14" font-weight="bold" fill="#0b1220">1</text>
    <text x="50" y="29" font-size="17" font-weight="bold" fill="#e2e8f0">困境：子应用样式互相污染</text>
    <text x="28" y="130" font-size="14" fill="#94a3b8">订单子应用的 .btn 样式，</text>
    <text x="28" y="152" font-size="14" fill="#f97316">把用户子应用的按钮也染成了红色。</text>
    <rect x="24" y="175" width="524" height="94" rx="8" fill="#0a0f1c" stroke="#f97316" stroke-opacity="0.4"/>
    <text x="38" y="198" font-size="13" fill="#fdba74" font-family="monospace">.btn { color: red }  // 全局污染</text>
    <text x="38" y="220" font-size="13" fill="#fdba74" font-family="monospace">子应用 CSS 没有作用域隔离</text>
    <text x="38" y="242" font-size="13" fill="#fdba74" font-family="monospace">→ 跨应用样式冲突</text>
    <rect x="24" y="295" width="524" height="44" rx="8" fill="#111a30" stroke="#1e2a44"/>
    <text x="40" y="322" font-size="13.5" fill="#e2e8f0">微前端必须做样式隔离。</text>
  </g>

  <g transform="translate(608,84)">
    <rect width="572" height="361" rx="14" fill="#0e1730" stroke="#223055"/>
    <rect x="14" y="13" width="26" height="20" rx="6" fill="#a78bfa"/>
    <text x="27" y="28" text-anchor="middle" font-size="14" font-weight="bold" fill="#0b1220">2</text>
    <text x="50" y="29" font-size="17" font-weight="bold" fill="#e2e8f0">揭秘：JS 沙箱与样式隔离</text>
    <rect x="24" y="50" width="524" height="180" rx="8" fill="#0a0f1c" stroke="#a78bfa" stroke-opacity="0.3"/>
    <text x="38" y="72" font-size="12.5" fill="#7dd3fc" font-family="monospace">JS 沙箱: Proxy 代理 window</text>
    <text x="38" y="92" font-size="12.5" fill="#94a3b8">  写入→私有副本, 不污染主应用</text>
    <text x="38" y="112" font-size="12.5" fill="#94a3b8">  读取→私有优先, 回退真实 window</text>
    <text x="38" y="132" font-size="12.5" fill="#7dd3fc" font-family="monospace">样式隔离:</text>
    <text x="38" y="152" font-size="12.5" fill="#94a3b8">  scoped: 选择器加前缀 #app-order</text>
    <text x="38" y="172" font-size="12.5" fill="#94a3b8">  shadow DOM: 天然隔离</text>
    <text x="38" y="192" font-size="12.5" fill="#94a3b8">  CSS Modules: 构建时哈希类名</text>
    <text x="38" y="214" font-size="12.5" fill="#94a3b8">qiankun 默认 scoped, 严格用 shadow DOM</text>
    <rect x="24" y="250" width="524" height="80" rx="8" fill="#111a30" stroke="#1e2a44"/>
    <text x="40" y="274" font-size="13.5" fill="#e2e8f0">JS 用 Proxy 隔离全局变量，</text>
    <text x="40" y="294" font-size="13.5" fill="#94a3b8">CSS 用 scoped/shadow DOM 隔离样式。</text>
    <text x="40" y="314" font-size="13.5" fill="#94a3b8">子应用之间互不干扰。</text>
  </g>

  <g transform="translate(20,465)">
    <rect width="572" height="361" rx="14" fill="#0e1730" stroke="#223055"/>
    <rect x="14" y="13" width="26" height="20" rx="6" fill="#34d399"/>
    <text x="27" y="28" text-anchor="middle" font-size="14" font-weight="bold" fill="#0b1220">3</text>
    <text x="50" y="29" font-size="17" font-weight="bold" fill="#e2e8f0">实证：三种方案选型</text>
    <text x="28" y="70" font-size="14" fill="#94a3b8">qiankun / Module Federation / wujie，</text>
    <text x="28" y="90" font-size="14" fill="#94a3b8">各有适用场景。</text>
    <rect x="24" y="110" width="524" height="150" rx="8" fill="#0a0f1c" stroke="#34d399" stroke-opacity="0.3"/>
    <text x="38" y="132" font-size="12.5" fill="#7dd3fc" font-family="monospace">qiankun: HTML Entry + Proxy 沙箱</text>
    <text x="38" y="152" font-size="12.5" fill="#94a3b8">  → 多技术栈、存量应用多</text>
    <text x="38" y="172" font-size="12.5" fill="#7dd3fc" font-family="monospace">Module Federation: Webpack 原生</text>
    <text x="38" y="192" font-size="12.5" fill="#94a3b8">  → 同技术栈、新应用、共享依赖</text>
    <text x="38" y="212" font-size="12.5" fill="#7dd3fc" font-family="monospace">wujie: iframe + Web Components</text>
    <text x="38" y="240" font-size="12.5" fill="#94a3b8">  → 老旧应用、需强隔离</text>
    <rect x="24" y="280" width="524" height="56" rx="8" fill="#111a30" stroke="#1e2a44"/>
    <text x="40" y="305" font-size="13.5" fill="#e2e8f0">老旧应用选 wujie，</text>
    <text x="40" y="325" font-size="13.5" fill="#94a3b8">多技术栈选 qiankun，同栈选 MF。</text>
  </g>

  <g transform="translate(608,465)">
    <rect width="572" height="361" rx="14" fill="#0e1730" stroke="#223055"/>
    <rect x="14" y="13" width="26" height="20" rx="6" fill="#f472b6"/>
    <text x="27" y="28" text-anchor="middle" font-size="14" font-weight="bold" fill="#0b1220">4</text>
    <text x="50" y="29" font-size="17" font-weight="bold" fill="#e2e8f0">结案：生命周期与通信</text>
    <text x="28" y="70" font-size="14" fill="#94a3b8">子应用有标准生命周期，</text>
    <text x="28" y="90" font-size="14" fill="#94a3b8">跨应用靠事件总线通信。</text>
    <rect x="24" y="110" width="524" height="130" rx="8" fill="#0a0f1c" stroke="#f472b6" stroke-opacity="0.3"/>
    <text x="38" y="132" font-size="12.5" fill="#7dd3fc" font-family="monospace">生命周期: bootstrap→mount→unmount</text>
    <text x="38" y="152" font-size="12.5" fill="#94a3b8">  路由匹配时 mount，切换时 unmount</text>
    <text x="38" y="172" font-size="12.5" fill="#7dd3fc" font-family="monospace">通信: 全局事件总线</text>
    <text x="38" y="192" font-size="12.5" fill="#94a3b8">  bus.on('user:login', cb)</text>
    <text x="38" y="212" font-size="12.5" fill="#94a3b8">  bus.emit('user:login', data)</text>
    <text x="38" y="226" font-size="12.5" fill="#94a3b8">  事件名加应用前缀防冲突</text>
    <rect x="24" y="260" width="524" height="76" rx="8" fill="#111a30" stroke="#1e2a44"/>
    <rect x="24" y="260" width="4" height="76" rx="2" fill="#f472b6"/>
    <text x="40" y="285" font-size="13.5" fill="#e2e8f0">核心口诀：JS 用 Proxy 沙箱，</text>
    <text x="40" y="305" font-size="13.5" fill="#94a3b8">CSS 用 scoped/shadow DOM，</text>
    <text x="40" y="325" font-size="13.5" fill="#94a3b8">通信用事件总线加前缀。</text>
  </g>
</svg>
