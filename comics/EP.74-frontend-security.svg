<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 840" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1220"/><stop offset="1" stop-color="#101a33"/></linearGradient>
    <linearGradient id="titleGrad" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#22d3ee"/><stop offset="1" stop-color="#a78bfa"/></linearGradient>
  </defs>
  <rect width="1200" height="840" fill="url(#bg)"/>
  <polygon points="980,0 1060,0 760,840 680,840" fill="#22d3ee" opacity="0.04"/>

  <rect x="20" y="14" width="92" height="36" rx="9" fill="#7C3AED"/>
  <text x="66" y="38" text-anchor="middle" font-size="18" font-weight="bold" fill="#fff">EP.74</text>
  <text x="126" y="40" font-size="26" font-weight="bold" fill="url(#titleGrad)">前端的安全防线</text>
  <text x="1180" y="38" text-anchor="end" font-size="13" fill="#64748b">进阶漫画剧场 · 霓虹墨 NEON INK</text>
  <rect x="20" y="62" width="1160" height="2" rx="1" fill="url(#titleGrad)" opacity="0.6"/>

  <g transform="translate(20,84)">
    <rect width="572" height="361" rx="14" fill="#0e1730" stroke="#223055"/>
    <rect x="14" y="13" width="26" height="20" rx="6" fill="#22d3ee"/>
    <text x="27" y="28" text-anchor="middle" font-size="14" font-weight="bold" fill="#0b1220">1</text>
    <text x="50" y="29" font-size="17" font-weight="bold" fill="#e2e8f0">困境：评论区弹出 alert</text>
    <text x="28" y="130" font-size="14" fill="#94a3b8">用户评论里写了 script 标签，</text>
    <text x="28" y="152" font-size="14" fill="#f97316">页面直接弹出 alert——XSS！</text>
    <rect x="24" y="175" width="524" height="94" rx="8" fill="#0a0f1c" stroke="#f97316" stroke-opacity="0.4"/>
    <text x="38" y="198" font-size="13" fill="#fdba74" font-family="monospace">评论: &#x3C;script&#x3E;alert(1)&#x3C;/script&#x3E;</text>
    <text x="38" y="220" font-size="13" fill="#fdba74" font-family="monospace">innerHTML = 用户输入</text>
    <text x="38" y="242" font-size="13" fill="#fdba74" font-family="monospace">→ 脚本执行，XSS 攻击</text>
    <rect x="24" y="295" width="524" height="44" rx="8" fill="#111a30" stroke="#1e2a44"/>
    <text x="40" y="322" font-size="13.5" fill="#e2e8f0">永远不要信任用户输入，输出必须转义。</text>
  </g>

  <g transform="translate(608,84)">
    <rect width="572" height="361" rx="14" fill="#0e1730" stroke="#223055"/>
    <rect x="14" y="13" width="26" height="20" rx="6" fill="#a78bfa"/>
    <text x="27" y="28" text-anchor="middle" font-size="14" font-weight="bold" fill="#0b1220">2</text>
    <text x="50" y="29" font-size="17" font-weight="bold" fill="#e2e8f0">揭秘：XSS + CSRF 防御</text>
    <rect x="24" y="50" width="524" height="180" rx="8" fill="#0a0f1c" stroke="#a78bfa" stroke-opacity="0.3"/>
    <text x="38" y="72" font-size="12.5" fill="#7dd3fc" font-family="monospace">XSS 防御:</text>
    <text x="38" y="92" font-size="12.5" fill="#94a3b8">  escapeHtml 转义 &lt; > " ' &amp;</text>
    <text x="38" y="112" font-size="12.5" fill="#94a3b8">  富文本用 DOMPurify 白名单过滤</text>
    <text x="38" y="132" font-size="12.5" fill="#94a3b8">  Cookie 设 HttpOnly 防偷 token</text>
    <text x="38" y="152" font-size="12.5" fill="#7dd3fc" font-family="monospace">CSRF 防御:</text>
    <text x="38" y="172" font-size="12.5" fill="#94a3b8">  SameSite=Lax/Strict Cookie</text>
    <text x="38" y="192" font-size="12.5" fill="#f472b6" font-family="monospace">  CSRF Token 校验</text>
    <text x="38" y="214" font-size="12.5" fill="#94a3b8">  关键操作二次确认</text>
    <rect x="24" y="250" width="524" height="80" rx="8" fill="#111a30" stroke="#1e2a44"/>
    <text x="40" y="274" font-size="13.5" fill="#e2e8f0">输入过滤 + 输出转义 + CSP 兜底，</text>
    <text x="40" y="294" font-size="13.5" fill="#94a3b8">Token + SameSite 防 CSRF。</text>
    <text x="40" y="314" font-size="13.5" fill="#94a3b8">多层防御，纵深安全。</text>
  </g>

  <g transform="translate(20,465)">
    <rect width="572" height="361" rx="14" fill="#0e1730" stroke="#223055"/>
    <rect x="14" y="13" width="26" height="20" rx="6" fill="#34d399"/>
    <text x="27" y="28" text-anchor="middle" font-size="14" font-weight="bold" fill="#0b1220">3</text>
    <text x="50" y="29" font-size="17" font-weight="bold" fill="#e2e8f0">实证：CSP 与依赖扫描</text>
    <text x="28" y="70" font-size="14" fill="#94a3b8">CSP 从根源限制脚本来源，</text>
    <text x="28" y="90" font-size="14" fill="#94a3b8">npm audit 扫描依赖漏洞。</text>
    <rect x="24" y="110" width="524" height="150" rx="8" fill="#0a0f1c" stroke="#34d399" stroke-opacity="0.3"/>
    <text x="38" y="132" font-size="12.5" fill="#7dd3fc" font-family="monospace">CSP: script-src 'self';</text>
    <text x="38" y="152" font-size="12.5" fill="#94a3b8">  只允许自身域名的脚本执行</text>
    <text x="38" y="172" font-size="12.5" fill="#94a3b8">  不用 'unsafe-inline'</text>
    <text x="38" y="192" font-size="12.5" fill="#7dd3fc" font-family="monospace">npm audit:</text>
    <text x="38" y="212" font-size="12.5" fill="#f472b6" font-family="monospace">  --audit-level=high 阻塞 CI</text>
    <text x="38" y="240" font-size="12.5" fill="#94a3b8">  提交 lockfile 锁定版本</text>
    <rect x="24" y="280" width="524" height="56" rx="8" fill="#111a30" stroke="#1e2a44"/>
    <text x="40" y="305" font-size="13.5" fill="#e2e8f0">CSP 是浏览器层面的安全网，</text>
    <text x="40" y="325" font-size="13.5" fill="#94a3b8">依赖审计防供应链攻击。</text>
  </g>

  <g transform="translate(608,465)">
    <rect width="572" height="361" rx="14" fill="#0e1730" stroke="#223055"/>
    <rect x="14" y="13" width="26" height="20" rx="6" fill="#f472b6"/>
    <text x="27" y="28" text-anchor="middle" font-size="14" font-weight="bold" fill="#0b1220">4</text>
    <text x="50" y="29" font-size="17" font-weight="bold" fill="#e2e8f0">结案：安全响应头</text>
    <text x="28" y="70" font-size="14" fill="#94a3b8">一行 HTTP 头解决一类攻击，</text>
    <text x="28" y="90" font-size="14" fill="#94a3b8">是最便宜的安全加固。</text>
    <rect x="24" y="110" width="524" height="130" rx="8" fill="#0a0f1c" stroke="#f472b6" stroke-opacity="0.3"/>
    <text x="38" y="132" font-size="12.5" fill="#7dd3fc" font-family="monospace">X-Frame-Options: DENY        防点击劫持</text>
    <text x="38" y="152" font-size="12.5" fill="#7dd3fc" font-family="monospace">X-Content-Type-Options: nosniff  防 MIME</text>
    <text x="38" y="172" font-size="12.5" fill="#7dd3fc" font-family="monospace">Strict-Transport-Security     强制 HTTPS</text>
    <text x="38" y="192" font-size="12.5" fill="#7dd3fc" font-family="monospace">Content-Security-Policy       防 XSS</text>
    <text x="38" y="212" font-size="12.5" fill="#94a3b8">  四个头一起配，安全分 100</text>
    <text x="38" y="226" font-size="12.5" fill="#94a3b8">  Nginx add_header 一行搞定</text>
    <rect x="24" y="260" width="524" height="76" rx="8" fill="#111a30" stroke="#1e2a44"/>
    <rect x="24" y="260" width="4" height="76" rx="2" fill="#f472b6"/>
    <text x="40" y="285" font-size="13.5" fill="#e2e8f0">核心口诀：输入过滤输出转义，</text>
    <text x="40" y="305" font-size="13.5" fill="#94a3b8">Token+SameSite 防 CSRF，</text>
    <text x="40" y="325" font-size="13.5" fill="#94a3b8">CSP+安全头做兜底。</text>
  </g>
</svg>
