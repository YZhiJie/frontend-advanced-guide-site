<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 840" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1220"/><stop offset="1" stop-color="#101a33"/></linearGradient>
    <linearGradient id="titleGrad" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#22d3ee"/><stop offset="1" stop-color="#a78bfa"/></linearGradient>
  </defs>
  <rect width="1200" height="840" fill="url(#bg)"/>
  <polygon points="980,0 1060,0 760,840 680,840" fill="#22d3ee" opacity="0.04"/>

  <rect x="20" y="14" width="92" height="36" rx="9" fill="#7C3AED"/>
  <text x="66" y="38" text-anchor="middle" font-size="18" font-weight="bold" fill="#fff">EP.70</text>
  <text x="126" y="40" font-size="26" font-weight="bold" fill="url(#titleGrad)">Docker 让环境不再玄学</text>
  <text x="1180" y="38" text-anchor="end" font-size="13" fill="#64748b">进阶漫画剧场 · 霓虹墨 NEON INK</text>
  <rect x="20" y="62" width="1160" height="2" rx="1" fill="url(#titleGrad)" opacity="0.6"/>

  <g transform="translate(20,84)">
    <rect width="572" height="361" rx="14" fill="#0e1730" stroke="#223055"/>
    <rect x="14" y="13" width="26" height="20" rx="6" fill="#22d3ee"/>
    <text x="27" y="28" text-anchor="middle" font-size="14" font-weight="bold" fill="#0b1220">1</text>
    <text x="50" y="29" font-size="17" font-weight="bold" fill="#e2e8f0">困境：镜像 1G+ 构建慢</text>
    <text x="28" y="130" font-size="14" fill="#94a3b8">Dockerfile 每次构建都重新 npm install，</text>
    <text x="28" y="152" font-size="14" fill="#f97316">构建 10 分钟，镜像 1.2G。</text>
    <rect x="24" y="175" width="524" height="94" rx="8" fill="#0a0f1c" stroke="#f97316" stroke-opacity="0.4"/>
    <text x="38" y="198" font-size="13" fill="#fdba74" font-family="monospace">COPY . .</text>
    <text x="38" y="220" font-size="13" fill="#fdba74" font-family="monospace">RUN npm ci  // 每次都重装</text>
    <text x="38" y="242" font-size="13" fill="#fdba74" font-family="monospace">改一行源码，依赖重装</text>
    <rect x="24" y="295" width="524" height="44" rx="8" fill="#111a30" stroke="#1e2a44"/>
    <text x="40" y="322" font-size="13.5" fill="#e2e8f0">层缓存失效 + 没做多阶段，又慢又大。</text>
  </g>

  <g transform="translate(608,84)">
    <rect width="572" height="361" rx="14" fill="#0e1730" stroke="#223055"/>
    <rect x="14" y="13" width="26" height="20" rx="6" fill="#a78bfa"/>
    <text x="27" y="28" text-anchor="middle" font-size="14" font-weight="bold" fill="#0b1220">2</text>
    <text x="50" y="29" font-size="17" font-weight="bold" fill="#e2e8f0">揭秘：层缓存 + 多阶段</text>
    <rect x="24" y="50" width="524" height="180" rx="8" fill="#0a0f1c" stroke="#a78bfa" stroke-opacity="0.3"/>
    <text x="38" y="72" font-size="12.5" fill="#7dd3fc" font-family="monospace">// 缓存优化：依赖单独一层</text>
    <text x="38" y="92" font-size="12.5" fill="#f472b6" font-family="monospace">COPY package*.json ./</text>
    <text x="38" y="112" font-size="12.5" fill="#f472b6" font-family="monospace">RUN npm ci  // package.json 不变就命中</text>
    <text x="38" y="132" font-size="12.5" fill="#f472b6" font-family="monospace">COPY . .</text>
    <text x="38" y="152" font-size="12.5" fill="#7dd3fc" font-family="monospace">// 多阶段：只保留运行时</text>
    <text x="38" y="172" font-size="12.5" fill="#94a3b8">FROM node AS builder → RUN npm run build</text>
    <text x="38" y="192" font-size="12.5" fill="#94a3b8">FROM nginx:alpine → COPY --from=builder dist</text>
    <text x="38" y="214" font-size="12.5" fill="#94a3b8">350MB → 45MB</text>
    <rect x="24" y="250" width="524" height="80" rx="8" fill="#111a30" stroke="#1e2a44"/>
    <text x="40" y="274" font-size="13.5" fill="#e2e8f0">依赖层前置命中缓存，</text>
    <text x="40" y="294" font-size="13.5" fill="#94a3b8">多阶段只拷产物到轻量镜像。</text>
    <text x="40" y="314" font-size="13.5" fill="#94a3b8">又快又小。</text>
  </g>

  <g transform="translate(20,465)">
    <rect width="572" height="361" rx="14" fill="#0e1730" stroke="#223055"/>
    <rect x="14" y="13" width="26" height="20" rx="6" fill="#34d399"/>
    <text x="27" y="28" text-anchor="middle" font-size="14" font-weight="bold" fill="#0b1220">3</text>
    <text x="50" y="29" font-size="17" font-weight="bold" fill="#e2e8f0">实证：Linux 权限与信号</text>
    <text x="28" y="70" font-size="14" fill="#94a3b8">服务器排障要懂权限和进程信号，</text>
    <text x="28" y="90" font-size="14" fill="#94a3b8">否则 Permission denied 一脸懵。</text>
    <rect x="24" y="110" width="524" height="150" rx="8" fill="#0a0f1c" stroke="#34d399" stroke-opacity="0.3"/>
    <text x="38" y="132" font-size="12.5" fill="#7dd3fc" font-family="monospace">权限: rwx r-x r-- = 754</text>
    <text x="38" y="152" font-size="12.5" fill="#94a3b8">  r=4 w=2 x=1, 三组(owner/group/other)</text>
    <text x="38" y="172" font-size="12.5" fill="#7dd3fc" font-family="monospace">信号: SIGTERM(15) vs SIGKILL(9)</text>
    <text x="38" y="192" font-size="12.5" fill="#94a3b8">  SIGTERM: 可捕获，优雅退出</text>
    <text x="38" y="212" font-size="12.5" fill="#f472b6" font-family="monospace">  SIGKILL: 不可捕获，内核强杀</text>
    <text x="38" y="240" font-size="12.5" fill="#94a3b8">容器编排先发 SIGTERM，超时再 SIGKILL</text>
    <rect x="24" y="280" width="524" height="56" rx="8" fill="#111a30" stroke="#1e2a44"/>
    <text x="40" y="305" font-size="13.5" fill="#e2e8f0">rwx 数字要会算，</text>
    <text x="40" y="325" font-size="13.5" fill="#94a3b8">进程要优雅退出处理 SIGTERM。</text>
  </g>

  <g transform="translate(608,465)">
    <rect width="572" height="361" rx="14" fill="#0e1730" stroke="#223055"/>
    <rect x="14" y="13" width="26" height="20" rx="6" fill="#f472b6"/>
    <text x="27" y="28" text-anchor="middle" font-size="14" font-weight="bold" fill="#0b1220">4</text>
    <text x="50" y="29" font-size="17" font-weight="bold" fill="#e2e8f0">结案：compose 与 CI/CD</text>
    <text x="28" y="70" font-size="14" fill="#94a3b8">docker-compose 编排多服务，</text>
    <text x="28" y="90" font-size="14" fill="#94a3b8">CI/CD 里构建推送镜像。</text>
    <rect x="24" y="110" width="524" height="130" rx="8" fill="#0a0f1c" stroke="#f472b6" stroke-opacity="0.3"/>
    <text x="38" y="132" font-size="12.5" fill="#7dd3fc" font-family="monospace">compose: web + api + db + redis</text>
    <text x="38" y="152" font-size="12.5" fill="#94a3b8">  depends_on 控制启动顺序</text>
    <text x="38" y="172" font-size="12.5" fill="#94a3b8">  healthcheck 保证服务就绪</text>
    <text x="38" y="192" font-size="12.5" fill="#7dd3fc" font-family="monospace">CI/CD: lint→test→build→push→deploy</text>
    <text x="38" y="212" font-size="12.5" fill="#94a3b8">  镜像 tag 用 git sha，不用 latest</text>
    <text x="38" y="226" font-size="12.5" fill="#94a3b8">  --cache-from 复用缓存层</text>
    <rect x="24" y="260" width="524" height="76" rx="8" fill="#111a30" stroke="#1e2a44"/>
    <rect x="24" y="260" width="4" height="76" rx="2" fill="#f472b6"/>
    <text x="40" y="285" font-size="13.5" fill="#e2e8f0">核心口诀：依赖前置命中缓存，</text>
    <text x="40" y="305" font-size="13.5" fill="#94a3b8">多阶段瘦身，compose 编排，</text>
    <text x="40" y="325" font-size="13.5" fill="#94a3b8">tag 用 sha 可追溯。</text>
  </g>
</svg>
