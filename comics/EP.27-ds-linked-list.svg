<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 840" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#101a33"/>
    </linearGradient>
    <linearGradient id="titleGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="840" fill="url(#bg)"/>
  <polygon points="980,0 1060,0 760,840 680,840" fill="#22d3ee" opacity="0.04"/>
  <polygon points="150,0 220,0 1040,840 970,840" fill="#a78bfa" opacity="0.03"/>

  <rect x="20" y="14" width="92" height="36" rx="9" fill="#7C3AED"/>
  <text x="66" y="38" text-anchor="middle" font-size="18" font-weight="bold" fill="#ffffff">EP.27</text>
  <text x="126" y="40" font-size="26" font-weight="bold" fill="url(#titleGrad)">链表：指针的舞蹈</text>
  <text x="1180" y="38" text-anchor="end" font-size="13" fill="#64748b">进阶漫画剧场 · 霓虹墨 NEON INK</text>
  <rect x="20" y="62" width="1160" height="2" rx="1" fill="url(#titleGrad)" opacity="0.6"/>

  <g transform="translate(20,84)">
    <rect width="572" height="361" rx="14" fill="#0e1730" stroke="#223055"/>
    <polygon points="380,0 450,0 120,361 50,361" fill="#22d3ee" opacity="0.04"/>
    <rect x="14" y="13" width="26" height="20" rx="6" fill="#22d3ee"/>
    <text x="27" y="28" text-anchor="middle" font-size="14" font-weight="bold" fill="#0b1220">1</text>
    <text x="50" y="29" font-size="17" font-weight="bold" fill="#e2e8f0">困境：中间插队</text>
    <g transform="translate(52,110)">
      <rect x="-19" y="14" width="38" height="22" rx="9" fill="#7C3AED"/>
      <circle cx="0" cy="-2" r="16" fill="#ffd9b3"/>
      <path d="M-16,-2 a16,16 0 0 1 32,0 q-2,-11 -16,-11 q-14,0 -16,11 z" fill="#22d3ee"/>
      <circle cx="15" cy="-11" r="6.5" fill="#22d3ee"/>
      <rect x="12" y="-9" width="6" height="4" rx="2" fill="#7C3AED"/>
      <circle cx="-5" cy="0" r="1.7" fill="#0b1220"/>
      <circle cx="5" cy="0" r="1.7" fill="#0b1220"/>
      <path d="M-3,5 q3,3 6,0" stroke="#0b1220" stroke-width="1.3" fill="none"/>
    </g>
    <polygon points="88,100 74,106 88,112" fill="#f8fafc"/>
    <rect x="88" y="82" width="380" height="52" rx="10" fill="#f8fafc"/>
    <text x="102" y="104" font-size="15" fill="#0b1220">列表中间插一条，</text>
    <text x="102" y="126" font-size="15" fill="#0b1220">十万行集体搬家掉帧！</text>
    <rect x="24" y="152" width="524" height="94" rx="8" fill="#0a0f1c" stroke="#22d3ee" stroke-opacity="0.35"/>
    <text x="38" y="174" font-size="12.5" fill="#7dd3fc" font-family="'SF Mono',Consolas,monospace">list.splice(50000, 0, item)</text>
    <text x="38" y="192" font-size="12.5" fill="#f472b6" font-family="'SF Mono',Consolas,monospace">// 后面 5 万个元素全体后移</text>
    <text x="38" y="210" font-size="12.5" fill="#fbbf24" font-family="'SF Mono',Consolas,monospace">// 插入 O(n)，动画直接掉帧</text>
    <text x="38" y="228" font-size="12.5" fill="#94a3b8" font-family="'SF Mono',Consolas,monospace">// 连续内存：一人插队全队挪</text>
    <rect x="24" y="278" width="524" height="52" rx="8" fill="#111a30" stroke="#1e2a44"/>
    <rect x="24" y="278" width="4" height="52" rx="2" fill="#22d3ee"/>
    <text x="40" y="300" font-size="13.5" fill="#e2e8f0">数组靠下标连续存储，</text>
    <text x="40" y="320" font-size="13.5" fill="#94a3b8">中间插入就得整体挪位。</text>
  </g>

  <g transform="translate(608,84)">
    <rect width="572" height="361" rx="14" fill="#0e1730" stroke="#223055"/>
    <polygon points="420,0 480,0 150,361 90,361" fill="#a78bfa" opacity="0.04"/>
    <rect x="14" y="13" width="26" height="20" rx="6" fill="#a78bfa"/>
    <text x="27" y="28" text-anchor="middle" font-size="14" font-weight="bold" fill="#0b1220">2</text>
    <text x="50" y="29" font-size="17" font-weight="bold" fill="#e2e8f0">揭秘：节点与指针</text>
    <g transform="translate(52,110)">
      <rect x="-19" y="14" width="38" height="22" rx="9" fill="#cbd5e1"/>
      <circle cx="0" cy="-2" r="16" fill="#ffd9b3"/>
      <path d="M-16,-2 a16,16 0 0 1 32,0 q-3,-12 -16,-12 q-13,0 -16,12 z" fill="#e2e8f0"/>
      <circle cx="-5" cy="0" r="4" fill="none" stroke="#94a3b8" stroke-width="1.4"/>
      <circle cx="5" cy="0" r="4" fill="none" stroke="#94a3b8" stroke-width="1.4"/>
      <path d="M-1,0 L1,0" stroke="#94a3b8" stroke-width="1.4"/>
      <circle cx="-5" cy="0" r="1.4" fill="#0b1220"/>
      <circle cx="5" cy="0" r="1.4" fill="#0b1220"/>
      <path d="M-8,5 q8,7 16,0 q-2,7 -8,7 q-6,0 -8,-7 z" fill="#e2e8f0"/>
    </g>
    <polygon points="88,100 74,106 88,112" fill="#f8fafc"/>
    <rect x="88" y="82" width="380" height="52" rx="10" fill="#f8fafc"/>
    <text x="102" y="104" font-size="15" fill="#0b1220">节点散落各处，</text>
    <text x="102" y="126" font-size="15" fill="#0b1220">插入只改两根指针。</text>
    <rect x="24" y="152" width="524" height="118" rx="8" fill="#0a0f1c" stroke="#a78bfa" stroke-opacity="0.35"/>
    <text x="38" y="174" font-size="12.5" fill="#7dd3fc" font-family="'SF Mono',Consolas,monospace">class Node&lt;T&gt; {</text>
    <text x="38" y="192" font-size="12.5" fill="#7dd3fc" font-family="'SF Mono',Consolas,monospace">  value: T</text>
    <text x="38" y="210" font-size="12.5" fill="#7dd3fc" font-family="'SF Mono',Consolas,monospace">  next: Node&lt;T&gt; | null = null</text>
    <text x="38" y="228" font-size="12.5" fill="#7dd3fc" font-family="'SF Mono',Consolas,monospace">}</text>
    <text x="38" y="246" font-size="12.5" fill="#fbbf24" font-family="'SF Mono',Consolas,monospace">// 插入 O(1)，查找 O(n)</text>
    <rect x="24" y="278" width="524" height="52" rx="8" fill="#111a30" stroke="#1e2a44"/>
    <rect x="24" y="278" width="4" height="52" rx="2" fill="#a78bfa"/>
    <text x="40" y="300" font-size="13.5" fill="#e2e8f0">节点 value + next 串联，</text>
    <text x="40" y="320" font-size="13.5" fill="#94a3b8">改指针即可，不用搬家。</text>
  </g>

  <g transform="translate(20,462)">
    <rect width="572" height="361" rx="14" fill="#0e1730" stroke="#223055"/>
    <polygon points="380,0 450,0 120,361 50,361" fill="#f472b6" opacity="0.04"/>
    <rect x="14" y="13" width="26" height="20" rx="6" fill="#f472b6"/>
    <text x="27" y="28" text-anchor="middle" font-size="14" font-weight="bold" fill="#0b1220">3</text>
    <text x="50" y="29" font-size="17" font-weight="bold" fill="#e2e8f0">实证：三指针反转</text>
    <g transform="translate(52,110)">
      <rect x="-19" y="14" width="38" height="22" rx="9" fill="#7C3AED"/>
      <circle cx="0" cy="-2" r="16" fill="#ffd9b3"/>
      <path d="M-16,-2 a16,16 0 0 1 32,0 q-2,-11 -16,-11 q-14,0 -16,11 z" fill="#22d3ee"/>
      <circle cx="15" cy="-11" r="6.5" fill="#22d3ee"/>
      <rect x="12" y="-9" width="6" height="4" rx="2" fill="#7C3AED"/>
      <circle cx="-5" cy="0" r="1.7" fill="#0b1220"/>
      <circle cx="5" cy="0" r="1.7" fill="#0b1220"/>
      <path d="M-3,5 q3,3 6,0" stroke="#0b1220" stroke-width="1.3" fill="none"/>
    </g>
    <polygon points="88,100 74,106 88,112" fill="#f8fafc"/>
    <rect x="88" y="82" width="380" height="52" rx="10" fill="#f8fafc"/>
    <text x="102" y="104" font-size="15" fill="#0b1220">prev、curr、next，</text>
    <text x="102" y="126" font-size="15" fill="#0b1220">三根针翻整条链。</text>
    <text x="130" y="150" text-anchor="middle" font-size="11" font-weight="bold" fill="#22d3ee">prev</text>
    <text x="220" y="150" text-anchor="middle" font-size="11" font-weight="bold" fill="#a78bfa">curr</text>
    <text x="310" y="150" text-anchor="middle" font-size="11" font-weight="bold" fill="#f472b6">next</text>
    <text x="40" y="171" font-size="12" fill="#94a3b8">反转前</text>
    <rect x="110" y="156" width="40" height="26" rx="6" fill="#111a30" stroke="#22d3ee" stroke-width="1.5"/>
    <text x="130" y="174" text-anchor="middle" font-size="14" font-weight="bold" fill="#e2e8f0">1</text>
    <line x1="152" y1="169" x2="194" y2="169" stroke="#22d3ee" stroke-width="1.6"/>
    <polygon points="194,164 202,169 194,174" fill="#22d3ee"/>
    <rect x="202" y="156" width="40" height="26" rx="6" fill="#111a30" stroke="#22d3ee" stroke-width="1.5"/>
    <text x="222" y="174" text-anchor="middle" font-size="14" font-weight="bold" fill="#e2e8f0">2</text>
    <line x1="244" y1="169" x2="286" y2="169" stroke="#22d3ee" stroke-width="1.6"/>
    <polygon points="286,164 294,169 286,174" fill="#22d3ee"/>
    <rect x="294" y="156" width="40" height="26" rx="6" fill="#111a30" stroke="#22d3ee" stroke-width="1.5"/>
    <text x="314" y="174" text-anchor="middle" font-size="14" font-weight="bold" fill="#e2e8f0">3</text>
    <line x1="336" y1="169" x2="358" y2="169" stroke="#22d3ee" stroke-width="1.6"/>
    <polygon points="358,164 366,169 358,174" fill="#22d3ee"/>
    <text x="372" y="174" font-size="12" fill="#64748b">null</text>
    <text x="40" y="229" font-size="12" fill="#94a3b8">反转后</text>
    <text x="108" y="232" font-size="12" fill="#64748b">null</text>
    <line x1="166" y1="227" x2="144" y2="227" stroke="#34d399" stroke-width="1.6"/>
    <polygon points="150,222 142,227 150,232" fill="#34d399"/>
    <rect x="168" y="214" width="40" height="26" rx="6" fill="#111a30" stroke="#34d399" stroke-width="1.5"/>
    <text x="188" y="232" text-anchor="middle" font-size="14" font-weight="bold" fill="#e2e8f0">1</text>
    <line x1="258" y1="227" x2="214" y2="227" stroke="#34d399" stroke-width="1.6"/>
    <polygon points="220,222 212,227 220,232" fill="#34d399"/>
    <rect x="260" y="214" width="40" height="26" rx="6" fill="#111a30" stroke="#34d399" stroke-width="1.5"/>
    <text x="280" y="232" text-anchor="middle" font-size="14" font-weight="bold" fill="#e2e8f0">2</text>
    <line x1="350" y1="227" x2="306" y2="227" stroke="#34d399" stroke-width="1.6"/>
    <polygon points="312,222 304,227 312,232" fill="#34d399"/>
    <rect x="352" y="214" width="40" height="26" rx="6" fill="#111a30" stroke="#34d399" stroke-width="1.5"/>
    <text x="372" y="232" text-anchor="middle" font-size="14" font-weight="bold" fill="#e2e8f0">3</text>
    <text x="440" y="174" font-size="12" fill="#94a3b8">每步：先存 next</text>
    <text x="440" y="232" font-size="12" fill="#94a3b8">再掉头指向 prev</text>
    <rect x="24" y="278" width="524" height="52" rx="8" fill="#111a30" stroke="#1e2a44"/>
    <rect x="24" y="278" width="4" height="52" rx="2" fill="#f472b6"/>
    <text x="40" y="300" font-size="13.5" fill="#e2e8f0">curr.next 改指 prev 前先存 next，</text>
    <text x="40" y="320" font-size="13.5" fill="#94a3b8">curr 走到 null 就收工。</text>
  </g>

  <g transform="translate(608,462)">
    <rect width="572" height="361" rx="14" fill="#0e1730" stroke="#223055"/>
    <polygon points="420,0 480,0 150,361 90,361" fill="#f97316" opacity="0.04"/>
    <rect x="14" y="13" width="26" height="20" rx="6" fill="#f97316"/>
    <text x="27" y="28" text-anchor="middle" font-size="14" font-weight="bold" fill="#0b1220">4</text>
    <text x="50" y="29" font-size="17" font-weight="bold" fill="#e2e8f0">结案：指针心法</text>
    <g transform="translate(52,110)">
      <rect x="-19" y="14" width="38" height="22" rx="9" fill="#cbd5e1"/>
      <circle cx="0" cy="-2" r="16" fill="#ffd9b3"/>
      <path d="M-16,-2 a16,16 0 0 1 32,0 q-3,-12 -16,-12 q-13,0 -16,12 z" fill="#e2e8f0"/>
      <circle cx="-5" cy="0" r="4" fill="none" stroke="#94a3b8" stroke-width="1.4"/>
      <circle cx="5" cy="0" r="4" fill="none" stroke="#94a3b8" stroke-width="1.4"/>
      <path d="M-1,0 L1,0" stroke="#94a3b8" stroke-width="1.4"/>
      <circle cx="-5" cy="0" r="1.4" fill="#0b1220"/>
      <circle cx="5" cy="0" r="1.4" fill="#0b1220"/>
      <path d="M-8,5 q8,7 16,0 q-2,7 -8,7 q-6,0 -8,-7 z" fill="#e2e8f0"/>
    </g>
    <polygon points="88,100 74,106 88,112" fill="#f8fafc"/>
    <rect x="88" y="82" width="380" height="52" rx="10" fill="#f8fafc"/>
    <text x="102" y="104" font-size="15" fill="#0b1220">Fiber、LRU、keep-alive，</text>
    <text x="102" y="126" font-size="15" fill="#0b1220">链表无处不在。</text>
    <rect x="24" y="154" width="96" height="26" rx="13" fill="#f97316"/>
    <text x="72" y="172" text-anchor="middle" font-size="13" font-weight="bold" fill="#0b1220">⚠ 坑点</text>
    <rect x="32" y="200" width="9" height="9" rx="2" fill="#f97316"/>
    <text x="52" y="209" font-size="14" fill="#e2e8f0">改 next 前先存下一节点</text>
    <rect x="32" y="228" width="9" height="9" rx="2" fill="#f97316"/>
    <text x="52" y="237" font-size="14" fill="#e2e8f0">快慢指针判断链表是否有环</text>
    <rect x="32" y="256" width="9" height="9" rx="2" fill="#f97316"/>
    <text x="52" y="265" font-size="14" fill="#e2e8f0">head 为 null 的边界要处理</text>
    <rect x="24" y="290" width="524" height="50" rx="8" fill="#111a30" stroke="#1e2a44"/>
    <rect x="24" y="290" width="4" height="50" rx="2" fill="#22d3ee"/>
    <text x="40" y="311" font-size="13.5" font-weight="bold" fill="#22d3ee">码叔总结</text>
    <text x="40" y="331" font-size="13.5" fill="#e2e8f0">数组搬家链表改线，各管一段。</text>
  </g>

  <text x="1180" y="832" text-anchor="end" font-size="11" fill="#475569">NEON INK · frontend-advanced-guide · EP.27</text>
</svg>
