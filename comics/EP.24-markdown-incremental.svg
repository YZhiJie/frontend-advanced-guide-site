    <text x="102" y="104" font-size="15" fill="#0b1220">降频、补围栏、冻结，</text>
    <text x="102" y="126" font-size="15" fill="#0b1220">重渲染只动最后一块。</text>
    <rect x="24" y="152" width="524" height="118" rx="8" fill="#0a0f1c" stroke="#f472b6" stroke-opacity="0.35"/>
    <text x="38" y="174" font-size="12.5" fill="#7dd3fc" font-family="'SF Mono',Consolas,monospace">① 解析降频到 50~100ms</text>
    <text x="38" y="192" font-size="12.5" fill="#7dd3fc" font-family="'SF Mono',Consolas,monospace">② 奇数 ``` 临时补齐再解析</text>
    <text x="38" y="210" font-size="12.5" fill="#34d399" font-family="'SF Mono',Consolas,monospace">③ 已闭合块按 hash memo 冻结</text>
    <text x="38" y="228" font-size="12.5" fill="#fbbf24" font-family="'SF Mono',Consolas,monospace">// 结束再做一次终态解析</text>
    <text x="38" y="246" font-size="12.5" fill="#94a3b8" font-family="'SF Mono',Consolas,monospace">大文档 → Worker + 虚拟列表</text>
    <rect x="24" y="278" width="524" height="52" rx="8" fill="#111a30" stroke="#1e2a44"/>
    <rect x="24" y="278" width="4" height="52" rx="2" fill="#f472b6"/>
    <text x="40" y="300" font-size="13.5" fill="#e2e8f0">高亮缓存、图表闭合后才</text>
    <text x="40" y="320" font-size="13.5" fill="#94a3b8">渲染，视觉稳定不闪烁。</text>
  </g>

