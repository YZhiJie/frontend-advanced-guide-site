  <text x="126" y="40" font-size="26" font-weight="bold" fill="url(#titleGrad)">Markdown 增量渲染</text>
  <text x="1180" y="38" text-anchor="end" font-size="13" fill="#64748b">进阶漫画剧场 · 霓虹墨 NEON INK</text>
