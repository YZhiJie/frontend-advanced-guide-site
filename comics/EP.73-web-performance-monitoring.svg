<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 840" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1220"/><stop offset="1" stop-color="#101a33"/></linearGradient>
    <linearGradient id="titleGrad" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#22d3ee"/><stop offset="1" stop-color="#a78bfa"/></linearGradient>
  </defs>
  <rect width="1200" height="840" fill="url(#bg)"/>
  <polygon points="980,0 1060,0 760,840 680,840" fill="#22d3ee" opacity="0.04"/>

  <rect x="20" y="14" width="92" height="36" rx="9" fill="#7C3AED"/>
  <text x="66" y="38" text-anchor="middle" font-size="18" font-weight="bold" fill="#fff">EP.73</text>
  <text x="126" y="40" font-size="26" font-weight="bold" fill="url(#titleGrad)">看不见的体验监控网</text>
  <text x="1180" y="38" text-anchor="end" font-size="13" fill="#64748b">进阶漫画剧场 · 霓虹墨 NEON INK</text>
  <rect x="20" y="62" width="1160" height="2" rx="1" fill="url(#titleGrad)" opacity="0.6"/>

  <g transform="translate(20,84)">
    <rect width="572" height="361" rx="14" fill="#0e1730" stroke="#223055"/>
    <rect x="14" y="13" width="26" height="20" rx="6" fill="#22d3ee"/>
    <text x="27" y="28" text-anchor="middle" font-size="14" font-weight="bold" fill="#0b1220">1</text>
    <text x="50" y="29" font-size="17" font-weight="bold" fill="#e2e8f0">困境：报错了却没人知道</text>
    <text x="28" y="130" font-size="14" fill="#94a3b8">线上页面白屏，用户投诉才发现，</text>
    <text x="28" y="152" font-size="14" fill="#f97316">开发完全不知道线上有 JS 错误。</text>
    <rect x="24" y="175" width="524" height="94" rx="8" fill="#0a0f1c" stroke="#f97316" stroke-opacity="0.4"/>
    <text x="38" y="198" font-size="13" fill="#fdba74" font-family="monospace">用户: 页面打不开了！</text>
    <text x="38" y="220" font-size="13" fill="#fdba74" font-family="monospace">开发: ？？我本地好好的</text>
    <text x="38" y="242" font-size="13" fill="#fdba74" font-family="monospace">→ 没有错误监控，盲飞</text>
    <rect x="24" y="295" width="524" height="44" rx="8" fill="#111a30" stroke="#1e2a44"/>
    <text x="40" y="322" font-size="13.5" fill="#e2e8f0">没有度量就没有优化，先建监控。</text>
  </g>

  <g transform="translate(608,84)">
    <rect width="572" height="361" rx="14" fill="#0e1730" stroke="#223055"/>
    <rect x="14" y="13" width="26" height="20" rx="6" fill="#a78bfa"/>
    <text x="27" y="28" text-anchor="middle" font-size="14" font-weight="bold" fill="#0b1220">2</text>
    <text x="50" y="29" font-size="17" font-weight="bold" fill="#e2e8f0">揭秘：错误捕获</text>
    <rect x="24" y="50" width="524" height="180" rx="8" fill="#0a0f1c" stroke="#a78bfa" stroke-opacity="0.3"/>
    <text x="38" y="72" font-size="12.5" fill="#7dd3fc" font-family="monospace">// JS 运行时错误</text>
    <text x="38" y="92" font-size="12.5" fill="#f472b6" font-family="monospace">window.onerror = (msg, src, lineno) => {}</text>
    <text x="38" y="112" font-size="12.5" fill="#7dd3fc" font-family="monospace">// Promise 未处理拒绝</text>
    <text x="38" y="132" font-size="12.5" fill="#f472b6" font-family="monospace">addEventListener('unhandledrejection', e => {})</text>
    <text x="38" y="152" font-size="12.5" fill="#7dd3fc" font-family="monospace">// 资源加载错误(捕获阶段)</text>
    <text x="38" y="172" font-size="12.5" fill="#f472b6" font-family="monospace">addEventListener('error', handler, true)</text>
    <text x="38" y="192" font-size="12.5" fill="#94a3b8">React: Error Boundary 捕获渲染错误</text>
    <text x="38" y="214" font-size="12.5" fill="#94a3b8">sourcemap 还原压缩后的堆栈</text>
    <rect x="24" y="250" width="524" height="80" rx="8" fill="#111a30" stroke="#1e2a44"/>
    <text x="40" y="274" font-size="13.5" fill="#e2e8f0">三类错误三种捕获方式，</text>
    <text x="40" y="294" font-size="13.5" fill="#94a3b8">配合 sourcemap 定位源码。</text>
    <text x="40" y="314" font-size="13.5" fill="#94a3b8">上报前脱敏隐私数据。</text>
  </g>

  <g transform="translate(20,465)">
    <rect width="572" height="361" rx="14" fill="#0e1730" stroke="#223055"/>
    <rect x="14" y="13" width="26" height="20" rx="6" fill="#34d399"/>
    <text x="27" y="28" text-anchor="middle" font-size="14" font-weight="bold" fill="#0b1220">3</text>
    <text x="50" y="29" font-size="17" font-weight="bold" fill="#e2e8f0">实证：APM 上报与指纹</text>
    <text x="28" y="70" font-size="14" fill="#94a3b8">每个错误都上报会风暴，</text>
    <text x="28" y="90" font-size="14" fill="#94a3b8">相同错误要合并去重。</text>
    <rect x="24" y="110" width="524" height="150" rx="8" fill="#0a0f1c" stroke="#34d399" stroke-opacity="0.3"/>
    <text x="38" y="132" font-size="12.5" fill="#7dd3fc" font-family="monospace">采样: sampleRate 按概率上报</text>
    <text x="38" y="152" font-size="12.5" fill="#94a3b8">  错误全量, Vitals 采样 1%</text>
    <text x="38" y="172" font-size="12.5" fill="#7dd3fc" font-family="monospace">批量: 攒 N 条合并发送</text>
    <text x="38" y="192" font-size="12.5" fill="#94a3b8">  减少请求数</text>
    <text x="38" y="212" font-size="12.5" fill="#7dd3fc" font-family="monospace">指纹: message+stack 哈希</text>
    <text x="38" y="240" font-size="12.5" fill="#94a3b8">  相同指纹只更新计数</text>
    <rect x="24" y="280" width="524" height="56" rx="8" fill="#111a30" stroke="#1e2a44"/>
    <text x="40" y="305" font-size="13.5" fill="#e2e8f0">采样防风暴，批量减请求，</text>
    <text x="40" y="325" font-size="13.5" fill="#94a3b8">指纹合并相同错误。</text>
  </g>

  <g transform="translate(608,465)">
    <rect width="572" height="361" rx="14" fill="#0e1730" stroke="#223055"/>
    <rect x="14" y="13" width="26" height="20" rx="6" fill="#f472b6"/>
    <text x="27" y="28" text-anchor="middle" font-size="14" font-weight="bold" fill="#0b1220">4</text>
    <text x="50" y="29" font-size="17" font-weight="bold" fill="#e2e8f0">结案：健康评分与告警</text>
    <text x="28" y="70" font-size="14" fill="#94a3b8">采集数据合成健康分，</text>
    <text x="28" y="90" font-size="14" fill="#94a3b8">异常时自动告警。</text>
    <rect x="24" y="110" width="524" height="130" rx="8" fill="#0a0f1c" stroke="#f472b6" stroke-opacity="0.3"/>
    <text x="38" y="132" font-size="12.5" fill="#7dd3fc" font-family="monospace">健康评分 = Vitals(75%) + 错误率(25%)</text>
    <text x="38" y="152" font-size="12.5" fill="#94a3b8">  LCP/CLS/INP 各占 25%</text>
    <text x="38" y="172" font-size="12.5" fill="#7dd3fc" font-family="monospace">告警规则:</text>
    <text x="38" y="192" font-size="12.5" fill="#94a3b8">  错误率环比 +50% → 通知</text>
    <text x="38" y="212" font-size="12.5" fill="#94a3b8">  LCP > 4s → 通知</text>
    <text x="38" y="226" font-size="12.5" fill="#94a3b8">  告警抑制防风暴</text>
    <rect x="24" y="260" width="524" height="76" rx="8" fill="#111a30" stroke="#1e2a44"/>
    <rect x="24" y="260" width="4" height="76" rx="2" fill="#f472b6"/>
    <text x="40" y="285" font-size="13.5" fill="#e2e8f0">核心口诀：错误全量捕获，</text>
    <text x="40" y="305" font-size="13.5" fill="#94a3b8">采样批量上报，指纹聚合去重，</text>
    <text x="40" y="325" font-size="13.5" fill="#94a3b8">健康评分驱动告警。</text>
  </g>
</svg>
