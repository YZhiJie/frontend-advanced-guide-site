<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 840" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif">
  <defs>
    <linearGradient id="bg55" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#101a33"/>
    </linearGradient>
    <linearGradient id="titleGrad55" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="840" fill="url(#bg55)"/>
  <polygon points="980,0 1060,0 760,840 680,840" fill="#f472b6" opacity="0.04"/>
  <polygon points="150,0 220,0 1040,840 970,840" fill="#34d399" opacity="0.03"/>

  <rect x="20" y="14" width="92" height="36" rx="9" fill="#7C3AED"/>
  <text x="66" y="38" text-anchor="middle" font-size="18" font-weight="bold" fill="#ffffff">EP.55</text>
  <text x="126" y="40" font-size="26" font-weight="bold" fill="url(#titleGrad55)">角色不是权限</text>
  <text x="1180" y="38" text-anchor="end" font-size="13" fill="#64748b">进阶漫画剧场 · 霓虹墨 NEON INK</text>
  <rect x="20" y="62" width="1160" height="2" rx="1" fill="url(#titleGrad55)" opacity="0.6"/>

  
  <g transform="translate(20,84)">
    <rect width="572" height="361" rx="14" fill="#0e1730" stroke="#223055"/>
    <polygon points="380,0 450,0 120,361 50,361" fill="#22d3ee" opacity="0.04"/>
    <rect x="14" y="13" width="26" height="20" rx="6" fill="#22d3ee"/>
    <text x="27" y="28" text-anchor="middle" font-size="14" font-weight="bold" fill="#0b1220">1</text>
    <text x="50" y="29" font-size="17" font-weight="bold" fill="#e2e8f0">困境：新角色又要改前端</text>
    <g transform="translate(52,120)">
      <rect x="-19" y="14" width="38" height="22" rx="9" fill="#1d4ed8"/>
      <path d="M-5,18 L5,18 L3.5,27 L0,29 L-3.5,27 Z" fill="#f97316"/>
      <circle cx="0" cy="-2" r="16" fill="#ffd9b3"/>
      <path d="M-16,-2 L-11,-13 L-6,-4 L0,-14 L6,-4 L11,-13 L16,-2 Q0,-11 -16,-2 Z" fill="#f97316"/>
      <circle cx="-5" cy="0" r="1.7" fill="#0b1220"/>
      <circle cx="5" cy="0" r="1.7" fill="#0b1220"/>
      <path d="M-3,5 q3,3 6,0" stroke="#0b1220" stroke-width="1.3" fill="none"/>
    </g>
    <polygon points="88,110 74,116 88,122" fill="#f8fafc"/>
    <rect x="88" y="86" width="440" height="58" rx="10" fill="#f8fafc"/>
    <text x="102" y="110" font-size="15" fill="#0b1220">后端加了个「运营主管」角色，</text>
    <text x="102" y="132" font-size="15" fill="#0b1220">我这前端判断又得改一遍？</text>
    <rect x="24" y="162" width="524" height="82" rx="8" fill="#0a0f1c" stroke="#22d3ee" stroke-opacity="0.35"/>
    <text x="38" y="184" font-size="12.5" fill="#fbbf24" font-family="'SF Mono',Consolas,monospace">// 我写的判断</text>
    <text x="38" y="206" font-size="12.5" fill="#f472b6" font-family="'SF Mono',Consolas,monospace">if (role === 'admin') {</text>
    <text x="38" y="226" font-size="12.5" fill="#7dd3fc" font-family="'SF Mono',Consolas,monospace">  showDeleteBtn = true</text>
    <text x="38" y="246" font-size="12.5" fill="#f472b6" font-family="'SF Mono',Consolas,monospace">}</text>
    <rect x="24" y="254" width="524" height="88" rx="8" fill="#111a30" stroke="#1e2a44"/>
    <rect x="24" y="254" width="4" height="88" rx="2" fill="#f97316"/>
    <text x="40" y="278" font-size="13.5" fill="#e2e8f0">写死角色名 = 每加一个角色就要发版</text>
    <text x="40" y="298" font-size="13.5" fill="#94a3b8">角色是后端的概念，前端不该认识它</text>
    <text x="40" y="318" font-size="13.5" fill="#f97316">← 这是反模式</text>
  </g>

  
  <g transform="translate(608,84)">
    <rect width="572" height="361" rx="14" fill="#0e1730" stroke="#223055"/>
    <polygon points="420,0 480,0 150,361 90,361" fill="#a78bfa" opacity="0.04"/>
    <rect x="14" y="13" width="26" height="20" rx="6" fill="#a78bfa"/>
    <text x="27" y="28" text-anchor="middle" font-size="14" font-weight="bold" fill="#0b1220">2</text>
    <text x="50" y="29" font-size="17" font-weight="bold" fill="#e2e8f0">揭秘：RBAC 三层模型</text>
    <g transform="translate(52,120)">
      <rect x="-19" y="14" width="38" height="22" rx="9" fill="#cbd5e1"/>
      <circle cx="0" cy="-2" r="16" fill="#ffd9b3"/>
      <path d="M-16,-2 a16,16 0 0 1 32,0 q-3,-12 -16,-12 q-13,0 -16,12 z" fill="#e2e8f0"/>
      <circle cx="-5" cy="0" r="4" fill="none" stroke="#94a3b8" stroke-width="1.4"/>
      <circle cx="5" cy="0" r="4" fill="none" stroke="#94a3b8" stroke-width="1.4"/>
      <path d="M-1,0 L1,0" stroke="#94a3b8" stroke-width="1.4"/>
      <circle cx="-5" cy="0" r="1.4" fill="#0b1220"/>
      <circle cx="5" cy="0" r="1.4" fill="#0b1220"/>
      <path d="M-8,5 q8,7 16,0 q-2,7 -8,7 q-6,0 -8,-7 z" fill="#e2e8f0"/>
    </g>
    <polygon points="88,110 74,116 88,122" fill="#f8fafc"/>
    <rect x="88" y="86" width="440" height="58" rx="10" fill="#f8fafc"/>
    <text x="102" y="110" font-size="15" fill="#0b1220">角色只是「权限的容器」，</text>
    <text x="102" y="132" font-size="15" fill="#0b1220">前端只认权限码。</text>
    <rect x="24" y="162" width="524" height="180" rx="8" fill="#0a0f1c" stroke="#a78bfa" stroke-opacity="0.35"/>
    <text x="286" y="184" text-anchor="middle" font-size="14" font-weight="bold" fill="#a78bfa">用户 → 角色 → 权限码</text>
    <rect x="40" y="200" width="140" height="44" rx="8" fill="#111a30" stroke="#22d3ee" stroke-opacity="0.4"/>
    <text x="110" y="228" text-anchor="middle" font-size="14" fill="#e2e8f0">用户 Alice</text>
    <text x="110" y="242" text-anchor="middle" font-size="11" fill="#64748b">roleIds: [r_ops]</text>
    <path d="M180,222 L218,222" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow55)"/>
    <rect x="218" y="200" width="140" height="44" rx="8" fill="#111a30" stroke="#a78bfa" stroke-opacity="0.4"/>
    <text x="288" y="228" text-anchor="middle" font-size="14" fill="#e2e8f0">角色 运营</text>
    <text x="288" y="242" text-anchor="middle" font-size="11" fill="#64748b">perm: [user:view]</text>
    <path d="M358,222 L396,222" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow55)"/>
    <rect x="396" y="200" width="130" height="44" rx="8" fill="#111a30" stroke="#f472b6" stroke-opacity="0.4"/>
    <text x="461" y="228" text-anchor="middle" font-size="14" fill="#e2e8f0">权限码</text>
    <text x="461" y="242" text-anchor="middle" font-size="11" fill="#64748b">user:view</text>
    <text x="286" y="270" text-anchor="middle" font-size="12.5" fill="#34d399">新增角色 = 后端加一条 角色-权限 关系</text>
    <text x="286" y="290" text-anchor="middle" font-size="12.5" fill="#34d399">前端 collectPermissions / hasPermission 零改动</text>
    <text x="286" y="318" text-anchor="middle" font-size="12" fill="#fbbf24">权限码格式：资源:动作（user:edit），* 为超管</text>
  </g>
  <defs>
    <marker id="arrow55" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
  </defs>

  
  <g transform="translate(20,462)">
    <rect width="572" height="361" rx="14" fill="#0e1730" stroke="#223055"/>
    <polygon points="380,0 450,0 120,361 50,361" fill="#f472b6" opacity="0.04"/>
    <rect x="14" y="13" width="26" height="20" rx="6" fill="#f472b6"/>
    <text x="27" y="28" text-anchor="middle" font-size="14" font-weight="bold" fill="#0b1220">3</text>
    <text x="50" y="29" font-size="17" font-weight="bold" fill="#e2e8f0">实证：权限码合并与判定</text>
    <g transform="translate(52,110)">
      <rect x="-19" y="14" width="38" height="22" rx="9" fill="#a78bfa"/>
      <circle cx="0" cy="-2" r="16" fill="#ffd9b3"/>
      <path d="M-16,-4 Q-8,-16 0,-4 Q8,-16 16,-4 Q8,-8 0,-4 Q-8,-8 -16,-4 Z" fill="#22d3ee"/>
      <path d="M0,-16 L0,-4" stroke="#22d3ee" stroke-width="3"/>
      <circle cx="-5" cy="0" r="1.7" fill="#0b1220"/>
      <circle cx="5" cy="0" r="1.7" fill="#0b1220"/>
      <path d="M-3,5 q3,3 6,0" stroke="#0b1220" stroke-width="1.3" fill="none"/>
      <rect x="-14" y="12" width="28" height="18" rx="4" fill="#7C3AED"/>
      <text x="0" y="25" text-anchor="middle" font-size="10" font-weight="bold" fill="#fff">{"}"}</text>
    </g>
    <polygon points="88,100 74,106 88,112" fill="#f8fafc"/>
    <rect x="88" y="76" width="440" height="50" rx="10" fill="#f8fafc"/>
    <text x="102" y="98" font-size="15" fill="#0b1220">运营 + 财务双角色，权限码自动合并：</text>
    <text x="102" y="118" font-size="15" fill="#0b1220">去重后一次算完。</text>
    <rect x="24" y="142" width="524" height="198" rx="8" fill="#0a0f1c" stroke="#f472b6" stroke-opacity="0.35"/>
    <text x="38" y="164" font-size="12.5" fill="#22d3ee" font-family="'SF Mono',Consolas,monospace">// 合并角色权限码（超管直接返回 ["*"]）</text>
    <text x="38" y="184" font-size="12.5" fill="#f472b6" font-family="'SF Mono',Consolas,monospace">collectPermissions(user, roles)</text>
    <text x="38" y="206" font-size="12.5" fill="#7dd3fc" font-family="'SF Mono',Consolas,monospace">  → ['user:view', 'order:*', 'finance:*']</text>
    <text x="38" y="232" font-size="12.5" fill="#22d3ee" font-family="'SF Mono',Consolas,monospace">// 判定：只认权限码，不认角色名</text>
    <text x="38" y="252" font-size="12.5" fill="#34d399" font-family="'SF Mono',Consolas,monospace">hasPermission('order:refund', perms)  → true</text>
    <text x="38" y="272" font-size="12.5" fill="#34d399" font-family="'SF Mono',Consolas,monospace">hasPermission('user:delete', perms)  → false</text>
    <text x="38" y="298" font-size="12" fill="#fbbf24" font-family="'SF Mono',Consolas,monospace">matchRule: owned==='*' 全通</text>
    <text x="38" y="316" font-size="12" fill="#fbbf24" font-family="'SF Mono',Consolas,monospace">owned.endsWith(':*')  → 资源级通配</text>
    <text x="38" y="334" font-size="12" fill="#fbbf24" font-family="'SF Mono',Consolas,monospace">注意 startsWith 前缀必须带冒号防越权</text>
  </g>

  
  <g transform="translate(608,462)">
    <rect width="572" height="361" rx="14" fill="#0e1730" stroke="#223055"/>
    <polygon points="420,0 480,0 150,361 90,361" fill="#f97316" opacity="0.04"/>
    <rect x="14" y="13" width="26" height="20" rx="6" fill="#f97316"/>
    <text x="27" y="28" text-anchor="middle" font-size="14" font-weight="bold" fill="#0b1220">4</text>
    <text x="50" y="29" font-size="17" font-weight="bold" fill="#e2e8f0">结案：超管别用 * 权限码</text>
    <g transform="translate(52,110)">
      <rect x="-19" y="14" width="38" height="22" rx="9" fill="#cbd5e1"/>
      <circle cx="0" cy="-2" r="16" fill="#ffd9b3"/>
      <path d="M-16,-2 a16,16 0 0 1 32,0 q-3,-12 -16,-12 q-13,0 -16,12 z" fill="#e2e8f0"/>
      <circle cx="-5" cy="0" r="4" fill="none" stroke="#94a3b8" stroke-width="1.4"/>
      <circle cx="5" cy="0" r="4" fill="none" stroke="#94a3b8" stroke-width="1.4"/>
      <path d="M-1,0 L1,0" stroke="#94a3b8" stroke-width="1.4"/>
      <circle cx="-5" cy="0" r="1.4" fill="#0b1220"/>
      <circle cx="5" cy="0" r="1.4" fill="#0b1220"/>
      <path d="M-8,5 q8,7 16,0 q-2,7 -8,7 q-6,0 -8,-7 z" fill="#e2e8f0"/>
    </g>
    <polygon points="88,100 74,106 88,112" fill="#f8fafc"/>
    <rect x="88" y="76" width="440" height="50" rx="10" fill="#f8fafc"/>
    <text x="102" y="98" font-size="15" fill="#0b1220">超管身份用独立字段，</text>
    <text x="102" y="118" font-size="15" fill="#0b1220">别靠一个 * 权限码。</text>
    <rect x="24" y="142" width="524" height="70" rx="8" fill="#0a0f1c" stroke="#f97316" stroke-opacity="0.35"/>
    <rect x="24" y="142" width="4" height="70" rx="2" fill="#f97316"/>
    <text x="38" y="166" font-size="13.5" font-weight="bold" fill="#f97316">⚠ 坑点：超管用 * 权限码</text>
    <text x="38" y="186" font-size="12.5" fill="#e2e8f0">后端角色表误删 * → 超管降级被锁死</text>
    <text x="38" y="204" font-size="12.5" fill="#94a3b8">正确：isSuperAdmin 布尔字段，判定层直接放行</text>
    <rect x="24" y="224" width="524" height="118" rx="8" fill="#111a30" stroke="#34d399" stroke-opacity="0.3"/>
    <text x="40" y="248" font-size="13.5" font-weight="bold" fill="#34d399">✓ 三条最佳实践</text>
    <text x="40" y="270" font-size="12.5" fill="#e2e8f0">1. 前端只出现 permissionCodes，不出现角色名</text>
    <text x="40" y="290" font-size="12.5" fill="#e2e8f0">2. 权限码用 模块:资源:动作 三级，避免重名</text>
    <text x="40" y="310" font-size="12.5" fill="#e2e8f0">3. 超管 isSuperAdmin 绕过，不查角色-权限表</text>
    <text x="40" y="332" font-size="12" fill="#64748b">码叔：角色是给人看的，权限码是给机器判的。</text>
  </g>
</svg>
