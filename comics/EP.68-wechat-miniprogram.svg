<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 840" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1220"/><stop offset="1" stop-color="#101a33"/></linearGradient>
    <linearGradient id="titleGrad" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#22d3ee"/><stop offset="1" stop-color="#a78bfa"/></linearGradient>
  </defs>
  <rect width="1200" height="840" fill="url(#bg)"/>
  <polygon points="980,0 1060,0 760,840 680,840" fill="#22d3ee" opacity="0.04"/>

  <rect x="20" y="14" width="92" height="36" rx="9" fill="#7C3AED"/>
  <text x="66" y="38" text-anchor="middle" font-size="18" font-weight="bold" fill="#fff">EP.68</text>
  <text x="126" y="40" font-size="26" font-weight="bold" fill="url(#titleGrad)">小程序的双线程秘密</text>
  <text x="1180" y="38" text-anchor="end" font-size="13" fill="#64748b">进阶漫画剧场 · 霓虹墨 NEON INK</text>
  <rect x="20" y="62" width="1160" height="2" rx="1" fill="url(#titleGrad)" opacity="0.6"/>

  <g transform="translate(20,84)">
    <rect width="572" height="361" rx="14" fill="#0e1730" stroke="#223055"/>
    <rect x="14" y="13" width="26" height="20" rx="6" fill="#22d3ee"/>
    <text x="27" y="28" text-anchor="middle" font-size="14" font-weight="bold" fill="#0b1220">1</text>
    <text x="50" y="29" font-size="17" font-weight="bold" fill="#e2e8f0">困境：setData 卡顿</text>
    <text x="28" y="130" font-size="14" fill="#94a3b8">列表更新时整个页面卡住，</text>
    <text x="28" y="152" font-size="14" fill="#f97316">每秒 setData 几十次，越来越卡。</text>
    <rect x="24" y="175" width="524" height="94" rx="8" fill="#0a0f1c" stroke="#f97316" stroke-opacity="0.4"/>
    <text x="38" y="198" font-size="13" fill="#fdba74" font-family="monospace">setData(this.data)  // 全量传</text>
    <text x="38" y="220" font-size="13" fill="#fdba74" font-family="monospace">数据跨线程序列化传输</text>
    <text x="38" y="242" font-size="13" fill="#fdba74" font-family="monospace">→ 渲染层 diff 整个对象</text>
    <rect x="24" y="295" width="524" height="44" rx="8" fill="#111a30" stroke="#1e2a44"/>
    <text x="40" y="322" font-size="13.5" fill="#e2e8f0">setData 是双线程唯一通道，不能滥用。</text>
  </g>

  <g transform="translate(608,84)">
    <rect width="572" height="361" rx="14" fill="#0e1730" stroke="#223055"/>
    <rect x="14" y="13" width="26" height="20" rx="6" fill="#a78bfa"/>
    <text x="27" y="28" text-anchor="middle" font-size="14" font-weight="bold" fill="#0b1220">2</text>
    <text x="50" y="29" font-size="17" font-weight="bold" fill="#e2e8f0">揭秘：双线程模型</text>
    <rect x="24" y="50" width="524" height="180" rx="8" fill="#0a0f1c" stroke="#a78bfa" stroke-opacity="0.3"/>
    <text x="38" y="72" font-size="12.5" fill="#f472b6" font-family="monospace">[逻辑层] JSCore 跑 JS</text>
    <text x="38" y="92" font-size="12.5" fill="#94a3b8">    ↑↓ setData (序列化传输)</text>
    <text x="38" y="112" font-size="12.5" fill="#7dd3fc" font-family="monospace">[渲染层] WebView 渲染 WXML</text>
    <text x="38" y="132" font-size="12.5" fill="#94a3b8">两层隔离，不能直接通信</text>
    <text x="38" y="152" font-size="12.5" fill="#f472b6" font-family="monospace">// 正确：只传变化字段</text>
    <text x="38" y="172" font-size="12.5" fill="#94a3b8">setData({ 'list[0].title': x })</text>
    <text x="38" y="192" font-size="12.5" fill="#94a3b8">setData({ 'user.name': 'xx' })</text>
    <text x="38" y="214" font-size="12.5" fill="#94a3b8">单次 setData 数据 &lt; 256KB</text>
    <rect x="24" y="250" width="524" height="80" rx="8" fill="#111a30" stroke="#1e2a44"/>
    <text x="40" y="274" font-size="13.5" fill="#e2e8f0">逻辑层管数据，渲染层管 UI，</text>
    <text x="40" y="294" font-size="13.5" fill="#94a3b8">setData 是唯一桥梁。</text>
    <text x="40" y="314" font-size="13.5" fill="#94a3b8">只传变化的，别传整个 data。</text>
  </g>

  <g transform="translate(20,465)">
    <rect width="572" height="361" rx="14" fill="#0e1730" stroke="#223055"/>
    <rect x="14" y="13" width="26" height="20" rx="6" fill="#34d399"/>
    <text x="27" y="28" text-anchor="middle" font-size="14" font-weight="bold" fill="#0b1220">3</text>
    <text x="50" y="29" font-size="17" font-weight="bold" fill="#e2e8f0">实证：生命周期与登录</text>
    <text x="28" y="70" font-size="14" fill="#94a3b8">页面生命周期顺序不能乱，</text>
    <text x="28" y="90" font-size="14" fill="#94a3b8">登录要走 code→openid→token 流程。</text>
    <rect x="24" y="110" width="524" height="150" rx="8" fill="#0a0f1c" stroke="#34d399" stroke-opacity="0.3"/>
    <text x="38" y="132" font-size="12.5" fill="#7dd3fc" font-family="monospace">Page 生命周期:</text>
    <text x="38" y="152" font-size="12.5" fill="#94a3b8">  onLoad → onShow → onReady</text>
    <text x="38" y="172" font-size="12.5" fill="#94a3b8">  onHide → onUnload</text>
    <text x="38" y="192" font-size="12.5" fill="#7dd3fc" font-family="monospace">登录流程:</text>
    <text x="38" y="212" font-size="12.5" fill="#f472b6" font-family="monospace">  wx.login()→code→后端换 openid</text>
    <text x="38" y="240" font-size="12.5" fill="#94a3b8">  → 签发 token → 前端存储</text>
    <rect x="24" y="280" width="524" height="56" rx="8" fill="#111a30" stroke="#1e2a44"/>
    <text x="40" y="305" font-size="13.5" fill="#e2e8f0">onLoad 拿参数发请求，</text>
    <text x="40" y="325" font-size="13.5" fill="#94a3b8">onUnload 清定时器，登录走 code 换 token。</text>
  </g>

  <g transform="translate(608,465)">
    <rect width="572" height="361" rx="14" fill="#0e1730" stroke="#223055"/>
    <rect x="14" y="13" width="26" height="20" rx="6" fill="#f472b6"/>
    <text x="27" y="28" text-anchor="middle" font-size="14" font-weight="bold" fill="#0b1220">4</text>
    <text x="50" y="29" font-size="17" font-weight="bold" fill="#e2e8f0">结案：分包与组件通信</text>
    <text x="28" y="70" font-size="14" fill="#94a3b8">主包限 2MB，非首屏拆分包；</text>
    <text x="28" y="90" font-size="14" fill="#94a3b8">父子组件用 properties+triggerEvent。</text>
    <rect x="24" y="110" width="524" height="130" rx="8" fill="#0a0f1c" stroke="#f472b6" stroke-opacity="0.3"/>
    <text x="38" y="132" font-size="12.5" fill="#7dd3fc" font-family="monospace">分包: 主包≤2MB, 单分包≤2MB, 总≤20MB</text>
    <text x="38" y="152" font-size="12.5" fill="#94a3b8">  主包: tabBar + 首屏页面</text>
    <text x="38" y="172" font-size="12.5" fill="#94a3b8">  分包: 非首屏页面按需加载</text>
    <text x="38" y="192" font-size="12.5" fill="#7dd3fc" font-family="monospace">组件通信:</text>
    <text x="38" y="212" font-size="12.5" fill="#94a3b8">  父→子: properties</text>
    <text x="38" y="226" font-size="12.5" fill="#94a3b8">  子→父: triggerEvent('event', detail)</text>
    <rect x="24" y="260" width="524" height="76" rx="8" fill="#111a30" stroke="#1e2a44"/>
    <rect x="24" y="260" width="4" height="76" rx="2" fill="#f472b6"/>
    <text x="40" y="285" font-size="13.5" fill="#e2e8f0">核心口诀：setData 只传变化，</text>
    <text x="40" y="305" font-size="13.5" fill="#94a3b8">主包放首屏，父子用 properties+triggerEvent。</text>
    <text x="40" y="325" font-size="13.5" fill="#94a3b8">登录走 code 换 token。</text>
  </g>
</svg>
