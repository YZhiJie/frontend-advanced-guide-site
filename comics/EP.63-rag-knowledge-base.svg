<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 840" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1220"/><stop offset="1" stop-color="#101a33"/></linearGradient>
    <linearGradient id="titleGrad" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#22d3ee"/><stop offset="1" stop-color="#a78bfa"/></linearGradient>
  </defs>
  <rect width="1200" height="840" fill="url(#bg)"/>
  <polygon points="980,0 1060,0 760,840 680,840" fill="#22d3ee" opacity="0.04"/>

  <rect x="20" y="14" width="92" height="36" rx="9" fill="#7C3AED"/>
  <text x="66" y="38" text-anchor="middle" font-size="18" font-weight="bold" fill="#fff">EP.63</text>
  <text x="126" y="40" font-size="26" font-weight="bold" fill="url(#titleGrad)">RAG 让 AI 不再胡说</text>
  <text x="1180" y="38" text-anchor="end" font-size="13" fill="#64748b">进阶漫画剧场 · 霓虹墨 NEON INK</text>
  <rect x="20" y="62" width="1160" height="2" rx="1" fill="url(#titleGrad)" opacity="0.6"/>

  <g transform="translate(20,84)">
    <rect width="572" height="361" rx="14" fill="#0e1730" stroke="#223055"/>
    <rect x="14" y="13" width="26" height="20" rx="6" fill="#22d3ee"/>
    <text x="27" y="28" text-anchor="middle" font-size="14" font-weight="bold" fill="#0b1220">1</text>
    <text x="50" y="29" font-size="17" font-weight="bold" fill="#e2e8f0">困境：大模型幻觉</text>
    <text x="28" y="130" font-size="14" fill="#94a3b8">"你们产品去年营收多少？"</text>
    <text x="28" y="152" font-size="14" fill="#f97316">AI 一本正经地编了个数……</text>
    <rect x="24" y="175" width="524" height="94" rx="8" fill="#0a0f1c" stroke="#f97316" stroke-opacity="0.4"/>
    <text x="38" y="198" font-size="13" fill="#fdba74" font-family="monospace">用户问 → LLM 凭空生成</text>
    <text x="38" y="220" font-size="13" fill="#fdba74" font-family="monospace">训练数据截止，不知道最新信息</text>
    <text x="38" y="242" font-size="13" fill="#fdba74" font-family="monospace">→ 幻觉（Hallucination）</text>
    <rect x="24" y="295" width="524" height="44" rx="8" fill="#111a30" stroke="#1e2a44"/>
    <text x="40" y="322" font-size="13.5" fill="#e2e8f0">问题本质：模型不知道你的私有数据。</text>
  </g>

  <g transform="translate(608,84)">
    <rect width="572" height="361" rx="14" fill="#0e1730" stroke="#223055"/>
    <rect x="14" y="13" width="26" height="20" rx="6" fill="#a78bfa"/>
    <text x="27" y="28" text-anchor="middle" font-size="14" font-weight="bold" fill="#0b1220">2</text>
    <text x="50" y="29" font-size="17" font-weight="bold" fill="#e2e8f0">揭秘：检索增强生成</text>
    <rect x="24" y="50" width="524" height="180" rx="8" fill="#0a0f1c" stroke="#a78bfa" stroke-opacity="0.3"/>
    <text x="38" y="72" font-size="12.5" fill="#7dd3fc" font-family="monospace">用户问题</text>
    <text x="38" y="92" font-size="12.5" fill="#94a3b8">    ↓ 向量化</text>
    <text x="38" y="112" font-size="12.5" fill="#7dd3fc" font-family="monospace">向量数据库检索 Top-K 相关文档</text>
    <text x="38" y="132" font-size="12.5" fill="#94a3b8">    ↓ 拼装 Prompt</text>
    <text x="38" y="152" font-size="12.5" fill="#f472b6" font-family="monospace">[上下文] + [问题] → LLM</text>
    <text x="38" y="172" font-size="12.5" fill="#94a3b8">    ↓ 生成</text>
    <text x="38" y="192" font-size="12.5" fill="#7dd3fc" font-family="monospace">基于检索内容回答</text>
    <text x="38" y="214" font-size="12.5" fill="#94a3b8">RAG = Retrieval + Augmented + Generation</text>
    <rect x="24" y="250" width="524" height="80" rx="8" fill="#111a30" stroke="#1e2a44"/>
    <text x="40" y="274" font-size="13.5" fill="#e2e8f0">核心思想：不微调模型，</text>
    <text x="40" y="294" font-size="13.5" fill="#94a3b8">而是把私有知识检索出来喂给模型。</text>
    <text x="40" y="314" font-size="13.5" fill="#94a3b8">模型只负责"阅读理解+生成"。</text>
  </g>

  <g transform="translate(20,465)">
    <rect width="572" height="361" rx="14" fill="#0e1730" stroke="#223055"/>
    <rect x="14" y="13" width="26" height="20" rx="6" fill="#34d399"/>
    <text x="27" y="28" text-anchor="middle" font-size="14" font-weight="bold" fill="#0b1220">3</text>
    <text x="50" y="29" font-size="17" font-weight="bold" fill="#e2e8f0">实证：分块与 embedding</text>
    <text x="28" y="70" font-size="14" fill="#94a3b8">文档太长塞不进 Prompt，先切块。</text>
    <text x="28" y="90" font-size="14" fill="#94a3b8">每块转 embedding 向量，存向量数据库。</text>
    <rect x="24" y="110" width="524" height="150" rx="8" fill="#0a0f1c" stroke="#34d399" stroke-opacity="0.3"/>
    <text x="38" y="132" font-size="12.5" fill="#7dd3fc" font-family="monospace">文档 → 分块(chunk) → embedding</text>
    <text x="38" y="152" font-size="12.5" fill="#94a3b8">分块策略：按 token 数(512)+ 重叠(50)</text>
    <text x="38" y="172" font-size="12.5" fill="#94a3b8">避免语义被切断</text>
    <text x="38" y="192" font-size="12.5" fill="#f472b6" font-family="monospace">相似度 = cosine(query_vec, chunk_vec)</text>
    <text x="38" y="212" font-size="12.5" fill="#94a3b8">取 Top-K 最相关的块</text>
    <text x="38" y="240" font-size="12.5" fill="#94a3b8">重排(Rerank)：用交叉编码器精排</text>
    <rect x="24" y="280" width="524" height="56" rx="8" fill="#111a30" stroke="#1e2a44"/>
    <text x="40" y="305" font-size="13.5" fill="#e2e8f0">分块质量决定检索质量，</text>
    <text x="40" y="325" font-size="13.5" fill="#94a3b8">重叠窗口防止语义断裂。</text>
  </g>

  <g transform="translate(608,465)">
    <rect width="572" height="361" rx="14" fill="#0e1730" stroke="#223055"/>
    <rect x="14" y="13" width="26" height="20" rx="6" fill="#f472b6"/>
    <text x="27" y="28" text-anchor="middle" font-size="14" font-weight="bold" fill="#0b1220">4</text>
    <text x="50" y="29" font-size="17" font-weight="bold" fill="#e2e8f0">结案：对话记忆</text>
    <text x="28" y="70" font-size="14" fill="#94a3b8">多轮对话需要上下文，</text>
    <text x="28" y="90" font-size="14" fill="#94a3b8">但 Prompt 长度有限，要做窗口管理。</text>
    <rect x="24" y="110" width="524" height="130" rx="8" fill="#0a0f1c" stroke="#f472b6" stroke-opacity="0.3"/>
    <text x="38" y="132" font-size="12.5" fill="#7dd3fc" font-family="monospace">策略1: 滑动窗口(最近 N 轮)</text>
    <text x="38" y="152" font-size="12.5" fill="#7dd3fc" font-family="monospace">策略2: 摘要压缩(历史→一句话)</text>
    <text x="38" y="172" font-size="12.5" fill="#7dd3fc" font-family="monospace">策略3: 向量记忆(语义检索历史)</text>
    <text x="38" y="192" font-size="12.5" fill="#94a3b8">工程常用：滑动窗口 + 摘要混合</text>
    <text x="38" y="220" font-size="12.5" fill="#94a3b8">Token 预算 = 系统提示 + 检索 + 历史 + 回答</text>
    <rect x="24" y="260" width="524" height="76" rx="8" fill="#111a30" stroke="#1e2a44"/>
    <rect x="24" y="260" width="4" height="76" rx="2" fill="#f472b6"/>
    <text x="40" y="285" font-size="13.5" fill="#e2e8f0">核心口诀：先检索再生成，</text>
    <text x="40" y="305" font-size="13.5" fill="#94a3b8">分块要带重叠，对话要管窗口。</text>
    <text x="40" y="325" font-size="13.5" fill="#94a3b8">让 AI 基于事实说话，不再胡说。</text>
  </g>
</svg>
