<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 840" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1220"/><stop offset="1" stop-color="#101a33"/></linearGradient>
    <linearGradient id="titleGrad" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#22d3ee"/><stop offset="1" stop-color="#a78bfa"/></linearGradient>
  </defs>
  <rect width="1200" height="840" fill="url(#bg)"/>
  <polygon points="980,0 1060,0 760,840 680,840" fill="#22d3ee" opacity="0.04"/>

  <rect x="20" y="14" width="92" height="36" rx="9" fill="#7C3AED"/>
  <text x="66" y="38" text-anchor="middle" font-size="18" font-weight="bold" fill="#fff">EP.64</text>
  <text x="126" y="40" font-size="26" font-weight="bold" fill="url(#titleGrad)">画布上的节点连线</text>
  <text x="1180" y="38" text-anchor="end" font-size="13" fill="#64748b">进阶漫画剧场 · 霓虹墨 NEON INK</text>
  <rect x="20" y="62" width="1160" height="2" rx="1" fill="url(#titleGrad)" opacity="0.6"/>

  <g transform="translate(20,84)">
    <rect width="572" height="361" rx="14" fill="#0e1730" stroke="#223055"/>
    <rect x="14" y="13" width="26" height="20" rx="6" fill="#22d3ee"/>
    <text x="27" y="28" text-anchor="middle" font-size="14" font-weight="bold" fill="#0b1220">1</text>
    <text x="50" y="29" font-size="17" font-weight="bold" fill="#e2e8f0">困境：拖拽连线乱成麻</text>
    <text x="28" y="130" font-size="14" fill="#94a3b8">可视化编辑器：节点可以拖、可以连线，</text>
    <text x="28" y="152" font-size="14" fill="#f97316">但线连错了形成环，执行死循环……</text>
    <rect x="24" y="175" width="524" height="94" rx="8" fill="#0a0f1c" stroke="#f97316" stroke-opacity="0.4"/>
    <text x="38" y="198" font-size="13" fill="#fdba74" font-family="monospace">A → B → C → A  (环！)</text>
    <text x="38" y="220" font-size="13" fill="#fdba74" font-family="monospace">数据在节点间无限循环</text>
    <text x="38" y="242" font-size="13" fill="#fdba74" font-family="monospace">→ 浏览器卡死</text>
    <rect x="24" y="295" width="524" height="44" rx="8" fill="#111a30" stroke="#1e2a44"/>
    <text x="40" y="322" font-size="13.5" fill="#e2e8f0">问题本质：图结构必须是 DAG（有向无环图）。</text>
  </g>

  <g transform="translate(608,84)">
    <rect width="572" height="361" rx="14" fill="#0e1730" stroke="#223055"/>
    <rect x="14" y="13" width="26" height="20" rx="6" fill="#a78bfa"/>
    <text x="27" y="28" text-anchor="middle" font-size="14" font-weight="bold" fill="#0b1220">2</text>
    <text x="50" y="29" font-size="17" font-weight="bold" fill="#e2e8f0">揭秘：图数据模型</text>
    <rect x="24" y="50" width="524" height="180" rx="8" fill="#0a0f1c" stroke="#a78bfa" stroke-opacity="0.3"/>
    <text x="38" y="72" font-size="12.5" fill="#7dd3fc" font-family="monospace">Node { id, type, position, data }</text>
    <text x="38" y="92" font-size="12.5" fill="#7dd3fc" font-family="monospace">Edge { id, source, target, sourceHandle }</text>
    <text x="38" y="112" font-size="94a3b8" fill="#94a3b8">React Flow 的核心数据结构</text>
    <text x="38" y="132" font-size="12.5" fill="#f472b6" font-family="monospace">连线合法性校验：</text>
    <text x="38" y="152" font-size="12.5" fill="#94a3b8">  · source !== target（不能连自己）</text>
    <text x="38" y="172" font-size="12.5" fill="#94a3b8">  · handle 类型匹配（out→in）</text>
    <text x="38" y="192" font-size="12.5" fill="#94a3b8">  · 加边后无环（DFS 检测）</text>
    <text x="38" y="214" font-size="12.5" fill="#94a3b8">连线前校验，非法连线直接拒绝</text>
    <rect x="24" y="250" width="524" height="80" rx="8" fill="#111a30" stroke="#1e2a44"/>
    <text x="40" y="274" font-size="13.5" fill="#e2e8f0">图 = 节点 + 边，</text>
    <text x="40" y="294" font-size="13.5" fill="#94a3b8">所有操作都是对这两个数组的增删改。</text>
    <text x="40" y="314" font-size="13.5" fill="#94a3b8">React Flow / X6 / Vue Flow 同理。</text>
  </g>

  <g transform="translate(20,465)">
    <rect width="572" height="361" rx="14" fill="#0e1730" stroke="#223055"/>
    <rect x="14" y="13" width="26" height="20" rx="6" fill="#34d399"/>
    <text x="27" y="28" text-anchor="middle" font-size="14" font-weight="bold" fill="#0b1220">3</text>
    <text x="50" y="29" font-size="17" font-weight="bold" fill="#e2e8f0">实证：环检测（DFS三色法）</text>
    <text x="28" y="70" font-size="14" fill="#94a3b8">用深度优先搜索遍历图，</text>
    <text x="28" y="90" font-size="14" fill="#94a3b8">遇到正在访问中的节点 = 有环。</text>
    <rect x="24" y="110" width="524" height="150" rx="8" fill="#0a0f1c" stroke="#34d399" stroke-opacity="0.3"/>
    <text x="38" y="132" font-size="12.5" fill="#7dd3fc" font-family="monospace">function hasCycle(graph):</text>
    <text x="38" y="152" font-size="12.5" fill="#f472b6" font-family="monospace">  visited=0, inStack=1, done=2</text>
    <text x="38" y="172" font-size="12.5" fill="#f472b6" font-family="monospace">  dfs(node):</text>
    <text x="38" y="192" font-size="12.5" fill="#f472b6" font-family="monospace">    if node in inStack: return true</text>
    <text x="38" y="212" font-size="12.5" fill="#f472b6" font-family="monospace">    mark inStack; dfs(neighbors)</text>
    <text x="38" y="232" font-size="12.5" fill="#f472b6" font-family="monospace">    mark done</text>
    <text x="38" y="246" font-size="12.5" fill="#94a3b8">时间复杂度 O(V+E)</text>
    <rect x="24" y="280" width="524" height="56" rx="8" fill="#111a30" stroke="#1e2a44"/>
    <text x="40" y="305" font-size="13.5" fill="#e2e8f0">环检测是画布的安全网，</text>
    <text x="40" y="325" font-size="13.5" fill="#94a3b8">每次加边前都要跑一遍。</text>
  </g>

  <g transform="translate(608,465)">
    <rect width="572" height="361" rx="14" fill="#0e1730" stroke="#223055"/>
    <rect x="14" y="13" width="26" height="20" rx="6" fill="#f472b6"/>
    <text x="27" y="28" text-anchor="middle" font-size="14" font-weight="bold" fill="#0b1220">4</text>
    <text x="50" y="29" font-size="17" font-weight="bold" fill="#e2e8f0">结案：自动布局与视口</text>
    <text x="28" y="70" font-size="14" fill="#94a3b8">节点多了手动摆放太费劲，</text>
    <text x="28" y="90" font-size="14" fill="#94a3b8">用 dagre / elkjs 自动布局。</text>
    <rect x="24" y="110" width="524" height="130" rx="8" fill="#0a0f1c" stroke="#f472b6" stroke-opacity="0.3"/>
    <text x="38" y="132" font-size="12.5" fill="#7dd3fc" font-family="monospace">dagre: 有向图自动分层布局</text>
    <text x="38" y="152" font-size="12.5" fill="#94a3b8">  rankdir: 'LR' (左→右) / 'TB' (上→下)</text>
    <text x="38" y="172" font-size="12.5" fill="#94a3b8">  nodesep / ranksep 控制间距</text>
    <text x="38" y="192" font-size="12.5" fill="#7dd3fc" font-family="monospace">视口: zoom + pan</text>
    <text x="38" y="212" font-size="12.5" fill="#94a3b8">  支持缩放、拖拽、fitView 自适应</text>
    <text x="38" y="226" font-size="12.5" fill="#94a3b8">  mini-map 小地图导航</text>
    <rect x="24" y="260" width="524" height="76" rx="8" fill="#111a30" stroke="#1e2a44"/>
    <rect x="24" y="260" width="4" height="76" rx="2" fill="#f472b6"/>
    <text x="40" y="285" font-size="13.5" fill="#e2e8f0">核心口诀：图是节点+边，</text>
    <text x="40" y="305" font-size="13.5" fill="#94a3b8">加边前查环，布局用 dagre。</text>
    <text x="40" y="325" font-size="13.5" fill="#94a3b8">画布 = 数据驱动 + 交互增强。</text>
  </g>
</svg>
